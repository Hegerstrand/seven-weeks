<svg xmlns="http://www.w3.org/2000/svg" width="1100mm" height="1215mm" viewBox="0 0 1100 1215">
<title>Table layout check (dev, not a print component)</title>
<desc>Every board at its true footprint (viewBox verified against its known mm size). Board 3
is now really widened to 333mm (was 297) and 3b Standing to 317mm (was 281), so the top row
(board 4 + board 3) packs edge to edge with the bottom row at 630mm wide, zero gap. Board 1 is
also really 332mm tall now (was 297) after the week-1/clock strip moved to a bottom band -
board 2 has not grown to match yet, so the bottom row is flagged the way board 3 used to be.
One example player board sits on each side. True 1:1 mm scale throughout. Not glued, not
printed - open it in a browser.
The placement-line layer prototypes the printed table-placement guide: only the seams that
actually cross from one board to another are drawn (no outer-perimeter line) - each of the 5
board-to-board seams gets its own colour, drawn as a pair of 6mm-inset lines, one on each side
of the seam. Correct assembly puts two same-coloured lines side by side; a board in the wrong
slot, or rotated, shows up immediately as a colour that doesn't match its neighbour, or a line
that doesn't line up with it - only one placement and orientation reads as correct.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .q { fill:#3A3A3A; }
  .table  { fill:#EFE3D0; stroke:#C7B79A; stroke-width:1.5; }
  .board  { fill:#FFFFFF; fill-opacity:.9; stroke:#000000; stroke-width:1; }
  .rectangle { fill:none; stroke:#000000; stroke-width:2.2; }
  .pair   { fill:none; stroke:#D08A1E; stroke-width:1; stroke-dasharray:6 4; }
  .spare  { fill:#F4EFE6; stroke:#905151; stroke-width:1; stroke-dasharray:2 2; }
  .player { fill:#DCE7F2; fill-opacity:.85; stroke:#1565C0; stroke-width:1; }
  .seam-43 { fill:none; stroke:#6E7A54; stroke-width:1.6; }
  .seam-41 { fill:none; stroke:#3F5B66; stroke-width:1.6; }
  .seam-31 { fill:none; stroke:#9C7A32; stroke-width:1.6; }
  .seam-32 { fill:none; stroke:#905151; stroke-width:1.6; }
  .seam-12 { fill:none; stroke:#6E6249; stroke-width:1.6; }
</style>

<rect width="1100" height="1180" fill="#FFFFFF"/>

<text x="10" y="20" class="m" font-size="10">TABLE LAYOUT CHECK</text>
<text x="10" y="34" class="s" font-size="5.5" font-style="italic">dev check, not a print component - boards 1-4 packed into one shared rectangle, player boards around it</text>

<!-- ═══ THE TABLE ═══ -->
<rect x="40" y="45" width="1002" height="914" rx="12" class="table"/>

<!-- ═══ ONE SHARED RECTANGLE: boards 1-4, edge to edge ═══ -->
<text x="541" y="222" class="m" font-size="7" text-anchor="middle" letter-spacing=".6">ONE SHARED RECTANGLE - 630 x 542 mm, NO GAP - ALL 4 BOARDS REAL</text>
<rect x="226" y="231" width="630" height="542" class="rectangle"/>

<!-- Board 4 - the Zone -->
<rect x="226" y="231" width="297" height="210" class="board"/>
<text x="374.5" y="328" class="m" font-size="8" text-anchor="middle">BOARD 4 - THE ZONE</text>
<text x="374.5" y="340" class="s q" font-size="5" text-anchor="middle" font-style="italic">A4 landscape, 297 x 210 mm</text>

<!-- Board 3 - the Ledger, really widened now -->
<rect x="523" y="231" width="333" height="210" class="board"/>
<text x="689.5" y="323" class="m" font-size="8" text-anchor="middle">BOARD 3 - THE LEDGER</text>
<text x="689.5" y="335" class="s q" font-size="5" text-anchor="middle" font-style="italic">widened 297 to 333 x 210 mm - real now</text>
<text x="689.5" y="344" class="s q" font-size="4.4" text-anchor="middle" font-style="italic">3b Standing widened to match, 281 to 317mm - also real</text>

<!-- Board 3b - Standing, a separate glued strip that drops into board 3's own dashed slot -->
<rect x="531" y="397" width="317" height="34" rx="2" class="spare"/>
<text x="689.5" y="411" class="m" font-size="5.5" text-anchor="middle" fill="#905151">BOARD 3b - STANDING</text>
<text x="689.5" y="418" class="s q" font-size="4" text-anchor="middle" font-style="italic">separate 317 x 34 mm strip, glued to its own greyboard</text>
<text x="689.5" y="424" class="s q" font-size="4" text-anchor="middle" font-style="italic">drops into board 3's dashed slot at the foot of the Ledger</text>

<!-- top row - 4-3 -->
<rect x="226" y="231" width="630" height="210" class="pair"/>

<!-- Board 1 - the Project, really 332mm tall now (week-clock strip relocated to a bottom band) -->
<rect x="226" y="441" width="420" height="332" class="board"/>
<text x="436" y="602" class="m" font-size="9" text-anchor="middle">BOARD 1</text>
<text x="436" y="614" class="m" font-size="9" text-anchor="middle">THE PROJECT</text>
<text x="436" y="625" class="s q" font-size="5" text-anchor="middle" font-style="italic">A3 landscape, extended to 420 x 332 mm</text>

<!-- Board 2 - Reality, really 332mm tall now too -->
<rect x="646" y="441" width="210" height="332" class="board"/>
<text x="751" y="602" class="m" font-size="8" text-anchor="middle">BOARD 2</text>
<text x="751" y="612" class="m" font-size="8" text-anchor="middle">REALITY</text>
<text x="751" y="624" class="s q" font-size="4.6" text-anchor="middle" font-style="italic">A4 portrait, extended to 210 x 332 mm</text>

<!-- bottom row (1-2) matches the top row's width -->
<text x="541" y="787" class="m" font-size="4.6" text-anchor="middle" fill="#D08A1E">BOTTOM ROW: 420 + 210 = 630mm, MATCHES THE TOP ROW (297 + 333) - BOTH ROWS NOW 542mm TALL TOO</text>

<!-- ═══ PLACEMENT-LINE GUIDE: one colour per seam, a 6mm-inset line on each side of it - no outer perimeter ═══ -->
<!-- seam board4|board3 (vertical) -->
<line x1="517" y1="237" x2="517" y2="435" class="seam-43"/>
<line x1="529" y1="237" x2="529" y2="435" class="seam-43"/>
<!-- seam board4|board1 (horizontal, left third) -->
<line x1="232" y1="435" x2="517" y2="435" class="seam-41"/>
<line x1="232" y1="447" x2="517" y2="447" class="seam-41"/>
<!-- seam board3|board1 (horizontal, middle third) -->
<line x1="529" y1="435" x2="640" y2="435" class="seam-31"/>
<line x1="529" y1="447" x2="640" y2="447" class="seam-31"/>
<!-- seam board3|board2 (horizontal, right third) -->
<line x1="652" y1="435" x2="850" y2="435" class="seam-32"/>
<line x1="652" y1="447" x2="850" y2="447" class="seam-32"/>
<!-- seam board1|board2 (vertical) -->
<line x1="640" y1="447" x2="640" y2="767" class="seam-12"/>
<line x1="652" y1="447" x2="652" y2="767" class="seam-12"/>
<text x="856" y="228" class="m" font-size="4" text-anchor="end">PLACEMENT-LINE GUIDE - one colour per seam, inset 6mm, only where boards actually cross</text>

<!-- ═══ PLAYER BOARDS - example 4-player seating, one per side ═══ -->
<!-- north -->
<rect x="446" y="75" width="190" height="116" class="player"/>
<text x="541" y="130" class="m" font-size="6.5" text-anchor="middle">PLAYER (N)</text>
<text x="541" y="140" class="s q" font-size="4.6" text-anchor="middle" font-style="italic">190 x 116 mm</text>

<!-- south -->
<rect x="446" y="813" width="190" height="116" class="player"/>
<text x="541" y="868" class="m" font-size="6.5" text-anchor="middle">PLAYER (S)</text>
<text x="541" y="878" class="s q" font-size="4.6" text-anchor="middle" font-style="italic">190 x 116 mm</text>

<!-- west - rotated to face its own player -->
<g transform="rotate(-90 128 502)">
  <rect x="33" y="444" width="190" height="116" class="player"/>
  <text x="128" y="497" class="m" font-size="6.5" text-anchor="middle">PLAYER (W)</text>
  <text x="128" y="507" class="s q" font-size="4.6" text-anchor="middle" font-style="italic">190 x 116 mm</text>
</g>

<!-- east - rotated to face its own player -->
<g transform="rotate(90 954 502)">
  <rect x="859" y="444" width="190" height="116" class="player"/>
  <text x="954" y="497" class="m" font-size="6.5" text-anchor="middle">PLAYER (E)</text>
  <text x="954" y="507" class="s q" font-size="4.6" text-anchor="middle" font-style="italic">190 x 116 mm</text>
</g>

<!-- ═══ SCALE BAR ═══ -->
<g transform="translate(70,983)">
  <line x1="0" y1="0" x2="200" y2="0" stroke="#000000" stroke-width="1.5"/>
  <line x1="0" y1="-4" x2="0" y2="4" stroke="#000000" stroke-width="1.5"/>
  <line x1="200" y1="-4" x2="200" y2="4" stroke="#000000" stroke-width="1.5"/>
  <text x="100" y="-8" class="m" font-size="6" text-anchor="middle">200 mm</text>
</g>

<!-- ═══ LEGEND / FINDINGS ═══ -->
<line x1="10" y1="1020" x2="1090" y2="1020" stroke="#000000" stroke-width=".8"/>
<text x="10" y="1035" class="m" font-size="8" letter-spacing="1">WHAT THIS CHECKS</text>

<rect x="10" y="1043" width="16" height="10" class="rectangle"/>
<text x="32" y="1051" class="s" font-size="5">Boards 1-4 pack edge to edge into one 630 x 542 mm rectangle with zero gap - all four are now really these sizes (board 3 to 333mm wide, boards 1 and 2 to 332mm tall).</text>

<rect x="10" y="1057" width="16" height="10" class="player"/>
<text x="32" y="1065" class="s" font-size="5">Per-player board - one of these per seat. Shown here for an example 4-player game, one per side; rotate to face however players actually sit.</text>

<rect x="10" y="1085" width="16" height="10" fill="none" stroke="#6E7A54" stroke-width="1.6"/>
<rect x="28" y="1085" width="16" height="10" fill="none" stroke="#3F5B66" stroke-width="1.6"/>
<rect x="46" y="1085" width="16" height="10" fill="none" stroke="#9C7A32" stroke-width="1.6"/>
<rect x="64" y="1085" width="16" height="10" fill="none" stroke="#905151" stroke-width="1.6"/>
<rect x="82" y="1085" width="16" height="10" fill="none" stroke="#6E6249" stroke-width="1.6"/>
<text x="102" y="1093" class="s" font-size="5">Placement-line guide - 5 seams (4|3, 4|1, 3|1, 3|2, 1|2), each its own colour, a 6mm-inset line drawn by each of the two boards that share it. No outer-perimeter line: only crossings are marked. Matching colour + aligned lines confirms correct placement; either one being off exposes a wrong board, wrong slot, or wrong rotation.</text>

<text x="10" y="1101" class="s q" font-size="5" font-style="italic">The shared rectangle alone is 63.0 x 54.2 cm. With one player board on all four sides, the whole</text>
<text x="10" y="1109" class="s q" font-size="5" font-style="italic">layout needs about 94 x 87 cm - comfortably inside a standard dining table's width (~120 cm) and</text>
<text x="10" y="1117" class="s q" font-size="5" font-style="italic">close to its depth (most run 75-90 cm).</text>

<text x="10" y="1131" class="s q" font-size="4.6" font-style="italic">Re-open this file whenever a board's page size changes, or whenever seating/player count assumptions change.</text>
</svg>
