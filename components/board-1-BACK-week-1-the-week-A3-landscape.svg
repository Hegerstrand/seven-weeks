<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>Board 1 BACK - Week 1, The Week (true A3 landscape)</title>
<desc>Glues to the reverse of board-1-FRONT. Same paper size, same orientation: flip about the
long edge and both sides read the right way up. This face is what the table sees before the
game starts.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .h { fill:none; stroke:#2A2620; stroke-width:.8; }
  .q { fill:#000000; }
</style>

<rect width="420" height="297" fill="#FFFFFF"/>

<text x="24" y="26" class="m q" font-size="6" letter-spacing="3">START HERE · TURN ME OVER WHEN EVERYONE HAS A FIGURE</text>
<line x1="24" y1="32" x2="396" y2="32" class="h"/>

<text x="24" y="66" class="m" font-size="26" letter-spacing="6">WEEK 1</text>
<text x="24" y="112" class="s" font-size="42">The week</text>
<line x1="24" y1="126" x2="396" y2="126" class="h" stroke-width="1.2"/>

<text x="24" y="146" class="m q" font-size="6" letter-spacing="2.5">THE ONE IDEA</text>
<text x="24" y="172" class="s" font-size="20">A week is five days, and you choose them.</text>

<line x1="24" y1="188" x2="396" y2="188" class="h" stroke-width=".5"/>

<text x="24" y="206" class="m q" font-size="6" letter-spacing="2.5">ON THE TABLE</text>
<text x="24" y="220" class="s" font-size="8">The week strip and the six features.</text>
<rect x="132" y="223.8" width="37" height="9.2" rx="1.4" fill="#D3B1B1"/>
<text x="24" y="231" class="s" font-size="8"><tspan textLength="108" lengthAdjust="spacingAndGlyphs">Your figure, your Knowledge, your </tspan><tspan textLength="37" lengthAdjust="spacingAndGlyphs">Motivation</tspan>.</text>
<text x="24" y="242" class="s" font-size="8">Nothing else yet.</text>

<text x="24" y="262" class="m q" font-size="6" letter-spacing="2.5">CARDS IN PLAY</text>
<text x="24" y="276" class="m" font-size="10">WORK · COORDINATE · CELEBRATE</text>

<line x1="212" y1="196" x2="212" y2="282" class="h" stroke-width=".4"/>

<text x="228" y="206" class="m q" font-size="6" letter-spacing="2.5">HOW A WEEK RUNS</text>
<text x="228" y="222" class="s" font-size="8">Lay five cards across Monday to Friday.</text>
<text x="228" y="233" class="s" font-size="8">Put a disc under each to say who takes that day.</text>
<text x="228" y="244" class="s" font-size="8">Resolve all five - the order does not matter.</text>
<text x="228" y="255" class="s" font-size="8">Then close the week.</text>
<text x="228" y="276" class="s" font-size="8" font-style="italic">That is the whole lesson. It gets worse.</text>

<!-- table-placement guide - matches the same-coloured line on the neighbouring board's edge -->
<line x1="6" y1="6" x2="291" y2="6" stroke="#3F5B66" stroke-width="1"/>
<line x1="303" y1="6" x2="414" y2="6" stroke="#9C7A32" stroke-width="1"/>
<line x1="414" y1="6" x2="414" y2="291" stroke="#6E6249" stroke-width="1"/>
</svg>
