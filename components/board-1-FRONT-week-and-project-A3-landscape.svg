<circle cx="386" cy="161.5" r="2.5" class="w" stroke-dasharray="1.5 1"/>
<text x="381" y="163" class="s" font-size="3.2" text-anchor="end" font-style="italic">Quality chip seat, face-down until Demo (§10) =</text>

<!-- ═══ THE WEEK ═══ -->
<line x1="12" y1="166" x2="408" y2="166" class="r"/>
<text x="12" y="176" class="m" font-size="7" letter-spacing="2.5">THE WEEK</text>

<!-- six card slots, 65 x 90 for a 63 x 88 card - OVERTIME is the extra sixth, to the right of Friday -->
<g class="m" font-size="4.4" text-anchor="middle">
  <text x="44.5" y="186">MONDAY</text><text x="110" y="186">TUESDAY</text><text x="176" y="186">WEDNESDAY</text>
  <text x="242" y="186">THURSDAY</text><text x="308" y="186">FRIDAY</text>
  <text x="374" y="186" fill="#B03A2E">OVERTIME</text>
</g>
<line x1="346.5" y1="190" x2="346.5" y2="280" class="r" stroke-dasharray="2 2"/>
<g class="slot">
  <rect x="12" y="190" width="65" height="90" rx="2"/>
  <rect x="78" y="190" width="65" height="90" rx="2"/>
  <rect x="144" y="190" width="65" height="90" rx="2"/>
  <rect x="210" y="190" width="65" height="90" rx="2"/>
  <rect x="276" y="190" width="65" height="90" rx="2"/>
  <rect x="342" y="190" width="65" height="90" rx="2" stroke="#B03A2E"/>
</g>
<text x="210" y="289" class="m q" font-size="5.5" text-anchor="middle" letter-spacing="1.5">ORDER DOES NOT MATTER</text>
<text x="374" y="200" class="m q" font-size="3" text-anchor="middle">ONLY ONE 6TH CARD</text>
<text x="374" y="205" class="m q" font-size="3" text-anchor="middle">PER WEEK, ONE PERSON</text>
<polygon points="374,214 377.9,218 374,222 370.1,218" class="w"/>
<text x="374" y="230" class="m" font-size="2.8" text-anchor="middle" fill="#B03A2E">MUST MATCH</text>
<text x="374" y="235" class="m" font-size="2.8" text-anchor="middle" fill="#B03A2E">YOUR ITEM</text>
<text x="374" y="244" class="s q" font-size="3" text-anchor="middle" font-style="italic">the diamond above is</text>
<text x="374" y="249" class="s q" font-size="3" text-anchor="middle" font-style="italic">the Item habitus shape</text>
<text x="374" y="260" class="m" font-size="2.8" text-anchor="middle" fill="#B03A2E">COSTS 1 MOTIVATION</text>
<text x="374" y="265" class="m" font-size="2.8" text-anchor="middle" fill="#B03A2E">+ A FLEX MARKER</text>

