<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="332mm" viewBox="0 0 420 332">
<title>Sheet 1 - The Week and The Project (A3 landscape, extended)</title>
<desc>Week 1. Card slots are 65 x 90 mm to hold a standard 63 x 88 playing card.
White ground, line art only - cheap on an office printer. The week ladder moved to a strip
along the bottom (adding 39mm of page height) to make room for a sixth slot, OVERTIME, which
sits to the right of Friday - Monday through Friday are shifted one slot left to fill the gap.
Your ITEM sets what that sixth card can be - see cards-habitus-parts.</desc>

<style>
  .s  { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m  { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .r  { stroke:#000000; stroke-width:.5; fill:none; }
  .w  { fill:none; stroke:#000000; stroke-width:.5; }
  .slot { fill:none; stroke:#000000; stroke-width:.6; stroke-dasharray:4 2.5; }
  .q  { fill:#3A3A3A; }
</style>

<rect width="420" height="332" fill="#FFFFFF"/>

<text x="12" y="14" class="m" font-size="7" letter-spacing="2.5">THE PROJECT</text>
<text x="408" y="14" class="m q" font-size="3.8" text-anchor="end">SHEET 1 · WEEK 1</text>
<line x1="12" y1="18" x2="408" y2="18" class="r"/>

<!-- THE CLOCK - leftmost column, counts down to the deadline. Ladder now spans the full
     height of the swapped Plinth+Project column below, top-to-top and bottom-to-bottom. -->
<text x="12" y="58" class="m" font-size="6" letter-spacing="1.6">THE CLOCK</text>
<text x="12" y="64" class="s" font-size="3.4" font-style="italic">Counts down to the deadline -</text>
<text x="12" y="69" class="s" font-size="3.4" font-style="italic">whatever isn't banked doesn't count.</text>
<g class="m" font-size="3.4" text-anchor="middle">
  <rect x="14" y="73" width="52" height="9" rx="1.2" class="w"/><text x="40" y="79.5">7 WEEKS LEFT</text>
  <rect x="14" y="84.6" width="52" height="9" rx="1.2" class="w"/><text x="40" y="91.1">6 WEEKS LEFT</text>
  <rect x="14" y="96.2" width="52" height="9" rx="1.2" class="w"/><text x="40" y="102.7">5 WEEKS LEFT</text>
  <rect x="14" y="107.8" width="52" height="9" rx="1.2" class="w"/><text x="40" y="114.3">4 WEEKS LEFT</text>
  <rect x="14" y="119.4" width="52" height="9" rx="1.2" class="w"/><text x="40" y="125.9">3 WEEKS LEFT</text>
  <rect x="14" y="131" width="52" height="9" rx="1.2" class="w"/><text x="40" y="137.5">2 WEEKS LEFT</text>
  <rect x="14" y="142.6" width="52" height="9" rx="1.2" class="w"/><text x="40" y="149.1">1 WEEK LEFT</text>
  <rect x="14" y="154.2" width="52" height="9" rx="1.2" class="w" stroke="#B03A2E" stroke-width=".8"/><text x="40" y="160.7" fill="#B03A2E">DEADLINE</text>
</g>

<!-- tower plinth - swapped to the top slot -->
<polygon points="144.5,47 131.5,70 104.5,70 91.5,47 104.5,24 131.5,24" class="w" stroke-width=".6"/>
<text x="118" y="45" class="m q" font-size="4.4" text-anchor="middle">PLINTH</text>
<text x="118" y="52" class="s" font-size="3.8" text-anchor="middle" font-style="italic">stack banked</text>
<text x="118" y="57" class="s" font-size="3.8" text-anchor="middle" font-style="italic">features here</text>

<!-- project card seat - swapped to the bottom slot. Wider than the standard 65x90 slot on
     purpose: this card is read once and left in place all game, never shuffled with the
     other decks, so it doesn't need to match their size - see cards-project's own note. -->
<rect x="73" y="73" width="90" height="90" rx="2" class="slot"/>
<text x="118" y="111" class="m q" font-size="5" text-anchor="middle">PROJECT</text>
<text x="118" y="118" class="m q" font-size="5" text-anchor="middle">CARD</text>
<text x="118" y="128" class="s" font-size="4" text-anchor="middle" font-style="italic">names the six</text>
<text x="118" y="133" class="s" font-size="4" text-anchor="middle" font-style="italic">features</text>

<!-- ═══ SIX FEATURES ═══ -->
<text x="172" y="30" class="m" font-size="4" letter-spacing="1.2">FEATURES</text>
<text x="213" y="30" class="m" font-size="3.6" letter-spacing="1">COMPLEXITY</text>

