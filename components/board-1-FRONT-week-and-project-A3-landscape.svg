  <circle cx="326" cy="64.5" r="7.5" style="fill:#5C4830;stroke:#000000;stroke-width:.8"/><text x="326" y="67" class="m" font-size="5.5" text-anchor="middle" fill="#F2EDE0">4</text>
  <text x="344" y="67" class="m" font-size="5" fill="#B03A2E">UNLOCKS D</text>
