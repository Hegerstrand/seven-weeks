  <circle cx="312" cy="43.5" r="7.5" style="fill:#5C4830;stroke:#000000;stroke-width:.8"/><text x="312" y="46" class="m" font-size="5.5" text-anchor="middle" fill="#F2EDE0">3</text>
  <circle cx="386" cy="43.5" r="4.5" class="w" stroke-dasharray="1.5 1"/>
</g>

