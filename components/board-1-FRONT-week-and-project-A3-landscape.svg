  <text x="213" y="111" class="s" font-size="3.8" font-style="italic">Plan → Work worth +1 for 2 weeks</text>
  <g><circle cx="278" cy="106.5" r="5.5" style="fill:#8B6F47;fill-opacity:.35;stroke:#000000;stroke-width:.5"/><circle cx="292" cy="106.5" r="5.5" style="fill:#8B6F47;fill-opacity:.35;stroke:#000000;stroke-width:.5"/></g>
