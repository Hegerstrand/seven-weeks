<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="332mm" viewBox="0 0 210 332">
<title>Board 2 FRONT - Reality (A4 portrait, extended)</title>
<desc>Extended 297 to 332mm to match board 1's real height (both grew when board 1's week-clock
strip moved to a bottom band) - the two boards now pack edge to edge on the table with no gap.
Glue to cardboard; board-2-BACK is the same size and goes on the reverse. Card slots are 65 x 90
mm for standard 63 x 88 cards, so this must print at 100% - do not scale it up.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .r { stroke:#2A2620; stroke-width:.5; fill:none; }
  .w { fill:none; stroke:#2A2620; stroke-width:.5; }
  .h { fill:none; stroke:#2A2620; stroke-width:.4; }
  .slot { fill:none; stroke:#2A2620; stroke-width:.6; stroke-dasharray:4 2.5; }
  .q { fill:#000000; }
</style>

<rect width="210" height="332" fill="#FFFFFF"/>

<text x="12" y="16" class="m" font-size="7" letter-spacing="2.5">REALITY</text>
<text x="198" y="16" class="m q" font-size="3.6" text-anchor="end">SHEET 2 · FROM WEEK 2</text>
<line x1="12" y1="20" x2="198" y2="20" class="r"/>

<!-- ═══ SHIT HAPPENS ═══ -->
<rect x="10" y="26" width="190" height="113" rx="2" class="r" style="stroke:#905151;stroke-width:.9"/>
<text x="16" y="37" class="m" font-size="7" letter-spacing="1.6">SHIT HAPPENS</text>
<text x="16" y="45" class="s" font-size="5">Draw <tspan font-weight="bold">two</tspan> Event cards, face up. <tspan font-weight="bold">Don't resolve them.</tspan></text>
<text x="16" y="51" class="s" font-size="4.2" font-style="italic">Only after all five day cards are laid out. They are threats, not yet facts.</text>

<rect x="16" y="55" width="58" height="80" rx="2" class="slot"/>
<text x="45" y="97" class="m q" font-size="6" text-anchor="middle">DECK</text>
<rect x="78" y="55" width="58" height="80" rx="2" class="slot"/>
<text x="107" y="97" class="m q" font-size="5" text-anchor="middle">EVENT 1</text>
<rect x="140" y="55" width="58" height="80" rx="2" class="slot"/>
<text x="169" y="97" class="m q" font-size="5" text-anchor="middle">EVENT 2</text>

<!-- ═══ ADAPT ═══ -->
<rect x="10" y="143" width="190" height="63" rx="2" class="r"/>
<text x="16" y="152" class="m" font-size="7" letter-spacing="1.6">ADAPT</text>
<text x="56" y="152" class="m q" font-size="3.6" letter-spacing="1">EACH EVENT ON ITS OWN</text>
<text x="16" y="158.5" class="s" font-size="4.2">Deal with both Events now. <tspan font-weight="bold">Nothing resolves until this step is finished.</tspan></text>

<g id="pool">
  <rect x="16" y="161" width="58" height="39" rx="1.5" fill="#B5C7CF"/>
  <rect x="16" y="161" width="58" height="39" rx="1.5" class="w"/>
  <text x="19" y="165.5" class="m" font-size="3.2" letter-spacing=".3">ADAPTABILITY</text>
  <circle cx="23.4" cy="175" r="5.2" class="w"/><circle cx="34.2" cy="175" r="5.2" class="w"/><circle cx="45" cy="175" r="5.2" class="w"/><circle cx="55.8" cy="175" r="5.2" class="w"/><circle cx="66.6" cy="175" r="5.2" class="w"/>
  <text x="19" y="183" class="s" font-size="2.8">Match your coin on the</text>
  <text x="19" y="187" class="s" font-size="2.8"><tspan font-weight="bold">TEAM board</tspan>. Just 1 until</text>
  <text x="19" y="191" class="s" font-size="2.8">week 3.</text>
  <text x="19" y="195" class="s" font-size="2.8">Replace a day card: 1.</text>
  <text x="19" y="199" class="s" font-size="2.8">Cancel an Event: its ADAPT no.</text>
</g>

<g id="lane-1">
  <text x="78" y="165.5" class="m q" font-size="3.4" letter-spacing=".4">EVENT 1</text>
  <rect x="78" y="167" width="58" height="33" rx="1.5" fill="#E8D4B8"/>
  <rect x="78" y="167" width="58" height="33" rx="1.5" class="w"/>
  <text x="81" y="172" class="m" font-size="3">HERO · CANCELS IT</text>
  <circle cx="123" cy="185" r="10" class="w" stroke-dasharray="2 1.5"/>
  <text x="81" y="177.5" class="s" font-size="2.8">Needs the part it names,</text>
  <rect x="86.82" y="178.98" width="18.93" height="3.22" rx=".45" fill="#D3B1B1"/>
  <text x="81" y="181.5" class="s" font-size="2.8">and 3+ Motivation.</text>
  <rect x="91.69" y="183.32" width="9.42" height="2.94" rx=".4" fill="#D9D3C4"/>
  <text x="81" y="185.5" class="s" font-size="2.8">Gives +2 <tspan>Capital</tspan> and +1</text>
  <rect x="81" y="186.98" width="14.56" height="3.22" rx=".45" fill="#D3B1B1"/>
  <text x="81" y="189.5" class="s" font-size="2.8">Motivation to another.</text>
  <text x="81" y="198" class="s" font-size="2.8">Once per game, each character.</text>
</g>

<g id="lane-2">
  <text x="140" y="165.5" class="m q" font-size="3.4" letter-spacing=".4">EVENT 2</text>
  <rect x="140" y="167" width="58" height="33" rx="1.5" fill="#E8D4B8"/>
  <rect x="140" y="167" width="58" height="33" rx="1.5" class="w"/>
  <text x="143" y="172" class="m" font-size="3">HERO · CANCELS IT</text>
  <circle cx="185" cy="185" r="10" class="w" stroke-dasharray="2 1.5"/>
  <text x="143" y="177.5" class="s" font-size="2.8">Needs the part it names,</text>
  <rect x="148.82" y="178.98" width="18.93" height="3.22" rx=".45" fill="#D3B1B1"/>
  <text x="143" y="181.5" class="s" font-size="2.8">and 3+ Motivation.</text>
  <rect x="153.69" y="183.32" width="9.42" height="2.94" rx=".4" fill="#D9D3C4"/>
  <text x="143" y="185.5" class="s" font-size="2.8">Gives +2 <tspan>Capital</tspan> and +1</text>
  <rect x="143" y="186.98" width="14.56" height="3.22" rx=".45" fill="#D3B1B1"/>
  <text x="143" y="189.5" class="s" font-size="2.8">Motivation to another.</text>
  <text x="143" y="198" class="s" font-size="2.8">Once per game, each character.</text>
</g>

<text x="16" y="204.5" class="s" font-size="4" font-style="italic">Each Event is dealt with on its own. Resolve whatever is left, then the week runs.</text>

<!-- ═══ CLOSE THE WEEK ═══ -->
<rect x="10" y="208" width="190" height="80" rx="2" class="r"/>
<text x="16" y="220" class="m" font-size="7" letter-spacing="1.6">CLOSE THE WEEK</text>
<text x="198" y="220" class="m q" font-size="3.6" text-anchor="end">TOP TO BOTTOM</text>
<line x1="16" y1="224" x2="194" y2="224" class="h"/>

<circle cx="22" cy="234" r="5" class="w"/><text x="22" y="236" class="m" font-size="5.5" text-anchor="middle">1</text>
<text x="32" y="233" class="s" font-size="5.4"><tspan font-weight="bold">Anything finished?</tspan> Put its block on the tower.</text>
<rect x="83.87" y="235.57" width="14.35" height="4.62" rx=".4" fill="#D9D3C4"/>
<text x="32" y="239" class="s" font-size="4.4">Lift the lock it opens. +1 <tspan>Capital</tspan> to whoever worked on it.</text>

<circle cx="22" cy="250" r="5" class="w"/><text x="22" y="252" class="m" font-size="5.5" text-anchor="middle">2</text>
<text x="32" y="249" class="s" font-size="5.4"><tspan font-weight="bold">Move the coins.</tspan> One step each, no more.</text>
<text x="32" y="255" class="s" font-size="4.4">Any coin that reached its ring turns over - and stays turned.</text>

<circle cx="22" cy="266" r="5" class="w"/><text x="22" y="268" class="m" font-size="5.5" text-anchor="middle">3</text>
<rect x="32" y="260.14" width="81.43" height="6.21" rx=".9" fill="#D3B1B1"/>
<text x="32" y="265" class="s" font-size="5.4"><tspan font-weight="bold">Everyone loses 1 Motivation.</tspan></text>
<text x="32" y="271" class="s" font-size="4.4">Add it up first, <tspan font-style="italic">then</tspan> see if anyone is empty. Empty means they leave.</text>
<text x="32" y="276" class="m q" font-size="3.4">FROM WEEK 4: +1 BACK IF THEIR NEED WAS MET</text>

<circle cx="22" cy="282" r="5" class="w"/><text x="22" y="284" class="m" font-size="5.5" text-anchor="middle">4</text>
<text x="32" y="281" class="s" font-size="5.4"><tspan font-weight="bold">Move the week marker.</tspan> One week closer to the deadline.</text>
<text x="32" y="287" class="s" font-size="4.4">The deadline does not move. Nothing else happens here.</text>

<rect x="107.70" y="287.72" width="13.74" height="4.41" rx=".4" fill="#D9D3C4"/>
<text x="12" y="291" class="s" font-size="4.2" font-style="italic">Step 1 comes first because banking is what pays the <tspan>Capital</tspan> that step 2 needs.</text>

<!-- table-placement guide - matches the same-coloured line on the neighbouring board's edge -->
<line x1="6" y1="6" x2="204" y2="6" stroke="#905151" stroke-width="1"/>
<line x1="6" y1="6" x2="6" y2="326" stroke="#6E6249" stroke-width="1"/>
</svg>
