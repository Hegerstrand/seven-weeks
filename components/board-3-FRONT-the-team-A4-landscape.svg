<svg xmlns="http://www.w3.org/2000/svg" width="333mm" height="210mm" viewBox="0 0 333 210">
<title>Board 3 FRONT - The Team: the Ledger (A4 landscape, widened)</title>
<desc>Widened 297 to 333mm to close the 36mm gap against board 4 so the two boards pack edge
to edge on the table (see _check-table-layout.svg). One coin per row; walk it, turn it over at
the ring. The Standing row is dashed because it stays covered until week 4. Glue to cardboard;
board-3-BACK is widened to match and goes on the reverse.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .r { stroke:#000000; stroke-width:.5; fill:none; }
  .w { fill:none; stroke:#000000; stroke-width:.55; }
  .q { fill:#3A3A3A; }
  .band { stroke:none; }
</style>

<rect width="333" height="210" fill="#FFFFFF"/>

<text x="12" y="16" class="m" font-size="7" letter-spacing="2.5">THE TEAM</text>
<text x="78" y="16" class="s" font-size="4.4" font-style="italic">It was never only the project.</text>
<text x="321" y="16" class="m q" font-size="3.8" text-anchor="end">SHEET 3 · FROM WEEK 3</text>
<line x1="12" y1="20" x2="321" y2="20" class="r"/>

<rect x="8" y="22" width="317" height="10.5" rx="1.5" class="r"/>
<text x="12" y="26" class="s" font-size="3.8" font-style="italic">One coin per row. Walk it as the track moves. At the ring, turn it over - that is a <tspan font-weight="bold">Habit</tspan>, and it is permanent.</text>
<text x="12" y="30" class="s" font-size="3.8" font-style="italic">The coin can walk back down afterwards. It never turns back over. The left column is what the team <tspan font-style="normal">does</tspan>; the right is what it has <tspan font-style="normal">become</tspan>, and who named it.</text>

<text x="176" y="36" class="m" font-size="4.2" text-anchor="middle" letter-spacing=".6" fill="#B03A2E">FLIP → HABIT</text>
<text x="248" y="36" class="m" font-size="3" letter-spacing=".3">HABIT - PRINTED ON THE EVENT CARDS</text>
<g class="m" font-size="4.4" text-anchor="middle" letter-spacing=".6" transform="translate(0,-3.5)">
  <text x="96" y="45">0</text><text x="116" y="45">1</text><text x="136" y="45">2</text>
  <text x="156" y="45">3</text><text x="176" y="45">4</text><text x="196" y="45">5</text>
</g>

<!-- TRUST -->
<g id="trust" transform="translate(0,-4)">
  <rect x="8" y="45" width="317" height="28" rx="2" class="band" fill="#F9E3E0"/>
  <text x="12" y="52" class="s" font-size="6">Trust</text>
  <text x="12" y="59" class="s" font-size="3.4" font-style="italic">grown by Coordinate, and by Meet</text>
  <g class="w">
    <circle cx="96" cy="54" r="8"/><circle cx="116" cy="54" r="8"/><circle cx="136" cy="54" r="8"/>
    <circle cx="156" cy="54" r="8"/><circle cx="176" cy="54" r="8"/><circle cx="196" cy="54" r="8"/>
  </g>
  <circle cx="176" cy="54" r="10.5" class="w" stroke="#B03A2E" stroke-width=".8"/>
  <path d="M88,64 L88,67 L124,67 L124,64" class="w" stroke="#B03A2E" stroke-width=".5"/>
  <text x="106" y="71" class="m" font-size="2.8" text-anchor="middle" fill="#B03A2E">LEARN DOES NOTHING</text>
  <path d="M168,64 L168,67 L204,67 L204,64" class="w" stroke-width=".5"/>
  <text x="186" y="71" class="m" font-size="2.6" text-anchor="middle">CANCEL 1 EVENT A WEEK</text>
  <text x="248" y="52" class="s" font-size="5">Psychological Safety</text>
  <text x="248" y="58.5" class="m q" font-size="2.6">EDMONDSON 1999</text>
</g>

<!-- CAPABILITY -->
<g id="capability" transform="translate(0,-3)">
  <rect x="8" y="75" width="317" height="28" rx="2" class="band" fill="#DFF0DB"/>
  <text x="12" y="82" class="s" font-size="6">Capability</text>
  <text x="12" y="89" class="s" font-size="3.4" font-style="italic">grown by filling a whole</text>
  <text x="12" y="93.5" class="s" font-size="3.4" font-style="italic">row or column on the Zone</text>
  <g class="w">
    <circle cx="96" cy="84" r="8"/><circle cx="116" cy="84" r="8"/><circle cx="136" cy="84" r="8"/>
    <circle cx="156" cy="84" r="8"/><circle cx="176" cy="84" r="8"/><circle cx="196" cy="84" r="8"/>
  </g>
  <circle cx="176" cy="84" r="10.5" class="w" stroke="#B03A2E" stroke-width=".8"/>
  <path d="M88,94 L88,97 L124,97 L124,94" class="w" stroke="#B03A2E" stroke-width=".5"/>
  <text x="106" y="101" class="m" font-size="2.8" text-anchor="middle" fill="#B03A2E">ALL WORK: 1 LESS</text>
  <path d="M168,94 L168,97 L204,97 L204,94" class="w" stroke-width=".5"/>
  <text x="186" y="101" class="m" font-size="2.8" text-anchor="middle">ALL WORK: +1</text>
  <text x="248" y="82" class="s" font-size="5">Who Knows What</text>
  <text x="248" y="88.5" class="m q" font-size="2.6">WEGNER 1986 · TRANSACTIVE MEMORY</text>
</g>

<!-- SHARED PRACTICE -->
<g id="shared-practice" transform="translate(0,-2)">
  <rect x="8" y="105" width="317" height="28" rx="2" class="band" fill="#FAECBE"/>
  <text x="12" y="112" class="s" font-size="6">Shared Practice</text>
  <text x="12" y="119" class="s" font-size="3.4" font-style="italic">grown by Reflect, and by</text>
  <text x="12" y="123.5" class="s" font-size="3.4" font-style="italic">stacking a square on the Zone</text>
  <g class="w">
    <circle cx="96" cy="114" r="8"/><circle cx="116" cy="114" r="8"/><circle cx="136" cy="114" r="8"/>
    <circle cx="156" cy="114" r="8"/><circle cx="176" cy="114" r="8"/><circle cx="196" cy="114" r="8"/>
  </g>
  <circle cx="176" cy="114" r="10.5" class="w" stroke="#B03A2E" stroke-width=".8"/>
  <path d="M88,124 L88,127 L124,127 L124,124" class="w" stroke="#B03A2E" stroke-width=".5"/>
  <text x="106" y="131" class="m" font-size="2.6" text-anchor="middle" fill="#B03A2E">2ND+ WORK: 1 LESS EACH</text>
  <path d="M168,124 L168,127 L204,127 L204,124" class="w" stroke-width=".5"/>
  <text x="186" y="131" class="m" font-size="2.6" text-anchor="middle">2ND+ WORK: +1 EACH</text>
  <text x="248" y="112" class="s" font-size="5">Shared Repertoire</text>
  <text x="248" y="118.5" class="m q" font-size="2.6">LAVE &amp; WENGER 1991 · WENGER 1998</text>
</g>

<!-- ADAPTABILITY -->
<g id="adaptability" transform="translate(0,-1)">
  <rect x="8" y="135" width="317" height="28" rx="2" class="band" fill="#DCE7F2"/>
  <text x="12" y="142" class="s" font-size="6">Adaptability</text>
  <text x="12" y="149" class="s" font-size="3.4" font-style="italic">grown by Reflect, by Align with</text>
  <text x="12" y="153.5" class="s" font-size="3.4" font-style="italic">nothing Unclear, and by Meet</text>
  <g class="w">
    <circle cx="96" cy="144" r="8"/><circle cx="116" cy="144" r="8"/><circle cx="136" cy="144" r="8"/>
    <circle cx="156" cy="144" r="8"/><circle cx="176" cy="144" r="8"/><circle cx="196" cy="144" r="8"/>
  </g>
  <circle cx="176" cy="144" r="10.5" class="w" stroke="#B03A2E" stroke-width=".8"/>
  <path d="M88,154 L88,157 L204,157 L204,154" class="w" stroke-width=".5"/>
  <text x="146" y="161" class="m" font-size="2.8" text-anchor="middle">SPEND THIS MUCH ADAPTABILITY EACH WEEK · WHAT IS LEFT IS LOST</text>
  <text x="248" y="142" class="s" font-size="5">Team Reflexivity</text>
  <text x="248" y="148.5" class="m q" font-size="2.6">WEST 1996</text>
</g>

<!-- STANDING - week 4 -->
<g id="standing-slot">
  <rect x="8" y="166" width="317" height="34" rx="2" class="r" stroke-dasharray="4 2.5"/>
  <text x="12" y="177" class="s" font-size="6" fill="#3A3A3A">Standing</text>
  <text x="12" y="184" class="s" font-size="3.4" font-style="italic" fill="#3A3A3A">the fifth row, on its own strip</text>
  <text x="166" y="180" class="m" font-size="4.4" text-anchor="middle" letter-spacing="1.2" fill="#B03A2E">SHEET 3b GOES HERE, FACE DOWN</text>
  <text x="166" y="187" class="m q" font-size="3.2" text-anchor="middle">TURN IT OVER IN PLACE AT THE START OF WEEK 4</text>
</g>

<text x="12" y="204" class="s" font-size="3.8" font-style="italic">A track rises at most one step a week. Every Habit <tspan font-weight="bold">raises the week's Work cap by 1</tspan> - and what else it does is printed on the Event cards.</text>

<!-- table-placement guide - matches the same-coloured line on the neighbouring board's edge -->
<line x1="6" y1="6" x2="6" y2="204" stroke="#1B7A5C" stroke-width="1"/>
<line x1="6" y1="207" x2="117" y2="207" stroke="#B8860B" stroke-width="1"/>
<line x1="129" y1="207" x2="327" y2="207" stroke="#C1662F" stroke-width="1"/>
</svg>
