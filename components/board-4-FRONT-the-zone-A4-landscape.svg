</g>

<g class="m q" font-size="2" text-anchor="middle">
  <text x="72" y="145">WORK</text><text x="92" y="145">COORDINATE</text><text x="112" y="145">ALIGN</text><text x="132" y="145">LEARN</text><text x="152" y="145">PLAN</text>
</g>
<text x="112" y="150" class="s q" font-size="3" text-anchor="middle" font-style="italic">a column you cover is a card you are better at</text>
</g>

<text x="166" y="55" class="s q" font-size="3.4" font-style="italic">How you cover a square, and what the Ledger reads off this grid, are on sheet 4b</text>
<text x="166" y="59.5" class="s q" font-size="3.4" font-style="italic">from week 3 - they need Learn/Teach and the Ledger, and neither exists yet.</text>

<line x1="12" y1="158" x2="285" y2="158" class="r"/>
<text x="12" y="166" class="m" font-size="4.4" letter-spacing="1.2">WHAT YOU CAN DO</text>
<text x="88" y="166" class="s" font-size="3.8">Every square you <tspan font-weight="bold">cover</tspan> gives <tspan font-weight="bold">+1</tspan> to the card named under its column. You keep everything you cover.</text>
<text x="12" y="172" class="s" font-size="3.8" font-style="italic">Two squares in one column is two ways of working, not twice the output: +1 per column, however many you cover in it.</text>
<text x="12" y="178" class="s" font-size="3.8">Tiles are 20 mm, the size of a square. When a second person covers a square, offset the tile so the colour underneath still shows.</text>
<text x="12" y="184" class="s" font-size="3.8">At setup you cover <tspan font-weight="bold">one</tspan> square: where your Legs row meets your Item column. Everything after that is learned or taught.</text>

<text x="12" y="197" class="s" font-size="3.4" font-style="italic">Upbringing, values and instinct are not on this board. Bourdieu's embodied capital cannot be handed over - only a training and an instrument can,</text>
<text x="12" y="202" class="s" font-size="3.4" font-style="italic">and those are the two axes here.</text>

