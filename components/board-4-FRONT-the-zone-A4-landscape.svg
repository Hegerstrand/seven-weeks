<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
<title>Sheet 4 FRONT — The Zone: the shared skill grid (A4 landscape)</title>
<desc>One board for the whole table. Rows are education, columns are the tool you work through;
a square is the practice that training makes with that instrument. Both axes are Bourdieu's
transmissible forms of capital - institutionalised and objectified - so everything on this board
can be passed on. Upbringing, values and instinct are not here: they cannot. Squares are 20 mm,
one player tile. Same page frame as sheet 3. Print at 100%. This sheet is week-1 content only -
How Learn/Teach works and what the Ledger reads off this grid live on sheet 4b instead, added
to the table at week 3 alongside the Ledger.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .r { stroke:#2A2620; stroke-width:.5; fill:none; }
  .cell { fill:none; stroke:#2A2620; stroke-width:.4; }
  .q { fill:#4A5259; }
</style>

<rect width="297" height="210" fill="#FFFFFF"/>

<text x="12" y="16" class="m" font-size="7" letter-spacing="2.5">THE ZONE</text>
<text x="78" y="16" class="s" font-size="4.4" font-style="italic">what you can reach from what you already have</text>
<text x="285" y="16" class="m q" font-size="3.8" text-anchor="end">SHEET 4 · SHARED · FROM WEEK 1 · SEE SHEET 4b FROM WEEK 3</text>
<line x1="12" y1="20" x2="285" y2="20" class="r"/>

<text x="12" y="27" class="s" font-size="3.8" font-style="italic">Rows are what you were trained in. Columns are what you work through. A square is the practice <tspan font-style="normal">that</tspan> training makes with <tspan font-style="normal">that</tspan> instrument.</text>
<text x="12" y="31.5" class="s" font-size="3.8" font-style="italic">Everyone covers squares on this one board, so the whole table can see who can do what.</text>

<g transform="translate(-16,0)">
<g class="m q" font-size="2.1" text-anchor="middle">
  <text x="72" y="39.5">MACHINE</text><text x="92" y="39.5">ROOM</text><text x="112" y="39.5">DOCUMENT</text>
  <text x="132" y="39.5">NUMBERS</text><text x="152" y="39.5">SCHEDULE</text>
</g>
<text x="112" y="36.5" class="m q" font-size="2.8" letter-spacing="1" text-anchor="middle">TOOL</text>

<g transform="translate(30,101) rotate(-90)"><text x="0" y="0" class="m q" font-size="2.8" letter-spacing=".8">EDUCATION</text></g>
<g class="s" font-size="3.4" text-anchor="end">
  <text x="58" y="49.5">Technical</text>
  <text x="58" y="69.5">Social</text>
  <text x="58" y="89.5">Commercial</text>
  <text x="58" y="109.5">Analytical</text>
  <text x="58" y="129.5">Organisational</text>
</g>
<g class="s q" font-size="2.5" font-style="italic" text-anchor="end">
  <text x="58" y="53.5">how the thing works</text>
  <text x="58" y="73.5">how people work</text>
  <text x="58" y="93.5">what it is worth</text>
  <text x="58" y="113.5">what the numbers say</text>
  <text x="58" y="133.5">how it gets done</text>
</g>

<g class="cell">
  <rect x="62" y="40" width="20" height="20"/><rect x="82" y="40" width="20" height="20"/><rect x="102" y="40" width="20" height="20"/><rect x="122" y="40" width="20" height="20"/><rect x="142" y="40" width="20" height="20"/>
  <rect x="62" y="60" width="20" height="20"/><rect x="82" y="60" width="20" height="20"/><rect x="102" y="60" width="20" height="20"/><rect x="122" y="60" width="20" height="20"/><rect x="142" y="60" width="20" height="20"/>
  <rect x="62" y="80" width="20" height="20"/><rect x="82" y="80" width="20" height="20"/><rect x="102" y="80" width="20" height="20"/><rect x="122" y="80" width="20" height="20"/><rect x="142" y="80" width="20" height="20"/>
  <rect x="62" y="100" width="20" height="20"/><rect x="82" y="100" width="20" height="20"/><rect x="102" y="100" width="20" height="20"/><rect x="122" y="100" width="20" height="20"/><rect x="142" y="100" width="20" height="20"/>
  <rect x="62" y="120" width="20" height="20"/><rect x="82" y="120" width="20" height="20"/><rect x="102" y="120" width="20" height="20"/><rect x="122" y="120" width="20" height="20"/><rect x="142" y="120" width="20" height="20"/>
</g>
<rect x="62" y="40" width="100" height="100" class="r" stroke-width=".8"/>

<g class="s" font-size="3" text-anchor="middle">
  <text x="72" y="51">Build</text>
  <text x="92" y="51">Toolbox talk</text>
  <text x="112" y="51">Spec</text>
  <text x="132" y="51">Benchmark</text>
  <text x="152" y="49">Critical</text><text x="152" y="53">path</text>

  <text x="72" y="71">Pair work</text>
  <text x="92" y="71">Facilitation</text>
  <text x="112" y="71">Write-up</text>
  <text x="132" y="71">Survey</text>
