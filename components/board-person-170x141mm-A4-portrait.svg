<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<title>Person board, 170 x 114 mm (A4, one up)</title>
<desc>One per player - print once each. Tightened again: the AT WEEK 4 box is gone - that content
lives in the rulebook (§3.0) now, not on the board. The figure, the tokens and the coins are
the whole record; nothing here is ever written on.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .r { fill:none; stroke:#000000; stroke-width:.5; }
  .h { fill:none; stroke:#000000; stroke-width:.35; }
  .w { fill:none; stroke:#000000; stroke-width:.55; }
  .seat { fill:none; stroke:#000000; stroke-width:.5; stroke-dasharray:2.5 1.5; }
  .hab { fill:#E8D4B8; stroke:#000000; stroke-width:.5; stroke-dasharray:2.5 1.5; }
  .q { fill:#3A3A3A; }
  .ic { fill:#FFFFFF; stroke:#000000; stroke-width:.4; }
</style>

<defs>
  <g id="sh-base"><rect x="-2.4" y="-2.4" width="4.8" height="4.8" rx=".4" class="ic"/></g>
  <g id="sh-legs"><polygon points="0,-2.9 2.6,1.7 -2.6,1.7" class="ic"/></g>
  <g id="sh-torso"><polygon points="0,-2.6 2.47,-.8 1.53,2.1 -1.53,2.1 -2.47,-.8" class="ic"/></g>
  <g id="sh-head"><polygon points="2.6,0 1.3,2.25 -1.3,2.25 -2.6,0 -1.3,-2.25 1.3,-2.25" class="ic"/></g>
  <g id="sh-item"><polygon points="0,-3.9 3.9,0 0,3.9 -3.9,0" class="ic"/></g>
</defs>

<rect width="210" height="297" fill="#FFFFFF"/>
<g transform="translate(10,14)">
<rect width="170" height="114" rx="2" class="r"/>

<text x="6" y="10" class="m" font-size="5.4" letter-spacing="2">SPECIMEN</text>
<text x="164" y="9" class="s" font-size="3.2" text-anchor="end" font-style="italic">the figure is the record - nothing here is written</text>
<line x1="6" y1="13" x2="164" y2="13" class="h"/>

<text x="6" y="21" class="m q" font-size="3" letter-spacing="1.1">HABITUS</text>
<text x="163" y="21" class="m q" font-size="2.6" text-anchor="end">· slot the five part-cards</text>
<g class="hab">
  <rect x="6" y="24" width="29" height="22" rx="1"/><rect x="38" y="24" width="29" height="22" rx="1"/>
  <rect x="70" y="24" width="29" height="22" rx="1"/><rect x="102" y="24" width="29" height="22" rx="1"/>
  <rect x="134" y="24" width="29" height="22" rx="1"/>
</g>
<g class="m" font-size="2.7" text-anchor="middle">
  <text x="20.5" y="33">BASE</text><text x="52.5" y="33">LEGS</text><text x="84.5" y="33">TORSO</text>
  <text x="116.5" y="33">HEAD</text><text x="148.5" y="33">ITEM</text>
</g>
<use href="#sh-base" x="20.5" y="28"/><use href="#sh-legs" x="52.5" y="28"/>
<use href="#sh-torso" x="84.5" y="28"/><use href="#sh-head" x="116.5" y="28"/>
<use href="#sh-item" x="148.5" y="28"/>
<g class="s q" font-size="2.4" text-anchor="middle" font-style="italic">
  <text x="20.5" y="38">upbringing</text><text x="52.5" y="38">education</text><text x="84.5" y="38">values</text>
  <text x="116.5" y="38">instinct</text><text x="148.5" y="38">tool</text>
</g>
<g class="s q" font-size="2.3" text-anchor="middle">
  <text x="20.5" y="43">→ Motivation</text><text x="52.5" y="43">→ Skill / row</text><text x="84.5" y="43">→ Events</text>
  <text x="116.5" y="43">→ pressure</text><text x="148.5" y="43">→ Overtime</text>
</g>
<text x="84.5" y="49.5" class="s q" font-size="2.5" text-anchor="middle" font-style="italic">the shape on each seat tells you which part-card belongs there</text>

<rect x="6" y="54" width="29" height="28" rx="1.5" class="h"/>
<text x="20.5" y="60" class="m q" font-size="2.2" text-anchor="middle">ZONE START</text>
<text x="20.5" y="66" class="s q" font-size="1.8" text-anchor="middle" font-style="italic">cover Legs'</text>
<text x="20.5" y="70" class="s q" font-size="1.8" text-anchor="middle" font-style="italic">row x Item's</text>
<text x="20.5" y="74" class="s q" font-size="1.8" text-anchor="middle" font-style="italic">column on the</text>
<text x="20.5" y="78" class="s q" font-size="1.8" text-anchor="middle" font-style="italic">Zone at setup.</text>

<rect x="39" y="54" width="60" height="28" rx="1.5" class="w" fill="#6B4C9A" fill-opacity=".16" stroke="#6B4C9A"/>
<text x="43" y="60" class="m" font-size="2.8" letter-spacing=".8">CAPITAL</text>
<text x="95" y="60" class="m q" font-size="1.8" text-anchor="end">WK4</text>
<g class="w" stroke="#6B4C9A">
  <circle cx="47" cy="67" r="3.2"/><circle cx="56" cy="67" r="3.2"/><circle cx="65" cy="67" r="3.2"/>
  <circle cx="74" cy="67" r="3.2"/><circle cx="83" cy="67" r="3.2"/><circle cx="92" cy="67" r="3.2"/>
</g>
<g class="m q" font-size="1.9" text-anchor="middle">
  <text x="47" y="72.5">0</text><text x="56" y="72.5">1</text><text x="65" y="72.5">2</text>
  <text x="74" y="72.5">3</text><text x="83" y="72.5">4</text><text x="92" y="72.5">5</text>
</g>
<text x="43" y="78.5" class="s q" font-size="1.8" font-style="italic">starts 2 - only grows if witnessed</text>

<rect x="103" y="54" width="61" height="28" rx="1.5" class="w"/>
<text x="107" y="60" class="m" font-size="2.8" letter-spacing=".8">MOTIVATION</text>
<g class="w">
  <circle cx="112" cy="67" r="3.2"/><circle cx="123" cy="67" r="3.2"/><circle cx="134" cy="67" r="3.2"/>
  <circle cx="145" cy="67" r="3.2"/><circle cx="156" cy="67" r="3.2"/>
</g>
<g class="m q" font-size="1.9" text-anchor="middle">
  <text x="112" y="72.5">1</text><text x="123" y="72.5">2</text><text x="134" y="72.5">3</text>
  <text x="145" y="72.5">4</text><text x="156" y="72.5">5</text>
</g>
<text x="107" y="78.5" class="s q" font-size="1.8" font-style="italic">starts 3, -1 per week - <tspan fill="#B03A2E" font-style="normal">0=QUITS</tspan></text>

<rect x="6" y="86" width="29" height="22" rx="1" class="hab"/>
<use href="#sh-torso" x="20.5" y="90"/>
<text x="20.5" y="95" class="m" font-size="2.4" text-anchor="middle">NEED</text>
<text x="20.5" y="100" class="s q" font-size="1.9" text-anchor="middle" font-style="italic">= Torso</text>
<text x="20.5" y="105" class="s q" font-size="1.9" text-anchor="middle">→ +1 Motivation</text>

<rect x="39" y="86" width="60" height="22" rx="1.5" class="w" fill="#E8D4B8" stroke-width=".8"/>
<text x="43" y="92" class="m" font-size="2.6" letter-spacing=".6">HERO</text>
<text x="95" y="91" class="m q" font-size="1.7" text-anchor="end">WK4</text>
<circle cx="94" cy="100" r="2.8" class="w" stroke-dasharray="2 1.3"/>
<text x="43" y="95" class="s" font-size="1.7">Once/game: cancel a named Event.</text>
<text x="43" y="98.3" class="s" font-size="1.7" fill="#6B4C9A">+2 Capital to you, +1 Motivation</text>
<text x="43" y="101.6" class="s" font-size="1.7">to another. Needs 3+ Motivation.</text>
<text x="43" y="106.3" class="m" font-size="1.4" fill="#B03A2E">NOBODY EMPTY STEPS UP</text>

<rect x="103" y="86" width="61" height="22" rx="1.5" class="seat"/>
<text x="107" y="92" class="m" font-size="2.6" letter-spacing=".6">FLEX</text>
<text x="160" y="91" class="m q" font-size="1.7" text-anchor="end">WK4</text>
<circle cx="157" cy="100" r="2.8" class="w" stroke-dasharray="2 1.3"/>
<text x="107" y="98" class="s q" font-size="1.9" font-style="italic">A sixth card costs 1 Motivation</text>
<text x="107" y="101.7" class="s q" font-size="1.9" font-style="italic">and a day you owe back.</text>
<text x="107" y="106.5" class="m" font-size="1.6" fill="#B03A2E">COSTS 5 IF NEVER REPAID</text>

</g>
</svg>
