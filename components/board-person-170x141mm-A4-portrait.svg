<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
<title>Person board, 244 x 142 mm (A4 landscape)</title>
<desc>One per player - print once each. Widened to A4 landscape so the five habitus seats can
be true 44 x 36 mm - the same size as the printed part-cards (cards-habitus-parts), which used
to be noticeably bigger than the seats meant to hold them. Below the habitus row: Flex, Hero,
Need, Zone Start and Skills each sit directly under a seat (upbringing, instinct, values,
education, skill - all 44 x 36 mm, same size as the seats above them), and Capital/Motivation
form their own row underneath, each spanning 2.5 seat widths. Parts are named by what they
are, not by body part; the shape on each seat is the cue.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .r { fill:none; stroke:#2A2620; stroke-width:.5; }
  .h { fill:none; stroke:#2A2620; stroke-width:.35; }
  .w { fill:none; stroke:#2A2620; stroke-width:.55; }
  .seat { fill:none; stroke:#2A2620; stroke-width:.5; stroke-dasharray:2.5 1.5; }
  .hab { fill:#F0E3D1; stroke:#2A2620; stroke-width:.5; stroke-dasharray:2.5 1.5; }
  .q { fill:#000000; }
  .ic { fill:#F2EDE0; stroke:#2A2620; stroke-width:.4; }
  .pip { fill:#2A2620; }
</style>

<defs>
  <g id="sh-base"><rect x="-2.4" y="-2.4" width="4.8" height="4.8" rx=".4" class="ic"/></g>
  <g id="sh-legs"><polygon points="0,-2.9 2.6,1.7 -2.6,1.7" class="ic"/></g>
  <g id="sh-torso"><polygon points="0,-2.6 2.47,-.8 1.53,2.1 -1.53,2.1 -2.47,-.8" class="ic"/></g>
  <g id="sh-torso-red"><polygon points="0,-2.6 2.47,-.8 1.53,2.1 -1.53,2.1 -2.47,-.8" fill="#905151" stroke="#2A2620" stroke-width=".4"/></g>
  <g id="sh-head"><polygon points="2.6,0 1.3,2.25 -1.3,2.25 -2.6,0 -1.3,-2.25 1.3,-2.25" class="ic"/></g>
  <g id="sh-legs-red"><polygon points="0,-2.9 2.6,1.7 -2.6,1.7" fill="#905151" stroke="#2A2620" stroke-width=".4"/></g>
  <g id="sh-item"><polygon points="0,-3.9 3.9,0 0,3.9 -3.9,0" class="ic"/></g>
  <g id="p1"><circle cx="0" cy="0" r=".5" class="pip"/></g>
  <path id="arcFT" d="M-5.826,2.12 A6.2,6.2 0 1 1 5.826,2.12" fill="none"/>
  <path id="arcFB" d="M-7.33,-2.668 A7.8,7.8 0 1 0 7.33,-2.668" fill="none"/>
  <g id="p2"><circle cx="-1" cy="0" r=".5" class="pip"/><circle cx="1" cy="0" r=".5" class="pip"/></g>
  <g id="p3"><circle cx="0" cy="-1" r=".5" class="pip"/><circle cx="-1" cy=".85" r=".5" class="pip"/><circle cx="1" cy=".85" r=".5" class="pip"/></g>
  <g id="p4"><circle cx="-.8" cy="-.8" r=".45" class="pip"/><circle cx=".8" cy="-.8" r=".45" class="pip"/><circle cx="-.8" cy=".8" r=".45" class="pip"/><circle cx=".8" cy=".8" r=".45" class="pip"/></g>
  <g id="p5"><circle cx="-.8" cy="-.8" r=".4" class="pip"/><circle cx=".8" cy="-.8" r=".4" class="pip"/><circle cx="0" cy="0" r=".4" class="pip"/><circle cx="-.8" cy=".8" r=".4" class="pip"/><circle cx=".8" cy=".8" r=".4" class="pip"/></g>
</defs>

<rect width="297" height="210" fill="#FFFFFF"/>
<g transform="translate(6,14)">
<rect width="244" height="148" rx="2" class="r"/>

<text x="6" y="10" class="m" font-size="5.4" letter-spacing="2">SPECIMEN</text>
<text x="238" y="9" class="s" font-size="3.2" text-anchor="end" font-style="italic">the figure is the record - nothing here is written</text>
<line x1="6" y1="13" x2="238" y2="13" class="h"/>

<text x="6" y="21" class="m q" font-size="3" letter-spacing="1.1">HABITUS</text>
<g class="hab">
  <rect x="6" y="24" width="44" height="36" rx="1.5"/><rect x="53" y="24" width="44" height="36" rx="1.5"/>
  <rect x="100" y="24" width="44" height="36" rx="1.5"/><rect x="147" y="24" width="44" height="36" rx="1.5"/>
  <rect x="194" y="24" width="44" height="36" rx="1.5"/>
</g>
<g class="m" font-size="3.2" text-anchor="middle" letter-spacing=".6">
  <text x="28" y="40">UPBRINGING</text><text x="75" y="40">VALUES</text><text x="122" y="40">INSTINCT</text>
  <text x="169" y="40">EDUCATION</text><text x="216" y="40">SKILL</text>
</g>
<use href="#sh-base" x="28" y="31"/><use href="#sh-torso" x="75" y="31"/>
<use href="#sh-legs" x="122" y="31"/><use href="#sh-head" x="169" y="31"/>
<use href="#sh-item" x="216" y="31"/>
<g class="s q" font-size="3.2" text-anchor="middle">
  <text x="28" y="49">→ Motivation</text><text x="75" y="49">→ Events</text><text x="122" y="49">→ Pressure Response</text>
  <text x="169" y="49">→ Zone row</text><text x="216" y="49">→ Zone column</text>
</g>
<text x="122" y="65" class="s q" font-size="3.2" text-anchor="middle" font-style="italic">the shape on each seat tells you which part-card belongs there</text>

<g transform="translate(0,0)">
<!-- Row A: Flex (under upbringing), Need (under values), Hero (under instinct), Zone Start (under education), Skills (under skill) - all 44 x 36 -->
<rect x="6" y="70" width="44" height="36" rx="1.5" class="w"/>
<circle cx="28" cy="88" r="9" class="w" stroke-dasharray="2 1.3"/>
<g transform="translate(28,88) scale(.945)">
  <text class="m" font-size="2.2" letter-spacing=".1" text-anchor="middle"><textPath href="#arcFT" startOffset="50%">A DAY OWED</textPath></text>
  <rect x="-5.6" y="-2.9" width="11.2" height="5.4" rx=".5" fill="#D3B1B1"/>
  <text y="1.3" class="m" font-size="3.8" font-weight="bold" text-anchor="middle">FLEX</text>
  <text class="m" font-size="2.2" letter-spacing=".1" text-anchor="middle"><textPath href="#arcFB" startOffset="50%">FLIP TO REPAY</textPath></text>
</g>

<rect x="53" y="70" width="44" height="36" rx="1.5" class="seat" style="fill:#F0E3D1"/>
<use href="#sh-torso-red" x="75" y="79"/>
<text x="75" y="88" class="m" font-size="3.2" text-anchor="middle">NEED</text>
<text x="75" y="92.6" class="s" font-size="3" text-anchor="middle">Every week: if your</text>
<text x="75" y="96.4" class="s" font-size="3" text-anchor="middle">values' condition is</text>
<text x="75" y="100.2" class="s" font-size="3" text-anchor="middle">met this week,</text>
<text x="75" y="104" class="s" font-size="3" text-anchor="middle"><tspan font-weight="bold">+1 Motivation</tspan> (cap 5).</text>

<rect x="100" y="70" width="44" height="36" rx="1.5" class="seat" style="fill:#F0E3D1"/>
<use href="#sh-legs-red" x="122" y="79"/>
<text x="122" y="88" class="m" font-size="3.2" letter-spacing=".6" text-anchor="middle">HERO</text>
<text x="122" y="92.6" class="s" font-size="3" text-anchor="middle">Once a game: cancel an Event.</text>
<text x="122" y="96.4" class="s" font-size="3" text-anchor="middle"><tspan font-weight="bold">+2 Capital</tspan> to you,</text>
<text x="122" y="100.2" class="s" font-size="3" text-anchor="middle"><tspan font-weight="bold">+1 Motivation</tspan> to another.</text>
<text x="122" y="104" class="s" font-size="3" text-anchor="middle">Needs 3 Motivation or more.</text>

<rect x="147" y="70" width="44" height="36" rx="1.5" class="w"/>
<text x="169" y="78" class="m q" font-size="3.2" text-anchor="middle">ZONE START</text>
<text x="151" y="86.5" class="s q" font-size="3.2" font-style="italic" textLength="16.2" lengthAdjust="spacingAndGlyphs">Mark where your</text>
<text x="151" y="91.5" class="s q" font-size="3.2" font-style="italic" textLength="9.7" lengthAdjust="spacingAndGlyphs">education</text>
<g transform="translate(163.8,90.3) scale(.8)"><use href="#sh-head"/></g>
<text x="167.5" y="91.5" class="s q" font-size="3.2" font-style="italic" textLength="3.2" lengthAdjust="spacingAndGlyphs">row</text>
<text x="151" y="96.5" class="s q" font-size="3.2" font-style="italic" textLength="16.2" lengthAdjust="spacingAndGlyphs">meets your skill</text>
<g transform="translate(170.4,95.3) scale(.55)"><use href="#sh-item"/></g>
<text x="151" y="101.5" class="s q" font-size="3.2" font-style="italic" textLength="18.4" lengthAdjust="spacingAndGlyphs">column, at setup.</text>

<text x="216" y="68.3" class="m q" font-size="3" text-anchor="middle">SKILLS</text>
<rect x="194" y="70" width="44" height="36" rx="1.5" class="w"/>
<g class="h">
  <line x1="202.8" y1="70" x2="202.8" y2="106"/><line x1="211.6" y1="70" x2="211.6" y2="106"/>
  <line x1="220.4" y1="70" x2="220.4" y2="106"/><line x1="229.2" y1="70" x2="229.2" y2="106"/>
  <line x1="194" y1="77.2" x2="238" y2="77.2"/><line x1="194" y1="84.4" x2="238" y2="84.4"/>
  <line x1="194" y1="91.6" x2="238" y2="91.6"/><line x1="194" y1="98.8" x2="238" y2="98.8"/>
</g>
<g>
  <g transform="translate(198.4,108.6) scale(.55)"><use href="#sh-item"/><use href="#p1"/></g>
  <g transform="translate(207.2,108.6) scale(.55)"><use href="#sh-item"/><use href="#p2"/></g>
  <g transform="translate(216,108.6) scale(.55)"><use href="#sh-item"/><use href="#p3"/></g>
  <g transform="translate(224.8,108.6) scale(.55)"><use href="#sh-item"/><use href="#p4"/></g>
  <g transform="translate(233.6,108.6) scale(.55)"><use href="#sh-item"/><use href="#p5"/></g>
</g>
<g>
  <g transform="translate(241,73.6) scale(.7)"><use href="#sh-head"/><use href="#p1"/></g>
  <g transform="translate(241,80.8) scale(.7)"><use href="#sh-head"/><use href="#p2"/></g>
  <g transform="translate(241,88) scale(.7)"><use href="#sh-head"/><use href="#p3"/></g>
  <g transform="translate(241,95.2) scale(.7)"><use href="#sh-head"/><use href="#p4"/></g>
  <g transform="translate(241,102.4) scale(.7)"><use href="#sh-head"/><use href="#p5"/></g>
</g>

<!-- Row B: Motivation (x 6-97, ends where HERO ends) and Capital (x 100-238, starts where NEED starts); six 18 mm wells for the 17 mm marker; pushed 2mm down to clear the SKILLS column icons -->
<g transform="translate(0,2)">
<rect x="100" y="110" width="138" height="32" rx="1.5" class="w" style="fill:#D9D3C4;stroke:#6E6249"/>
<text x="104" y="116.5" class="m" font-size="3.4" letter-spacing=".8">CAPITAL</text>
<text x="234" y="116.5" class="m q" font-size="2.6" text-anchor="end">WEEK 2</text>
<g style="stroke:#6E6249" stroke-width=".55" fill="none">
  <circle cx="116.5" cy="128" r="9"/><circle cx="137.5" cy="128" r="9"/><circle cx="158.5" cy="128" r="9"/>
  <circle cx="179.5" cy="128" r="9"/><circle cx="200.5" cy="128" r="9"/><circle cx="221.5" cy="128" r="9"/>
</g>
<g class="m q" font-size="5" text-anchor="middle">
  <text x="116.5" y="129.8">0</text><text x="137.5" y="129.8">1</text><text x="158.5" y="129.8">2</text>
  <text x="179.5" y="129.8">3</text><text x="200.5" y="129.8">4</text><text x="221.5" y="129.8">5</text>
</g>
<text x="104" y="140.6" class="s q" font-size="2.9" font-style="italic">one marker - slide it. Starts 0, only grows if witnessed.</text>
</g>

<g transform="translate(0,2)">
<rect x="6" y="110" width="91" height="32" rx="1.5" class="w" style="fill:#D3B1B1"/>
<text x="10" y="116.5" class="m" font-size="3.4" letter-spacing=".8">MOTIVATION</text>
<g stroke="#2A2620" stroke-width=".55" fill="none">
  <rect x="12" y="121" width="8.4" height="8.4" rx="1"/><rect x="29" y="121" width="8.4" height="8.4" rx="1"/><rect x="46" y="121" width="8.4" height="8.4" rx="1"/>
  <rect x="63" y="121" width="8.4" height="8.4" rx="1"/><rect x="80" y="121" width="8.4" height="8.4" rx="1"/>
</g>
<text x="10" y="134.4" class="s q" font-size="2.9" font-style="italic">tokens, one per square. Starts 5.</text>
<text x="10" y="138.6" class="s q" font-size="2.9" font-style="italic">The grind: -1 every week. At 0 you quit.</text>
</g>
</g>

</g>

<!-- THE WEEK: the weekly turn, printed beside the figure so every player has it in front of them (rulebook 6.1) -->
<rect x="254" y="14" width="37" height="148" rx="2" class="r"/>
<text x="258" y="22" class="m" font-size="3.6" letter-spacing="1.2">THE WEEK</text>
<line x1="258" y1="25" x2="287" y2="25" class="h"/>
<g class="s" font-size="2.6">
  <text x="258" y="30" font-size="3" font-weight="bold">1  PLAN</text>
  <text x="258" y="34">Lay five cards.</text>
  <text x="258" y="37.8">Nothing resolves.</text>

  <text x="258" y="42.8" font-size="3" font-weight="bold">2  SHIT HAPPENS</text>
  <text x="258" y="46.8">Draw 2 Events and</text>
  <text x="258" y="50.6">read them out.</text>

  <text x="258" y="55.6" font-size="3" font-weight="bold">3  ADAPT</text>
  <text x="258" y="59.6">Pay each Event's</text>
  <text x="258" y="63.4">Adaptability cost in</text>
  <text x="258" y="67.2">tokens to cancel it.</text>
  <text x="258" y="71">A Hero (3+ Motivation)</text>
  <text x="258" y="74.8">cancels one free.</text>

  <text x="258" y="79.8" font-size="3" font-weight="bold">4  EVENTS HAPPEN</text>
  <text x="258" y="83.8">Resolve every Event</text>
  <text x="258" y="87.6">you did not cancel.</text>

  <text x="258" y="92.6" font-size="3" font-weight="bold">5  THE WEEK RUNS</text>
  <text x="258" y="96.6">Resolve the five cards,</text>
  <text x="258" y="100.4">any order. They are</text>
  <text x="258" y="104.2">the team's.</text>

  <text x="258" y="109.2" font-size="3" font-weight="bold">6  CLOSE</text>
  <text x="258" y="113.2">Bank finished features.</text>
  <text x="258" y="117">Walk the Ledger. Add</text>
  <text x="258" y="120.8">this week's tokens.</text>

  <text x="258" y="125.8" font-size="3" font-weight="bold">7  MOTIVATION</text>
  <text x="258" y="129.8">ONE net number: the</text>
  <text x="258" y="133.6">grind -1, values, Need.</text>
  <text x="258" y="137.4">At 0 you quit, and</text>
  <text x="258" y="141.2">everyone left loses 1.</text>
  <text x="258" y="145">Checked only here.</text>
</g>
</svg>
