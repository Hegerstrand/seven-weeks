<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<title>Sheet 5b - Activity cards, the second sheet (60 x 88 mm)</title>
<desc>Sheet 5 holds nine cards, which is all an A4 will take at 63 x 88 - this sheet is a second
sheet of eight, not an afterthought. Two more Work (five total with sheet 5), two Teach, and
one each of Plan, Demo, Reflect and Learn. One print each, no reprinting. Cut on the
outer line. Print at 100%.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .c { fill:none; stroke:#2A2620; stroke-width:.5; }
  .h { stroke:#2A2620; stroke-width:.4; fill:none; }
  .q { fill:#000000; }
  .trust { fill:#000000; }
  .adapt { fill:#000000; }
  .sy { fill:none; stroke:#2A2620; stroke-width:.45; stroke-linecap:round; stroke-linejoin:round; }
</style>

<defs>
  <!-- 63 x 88 card. Text column is x=5..58 (53 mm); baselines stop at y=84. -->

  <g id="work" transform="scale(.95238095,1)">
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="13" class="m" font-size="7.5" letter-spacing="1.5">WORK</text>
    <line x1="5" y1="17" x2="58" y2="17" class="h" stroke-width=".7"/>
    <text x="5" y="23.5" class="s" font-size="4.2">The only card that moves</text>
    <text x="5" y="28.3" class="s" font-size="4.2">the project. Hence the trap.</text>
    <g transform="translate(0,11)">
    <rect x="4" y="22" width="50" height="10" rx="1.2" fill="#EFE4D3"/>
    <text x="5" y="30" class="s" font-size="7">+1 to one feature</text>
    </g>
  </g>

  <!-- Zone tile faces, same glyphs and colours as THE ZONE legend (6 x 6 mm, centred on 0,0) -->
  <g id="ztile-one"><rect x="-3" y="-3" width="6" height="6" rx=".6" fill="#C7CFB5" stroke="#2A2620" stroke-width=".4"/><circle cx="0" cy="0" r="1.1" fill="#2A2620"/></g>
  <g id="ztile-stack"><rect x="-3" y="-3" width="6" height="6" rx=".6" fill="#F7D7A1" stroke="#2A2620" stroke-width=".4"/><circle cx="-.7" cy="-.7" r="1.1" fill="#F7D7A1" stroke="#2A2620" stroke-width=".35"/><circle cx=".7" cy=".7" r="1.1" fill="#2A2620"/></g>

  <!-- the three objects of reflection, same symbols as the Team Reflexivity wells on SHIT HAPPENS -->
  <g id="sym-obj" class="sy"><circle r="3.3"/><circle r="1.9"/><circle r=".6" fill="#2A2620"/></g>
  <g id="sym-strat" class="sy"><path d="M-2.9,2.9 C-2.9,-1.2 2.6,1.2 2.6,-2.1"/><path d="M0.9,-2.6 L2.7,-3.2 L3.5,-1.1"/></g>
  <g id="sym-proc" class="sy"><path d="M2.9,-1.1 A3.1,3.1 0 1 0 2.4,1.9"/><path d="M0.9,-1.5 L3.0,-1.0 L3.4,-3.2"/></g>

  <g id="teach" transform="scale(.95238095,1)">
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="13" class="m" font-size="7.5" letter-spacing="1.5">TEACH</text>
    <line x1="5" y1="17" x2="58" y2="17" class="h" stroke-width=".7"/>
    <text x="5" y="23.5" class="s" font-size="4">Scaffolding: give it away</text>
    <text x="5" y="28.3" class="s" font-size="4">and it becomes standing.</text>
    <g transform="translate(0,8)">
    <text x="5" y="27" class="s" font-size="5.4">Up to 2 characters may</text>
    <text x="5" y="33" class="s" font-size="5.4">each teach 1 partner</text>
    <line x1="5" y1="38" x2="58" y2="38" class="h"/>
    <text x="5" y="45" class="s" font-size="4.2">Partner marks a covered</text>
    <text x="5" y="50" class="s" font-size="4.2">square next to yours,</text>
    <text x="5" y="55" class="s" font-size="4.2">diagonals too.</text>
    <text x="5" y="60" class="m trust" font-size="3.2">DEAD IF TRUST 1 OR LESS</text>
    <rect x="27.7" y="63.24" width="26.3" height="3.04" rx=".4" fill="#D9D3C4"/>
    <text x="5" y="65.5" class="m q" font-size="2.9">EACH TEACHER GAINS +1 <tspan>CAPITAL</tspan></text>
    <text x="5" y="72" class="m q" font-size="2.9">ZONE:</text>
    <use href="#ztile-one" x="17" y="71"/>
    <text x="21" y="72" class="m q" font-size="2.9">FLIPS TO</text>
    <use href="#ztile-stack" x="40" y="71"/>
    </g>
  </g>

  <g id="plan" transform="scale(.95238095,1)">
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="13" class="m" font-size="7.5" letter-spacing="1.5">PLAN</text>
    <line x1="5" y1="17" x2="58" y2="17" class="h" stroke-width=".7"/>
    <text x="5" y="23.5" class="s" font-size="4.2">Planning pays on hard</text>
    <text x="5" y="28.3" class="s" font-size="4.2">problems. Only on those.</text>
    <g transform="translate(0,10)">
    <text x="5" y="27" class="s" font-size="5.4"><tspan font-style="italic">Every</tspan> Work card on</text>
    <text x="5" y="34" class="s" font-size="5.4">that feature this week</text>
    <rect x="4" y="40" width="50" height="8" rx="1.2" fill="#EFE4D3"/>
    <text x="5" y="46" class="m" font-size="5">+1 EXTRA WORK</text>
    <text x="5" y="50.5" class="m q" font-size="2.6">HIGH COMPLEXITY: ALSO NEXT WEEK</text>
    <line x1="5" y1="52" x2="58" y2="52" class="h"/>
    <text x="5" y="58.5" class="m q" font-size="2.9">DEAD AT SHARED PRACTICE</text>
    <text x="5" y="62.7" class="m q" font-size="2.9">1 OR LESS, AND ON LOW.</text>
    <text x="5" y="68" class="m" font-size="3.1">PAYS AS THE WORK RESOLVES</text>
    </g>
  </g>

  <g id="demo" transform="scale(.95238095,1)">
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="13" class="m" font-size="7.5" letter-spacing="1.5">DEMO</text>
    <line x1="5" y1="17" x2="58" y2="17" class="h" stroke-width=".7"/>
    <text x="5" y="23.5" class="s" font-size="4">The field decides who speaks.</text>
    <g transform="translate(0,6)">
    <text x="5" y="24" class="m" font-size="3.1">CAPITAL AT OR ABOVE AVERAGE</text>
    <rect x="4" y="29" width="50" height="9" rx="1.2" fill="#D9D3C4"/>
    <text x="5" y="36" class="s" font-size="6.4">+1 Capital</text>
    <text x="5" y="46" class="s" font-size="4.4">to one named team member.</text>
    <rect x="4" y="49.5" width="50" height="7" rx="1" fill="#D3B1B1"/>
    <text x="5" y="54.6" class="s" font-size="4.6">Also <tspan font-weight="bold">+1 Motivation</tspan>.</text>
    <rect x="4" y="59.5" width="50" height="7" rx="1" fill="#B5C7CF"/>
    <text x="5" y="64.6" class="s" font-size="4.6">Team: <tspan font-weight="bold">+1 Adaptability</tspan>.</text>
    </g>
  </g>

  <g id="reflect" transform="scale(.95238095,1)">
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="13" class="m" font-size="7.5" letter-spacing="1.5">REFLECT</text>
    <line x1="5" y1="17" x2="58" y2="17" class="h" stroke-width=".7"/>
    <text x="5" y="23.5" class="s" font-size="4.2">Ask what's not working -</text>
    <text x="5" y="28.3" class="s" font-size="4.2">you can only reflect on it.</text>
    <text x="5" y="33" class="m" font-size="3">TRUST 3 OR MORE</text>
    <rect x="4" y="35" width="50" height="8.5" rx="1.2" fill="#B5C7CF"/>
    <text x="5" y="41.3" class="s adapt" font-size="7.4">+1 Adaptability</text>
    <text x="5" y="47.6" class="m q" font-size="2.8">LAST WEEK GAVE EVIDENCE?</text>
    <use href="#sym-obj" transform="translate(8,52.4) scale(.8)"/><text x="13" y="53.6" class="s" font-size="3.6">a feature was banked</text>
    <use href="#sym-strat" transform="translate(8,57.8) scale(.8)"/><text x="13" y="59" class="s" font-size="3.6">you adapted to 2 Events</text>
    <use href="#sym-proc" transform="translate(8,63.2) scale(.8)"/><text x="13" y="64.4" class="s" font-size="3.3">a Hero or a token was played, or</text>
    <text x="13" y="68" class="s" font-size="3.3">an Event cost a Ledger track</text>
    <rect x="4" y="69.4" width="50" height="10.6" rx="1" fill="#F7D7A1"/>
    <text x="5" y="73.6" class="s" font-size="4"><tspan font-weight="bold">Yes: +1 Shared Practice</tspan></text>
    <text x="5" y="78.2" class="s" font-size="3.2">and +1 Motivation to anyone on 3 or less</text>
    <text x="5" y="83.4" class="m q" font-size="2.6">ALSO FILLS A WELL. TOKEN AT CLOSE.</text>
  </g>

  <g id="learn" transform="scale(.95238095,1)">
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="13" class="m" font-size="7.5" letter-spacing="1.5">LEARN</text>
    <line x1="5" y1="17" x2="58" y2="17" class="h" stroke-width=".7"/>
    <text x="5" y="23.5" class="s" font-size="4">Nobody taught you.</text>
    <text x="5" y="28.3" class="s" font-size="4">It shows, and it holds.</text>
    <g transform="translate(0,8)">
    <text x="5" y="27" class="s" font-size="5.4">Everyone marks</text>
    <text x="5" y="33" class="s" font-size="5.4">a free square each</text>
    <line x1="5" y1="38" x2="58" y2="38" class="h"/>
    <text x="5" y="45" class="s" font-size="4.2">Left or right of one they</text>
    <text x="5" y="50" class="s" font-size="4.2">cover, in their own row.</text>
    <text x="5" y="55" class="s" font-size="4.2"><tspan font-weight="bold">No teacher needed.</tspan></text>
    <text x="5" y="60.5" class="m q" font-size="2.9">COSTS THE DAY, NOTHING ELSE</text>
    <rect x="9.82" y="63.24" width="12.98" height="3.04" rx=".4" fill="#D9D3C4"/>
    <text x="5" y="65.5" class="m q" font-size="2.9">NO <tspan>CAPITAL</tspan> FOR THIS ONE</text>
    <text x="5" y="72" class="m q" font-size="2.9">ZONE:</text>
    <use href="#ztile-one" x="17" y="71"/>
    <text x="21" y="72" class="m q" font-size="2.9">PUT DOWN</text>
    <use href="#ztile-stack" x="40" y="71"/>
    <text x="44" y="72" class="m q" font-size="2.9">OR FLIP</text>
    </g>
  </g>
</defs>

<rect width="210" height="297" fill="#FFFFFF"/>
<text x="10" y="8" class="m" font-size="3.2" letter-spacing=".5">SHEET 5b · ACTIVITY CARDS · PRINT AT 100% · PRINT ONCE</text>

<use href="#work" x="10" y="12"/>
<use href="#work" x="76" y="12"/>
<use href="#teach" x="142" y="12"/>

<use href="#teach" x="10" y="104"/>
<use href="#plan" x="76" y="104"/>
<use href="#demo" x="142" y="104"/>

<use href="#reflect" x="10" y="196"/>
<use href="#learn" x="76" y="196"/>
</svg>
