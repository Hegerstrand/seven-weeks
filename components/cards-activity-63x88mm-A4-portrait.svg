<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<title>Sheet 5 - Activity cards, 60 x 88 mm (A4)</title>
<desc>Nine cards, 3 x 3 on A4, one print - no reprinting needed. Work (the card you'll want
most) gets three slots here and two more on sheet 5b, five total. Coordinate, Align and
Celebrate - the week 1/3 core loop - get two each. Teach, Plan, Demo, Reflect, Meet and Learn
moved to sheet 5b, which had the room. They drop straight into the week slots on Sheet 1.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .c { fill:none; stroke:#2A2620; stroke-width:.5; }
  .h { stroke:#2A2620; stroke-width:.4; fill:none; }
  .q { fill:#000000; }
  .trust { fill:#000000; }
  .capab { fill:#000000; }
  .shpra { fill:#000000; }
  .adapt { fill:#000000; }
</style>

<defs>
  <!-- 63 x 88 card. Text column is x=5..58 (53 mm); baselines stop at y=84. -->

  <g id="work" transform="scale(.95238095,1)">
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="13" class="m" font-size="7.5" letter-spacing="1.5">WORK</text>
    <line x1="5" y1="17" x2="58" y2="17" class="h" stroke-width=".7"/>
    <rect x="4" y="22" width="50" height="10" rx="1.2" fill="#EFE4D3"/>
    <text x="5" y="30" class="s" font-size="7">+1 to one feature</text>
    <text x="5" y="42" class="s" font-size="4.4">Adjust total Work for</text>
    <text x="5" y="48" class="s" font-size="4.4">Capability and Shared Practice.</text>
    <line x1="5" y1="55" x2="58" y2="55" class="h"/>
    <text x="5" y="78" class="s" font-size="4.2" font-style="italic">The only card that moves</text>
    <text x="5" y="83" class="s" font-size="4.2" font-style="italic">the project. Hence the trap.</text>
  </g>

  <g id="coordinate" transform="scale(.95238095,1)">
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="13" class="m" font-size="6.6" letter-spacing="1.2">COORDINATE</text>
    <line x1="5" y1="17" x2="58" y2="17" class="h" stroke-width=".7"/>
    <rect x="4" y="24" width="50" height="11" rx="1.2" fill="#D3CEDF"/>
    <text x="5" y="32" class="s trust" font-size="9">+1 Trust</text>
    <line x1="5" y1="40" x2="58" y2="40" class="h"/>
    <text x="5" y="49" class="s" font-size="4.4"><tspan class="trust">Trust ≤ 1</tspan>: Teach is dead.</text>
    <text x="5" y="58" class="m q" font-size="3.1">TRACKS RISE 1 A WEEK, MAX</text>
    <text x="5" y="77" class="s" font-size="4.2" font-style="italic">Safety is not declared.</text>
    <text x="5" y="82" class="s" font-size="4.2" font-style="italic">It is built, dully.</text>
  </g>

  <g id="align" transform="scale(.95238095,1)">
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="13" class="m" font-size="7.5" letter-spacing="1.5">ALIGN</text>
    <line x1="5" y1="17" x2="58" y2="17" class="h" stroke-width=".7"/>
    <text x="5" y="27" class="s" font-size="5.8">Clear <tspan font-weight="bold">Unclear</tspan> from</text>
    <text x="5" y="34" class="s" font-size="5.8">one feature</text>
    <line x1="5" y1="40" x2="58" y2="40" class="h"/>
    <text x="5" y="49" class="s" font-size="5">Nothing Unclear?</text>
    <rect x="4" y="50.5" width="50" height="6.5" rx="1" fill="#B5C7CF"/>
    <text x="5" y="56" class="s" font-size="4.8"><tspan font-weight="bold" class="adapt">+1 Adaptability</tspan> instead.</text>
    <text x="5" y="64" class="m q" font-size="3.1">ADAPTABILITY = CARDS YOU</text>
    <text x="5" y="69" class="m q" font-size="3.1">MAY RE-LAY AFTER EVENTS</text>
    <text x="5" y="77" class="s" font-size="4.2" font-style="italic">Clear it the same week and</text>
    <text x="5" y="82" class="s" font-size="4.2" font-style="italic">the Work still counts.</text>
  </g>

  <g id="celebrate" transform="scale(.95238095,1)">
    <rect width="63" height="88" rx="2" class="c" stroke-width=".9"/>
    <text x="5" y="13" class="m" font-size="6.6" letter-spacing="1.2">CELEBRATE</text>
    <line x1="5" y1="17" x2="58" y2="17" class="h" stroke-width=".7"/>
    <rect x="4" y="23.39" width="50" height="8" rx="1.2" fill="#D3B1B1"/>
    <text x="5" y="29" class="s" font-size="6.6">+2 Motivation</text>
    <text x="5" y="36" class="s" font-size="6.6">to everyone</text>
    <line x1="5" y1="42" x2="58" y2="42" class="h"/>
    <text x="5" y="51" class="s" font-size="5.4"><tspan font-weight="bold">+3</tspan> if a feature was</text>
    <text x="5" y="58" class="s" font-size="5.4">banked this week.</text>
    <rect x="36.98" y="63.48" width="20.83" height="3.22" rx=".45" fill="#D3B1B1"/>
    <text x="5" y="66" class="m" font-size="2.8">NO CELEBRATE: LOSE 1 MOTIVATION</text>
    <text x="5" y="71" class="m" font-size="3.1">AT 0, A CHARACTER LEAVES</text>
    <text x="5" y="79" class="s" font-size="4.2" font-style="italic">Nobody rests at work. You</text>
    <text x="5" y="84" class="s" font-size="4.2" font-style="italic">ship something and say so.</text>
  </g>

</defs>

<rect width="210" height="297" fill="#FFFFFF"/>
<text x="10" y="8" class="m" font-size="3.2" letter-spacing=".5">SHEET 5 · ACTIVITY CARDS · PRINT AT 100% · PRINT ONCE</text>

<use href="#work" x="10" y="12"/>
<use href="#work" x="76" y="12"/>
<use href="#coordinate" x="142" y="12"/>

<use href="#coordinate" x="10" y="104"/>
<use href="#align" x="76" y="104"/>
<use href="#align" x="142" y="104"/>

<use href="#celebrate" x="10" y="196"/>
<use href="#celebrate" x="76" y="196"/>
<use href="#work" x="142" y="196"/>
</svg>
