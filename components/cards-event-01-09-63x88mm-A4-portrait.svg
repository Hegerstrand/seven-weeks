<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<title>Sheet 6 - Event cards 1-9, 63 x 88 mm (A4)</title>
<desc>Nine "shit happens" cards, same size as the Activity cards so the two decks handle alike.
Draw two every week, after the week is laid out. Sheet 7 carries cards 10-18.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .c { fill:none; stroke:#000000; stroke-width:.5; }
  .h { stroke:#000000; stroke-width:.4; fill:none; }
  .w { fill:none; stroke:#000000; stroke-width:.7; }
  .q { fill:#3A3A3A; }
  .lb { font-family:"IBM Plex Mono","Courier New",monospace; font-size:2.9px; fill:#3A3A3A; }
  .vl { font-family:"IBM Plex Mono","Courier New",monospace; font-size:2.9px; fill:#000000; }
  .ic { fill:#E8D4B8; stroke:#000000; stroke-width:.35; }
  .pip { fill:#000000; stroke:none; }
  /* header tint = the Ledger row that answers this category */
  .cat-ppl  { fill:#F9E3E0; }
  .cat-env  { fill:#DFF0DB; }
  .cat-mgmt { fill:#FAECBE; }
  .cat-cust { fill:#DCE7F2; }
  .trust, .capab, .shpra, .adapt { fill:#000000; }
</style>

<defs>
  <g id="i-base"><rect x="-2.1" y="-2.1" width="4.2" height="4.2" rx=".3" class="ic"/></g>
  <g id="i-legs"><polygon points="0,-2.5 2.2,1.4 -2.2,1.4" class="ic"/></g>
  <g id="i-head"><polygon points="2.3,0 1.15,2 -1.15,2 -2.3,0 -1.15,-2 1.15,-2" class="ic"/></g>
  <g id="i-item"><polygon points="0,-2.6 2.6,0 0,2.6 -2.6,0" class="ic"/></g>
  <g id="i-torso"><polygon points="0,-2 1.9,-.62 1.18,1.62 -1.18,1.62 -1.9,-.62" class="ic"/></g>
  <g id="q1"><circle cx="0" cy="0" r=".45" class="pip"/></g>
  <g id="q2"><circle cx="-.95" cy="0" r=".45" class="pip"/><circle cx=".95" cy="0" r=".45" class="pip"/></g>
  <g id="q3"><circle cx="0" cy="-.95" r=".45" class="pip"/><circle cx="-.95" cy=".8" r=".45" class="pip"/><circle cx=".95" cy=".8" r=".45" class="pip"/></g>
  <g id="q4"><circle cx="-.95" cy="-.95" r=".45" class="pip"/><circle cx=".95" cy="-.95" r=".45" class="pip"/><circle cx="-.95" cy=".95" r=".45" class="pip"/><circle cx=".95" cy=".95" r=".45" class="pip"/></g>
  <!-- The WAYS OUT block: ADAPT and HERO cancel outright; HABIT only takes 1 off the ADAPT cost
       ADAPT n = spend n of the team's re-lay budget
       HERO    = one habitus part, once per game, free, +2 Capital
       HABIT   = if the team holds it, the ADAPT cost drops by 1; at 0 it never happens -->

  <g id="status">
    <rect x=".6" y=".6" width="61.8" height="22.4" rx="1.4" class="cat-mgmt"/>
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="9" class="m q" font-size="3.4" letter-spacing="1">MANAGEMENT</text>
    <text x="5" y="19" class="m" font-size="5" letter-spacing=".6">STATUS MEETING</text>
    <line x1="5" y1="23" x2="58" y2="23" class="h" stroke-width=".7"/>
    <text x="5" y="28" class="s" font-size="4.4">Remove one card from this</text>
    <text x="5" y="33" class="s" font-size="4.4">week. It never happens.</text>
    <text x="5" y="38" class="s" font-size="4.2">Everyone <tspan font-weight="bold">loses 1 Motivation</tspan>.</text>
    <rect x="5" y="41" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="45" class="m q" font-size="2.8" letter-spacing="1">WAYS OUT</text>
    <text x="8" y="49.5" class="lb">ADAPT</text><text x="20" y="49.5" class="m" font-size="4">2</text>
    <rect x="5.4" y="55.6" width="52.2" height="7.2" class="cat-mgmt"/>
    <text x="8" y="54" class="lb">HERO</text><g transform="translate(18.5,52.9)"><use href="#i-head"/><use href="#q1"/></g><text x="23" y="54" class="vl">TAKE CHARGE</text>
    <text x="8" y="58.5" class="lb">HABIT</text><text x="20" y="58.5" class="vl shpra">SHARED REPERTOIRE</text>
    <text x="20" y="62" class="m" font-size="2.6">SO IT COSTS 1 INSTEAD</text>
    <g transform="translate(7,66.9)"><use href="#i-torso"/><use href="#q1"/></g><text x="11" y="68" class="m" font-size="2.7" fill="#B03A2E">AUTONOMY: LOSE 1 MOTIVATION</text>
    <g transform="translate(7,71.4)"><use href="#i-torso"/><use href="#q2"/></g><text x="11" y="72.5" class="m q" font-size="2.7">HIERARCHY: NO LOSS</text>
    <text x="5" y="79" class="s" font-size="3.2" font-style="italic">Not about information: about</text>
    <text x="5" y="83.5" class="s" font-size="3.2" font-style="italic">being seen to be informed.</text>
  </g>

  <g id="budget">
    <rect x=".6" y=".6" width="61.8" height="22.4" rx="1.4" class="cat-mgmt"/>
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="9" class="m q" font-size="3.4" letter-spacing="1">MANAGEMENT</text>
    <text x="5" y="19" class="m" font-size="5.6" letter-spacing=".8">BUDGET CUT</text>
    <line x1="5" y1="23" x2="58" y2="23" class="h" stroke-width=".7"/>
    <text x="5" y="29" class="s" font-size="5.4">Everyone:</text>
    <text x="5" y="37" class="s" font-size="5.4"><tspan font-weight="bold">Lose 1 Motivation</tspan></text>
    <rect x="5" y="41" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="45" class="m q" font-size="2.8" letter-spacing="1">WAYS OUT</text>
    <text x="8" y="49.5" class="lb">ADAPT</text><text x="20" y="49.5" class="m" font-size="4">1</text>
    <rect x="5.4" y="55.6" width="52.2" height="7.2" class="cat-mgmt"/>
    <text x="8" y="54" class="lb">HERO</text><g transform="translate(18.5,52.9)"><use href="#i-base"/><use href="#q4"/></g><text x="23" y="54" class="vl">PUBLIC SECTOR</text>
    <text x="8" y="58.5" class="lb">HABIT</text><text x="20" y="58.5" class="vl shpra">SHARED REPERTOIRE</text>
    <text x="20" y="62" class="m" font-size="2.6">SO IT NEVER HAPPENS</text>
    <g transform="translate(7,66.9)"><use href="#i-torso"/><use href="#q1"/></g><text x="11" y="68" class="m" font-size="2.7" fill="#B03A2E">AUTONOMY: LOSE 1 MOTIVATION</text>
    <g transform="translate(7,71.4)"><use href="#i-torso"/><use href="#q2"/></g><text x="11" y="72.5" class="m q" font-size="2.7">HIERARCHY: NO LOSS</text>
    <text x="5" y="79" class="s" font-size="3.2" font-style="italic">Nobody will explain the</text>
    <text x="5" y="83.5" class="s" font-size="3.2" font-style="italic">reasoning to you.</text>
  </g>

  <g id="unclear">
    <rect x=".6" y=".6" width="61.8" height="28.4" rx="1.4" class="cat-cust"/>
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="9" class="m q" font-size="3.4" letter-spacing="1">CUSTOMER</text>
    <text x="5" y="18" class="m" font-size="5.6" letter-spacing=".8">UNCLEAR</text>
    <text x="5" y="25" class="m" font-size="5.6" letter-spacing=".8">REQUIREMENT</text>
    <line x1="5" y1="29" x2="58" y2="29" class="h" stroke-width=".7"/>
    <text x="5" y="33" class="s" font-size="4.4">Flag the unbanked feature</text>
    <text x="5" y="38" class="s" font-size="4.4">with most Work left: Work</text>
    <text x="5" y="43" class="s" font-size="4.4">gives 1 less, Plan nothing.</text>
    <rect x="5" y="46" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="50" class="m q" font-size="2.8" letter-spacing="1">WAYS OUT</text>
    <text x="8" y="54.5" class="lb">ADAPT</text><text x="20" y="54.5" class="m" font-size="4">2</text>
    <rect x="5.4" y="60.6" width="52.2" height="7.2" class="cat-cust"/>
    <text x="8" y="59" class="lb">HERO</text><g transform="translate(18.5,57.9)"><use href="#i-legs"/><g transform="translate(0,0.4)"><use href="#q3"/></g></g><text x="23" y="59" class="vl">COMMERCIAL</text>
    <text x="8" y="63.5" class="lb">HABIT</text><text x="20" y="63.5" class="vl adapt">TEAM REFLEXIVITY</text>
    <text x="20" y="67" class="m" font-size="2.6">SO IT COSTS 1 INSTEAD</text>
    <g transform="translate(7,71.9)"><use href="#i-torso"/><use href="#q4"/></g><text x="11" y="73" class="m" font-size="2.7" fill="#B03A2E">QUALITY: LOSE 1 MOTIVATION</text>
    <text x="5" y="84" class="s" font-size="3.2" font-style="italic">An Align or a Demo also clears it.</text>
  </g>

  <g id="feedback">
    <rect x=".6" y=".6" width="61.8" height="28.4" rx="1.4" class="cat-cust"/>
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="9" class="m q" font-size="3.4" letter-spacing="1">CUSTOMER</text>
    <text x="5" y="18" class="m" font-size="5.6" letter-spacing=".8">NEGATIVE</text>
    <text x="5" y="25" class="m" font-size="5.6" letter-spacing=".8">FEEDBACK</text>
    <line x1="5" y1="29" x2="58" y2="29" class="h" stroke-width=".7"/>
    <text x="5" y="33" class="s" font-size="4.4">One banked feature loses</text>
    <text x="5" y="38" class="s" font-size="4.4"><tspan font-weight="bold">2 Work</tspan> and comes off</text>
    <text x="5" y="43" class="s" font-size="4.4">the tower.</text>
    <rect x="5" y="46" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="50" class="m q" font-size="2.8" letter-spacing="1">WAYS OUT</text>
    <text x="8" y="54.5" class="lb">ADAPT</text><text x="20" y="54.5" class="m" font-size="4">3</text>
    <rect x="5.4" y="60.6" width="52.2" height="7.2" class="cat-cust"/>
    <text x="8" y="59" class="lb">HERO</text><g transform="translate(18.5,57.9)"><use href="#i-base"/><use href="#q3"/></g><text x="23" y="59" class="vl">ENTREPRENEURIAL</text>
    <text x="8" y="63.5" class="lb">HABIT</text><text x="20" y="63.5" class="vl adapt">TEAM REFLEXIVITY</text>
    <text x="20" y="67" class="m" font-size="2.6">SO IT COSTS 2 INSTEAD</text>
    <g transform="translate(7,71.9)"><use href="#i-torso"/><use href="#q4"/></g><text x="11" y="73" class="m" font-size="2.7" fill="#B03A2E">QUALITY: LOSE 1 MOTIVATION</text>
    <text x="5" y="84" class="s" font-size="3.2" font-style="italic">A feature that passed a Demo is safe.</text>
  </g>

  <g id="scope">
    <rect x=".6" y=".6" width="61.8" height="22.4" rx="1.4" class="cat-cust"/>
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="9" class="m q" font-size="3.4" letter-spacing="1">CUSTOMER</text>
    <text x="5" y="19" class="m" font-size="5.6" letter-spacing=".8">SCOPE CREEP</text>
    <line x1="5" y1="23" x2="58" y2="23" class="h" stroke-width=".7"/>
    <text x="5" y="28" class="s" font-size="4.4">The unbanked feature</text>
    <text x="5" y="33" class="s" font-size="4.4">closest to done gains</text>
    <text x="5" y="38" class="s" font-size="4.4"><tspan font-weight="bold">+2 Work Cost</tspan>.</text>
    <rect x="5" y="41" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="45" class="m q" font-size="2.8" letter-spacing="1">WAYS OUT</text>
    <text x="8" y="49.5" class="lb">ADAPT</text><text x="20" y="49.5" class="m" font-size="4">2</text>
    <rect x="5.4" y="55.6" width="52.2" height="7.2" class="cat-cust"/>
    <text x="8" y="54" class="lb">HERO</text><g transform="translate(18.5,52.9)"><use href="#i-head"/><use href="#q2"/></g><text x="23" y="54" class="vl">ANALYZE</text>
    <text x="8" y="58.5" class="lb">HABIT</text><text x="20" y="58.5" class="vl adapt">TEAM REFLEXIVITY</text>
    <text x="20" y="62" class="m" font-size="2.6">SO IT COSTS 1 INSTEAD</text>
    <g transform="translate(7,66.9)"><use href="#i-torso"/><use href="#q4"/></g><text x="11" y="68" class="m" font-size="2.7" fill="#B03A2E">QUALITY: LOSE 1 MOTIVATION</text>
    <text x="5" y="79" class="s" font-size="3.2" font-style="italic">Everybody agreed it was a</text>
    <text x="5" y="83.5" class="s" font-size="3.2" font-style="italic">small addition.</text>
  </g>

  <g id="priority">
    <rect x=".6" y=".6" width="61.8" height="28.4" rx="1.4" class="cat-cust"/>
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="9" class="m q" font-size="3.4" letter-spacing="1">CUSTOMER</text>
    <text x="5" y="18" class="m" font-size="5.6" letter-spacing=".8">PRIORITY</text>
    <text x="5" y="25" class="m" font-size="5.6" letter-spacing=".8">CHANGES</text>
    <line x1="5" y1="29" x2="58" y2="29" class="h" stroke-width=".7"/>
    <text x="5" y="33" class="s" font-size="4.4">Remove one card from this</text>
    <text x="5" y="38" class="s" font-size="4.4">week: the day goes on</text>
    <text x="5" y="43" class="s" font-size="4.4">re-agreeing what matters.</text>
    <rect x="5" y="46" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="50" class="m q" font-size="2.8" letter-spacing="1">WAYS OUT</text>
    <text x="8" y="54.5" class="lb">ADAPT</text><text x="20" y="54.5" class="m" font-size="4">1</text>
    <rect x="5.4" y="60.6" width="52.2" height="7.2" class="cat-cust"/>
    <text x="8" y="59" class="lb">HERO</text><g transform="translate(18.5,57.9)"><use href="#i-item"/><use href="#q2"/></g><text x="23" y="59" class="vl">CLIPBOARD</text>
    <text x="8" y="63.5" class="lb">HABIT</text><text x="20" y="63.5" class="vl adapt">TEAM REFLEXIVITY</text>
    <text x="20" y="67" class="m" font-size="2.6">SO IT NEVER HAPPENS</text>
    <g transform="translate(7,71.9)"><use href="#i-torso"/><use href="#q4"/></g><text x="11" y="73" class="m" font-size="2.7" fill="#B03A2E">QUALITY: LOSE 1 MOTIVATION</text>
    <text x="5" y="84" class="s" font-size="3.2" font-style="italic">Last week was the wrong thing.</text>
  </g>

  <g id="hoarding">
    <rect x=".6" y=".6" width="61.8" height="28.4" rx="1.4" class="cat-ppl"/>
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="9" class="m q" font-size="3.4" letter-spacing="1">PEOPLE</text>
    <text x="5" y="18" class="m" font-size="5.6" letter-spacing=".8">KNOWLEDGE</text>
    <text x="5" y="25" class="m" font-size="5.6" letter-spacing=".8">HOARDING</text>
    <line x1="5" y1="29" x2="58" y2="29" class="h" stroke-width=".7"/>
    <text x="5" y="33" class="s" font-size="4.4">Whoever holds the most</text>
    <text x="5" y="38" class="s" font-size="4.4">Knowledge cannot teach or</text>
    <text x="5" y="43" class="s" font-size="4.4">be taught until next week.</text>
    <rect x="5" y="46" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="50" class="m q" font-size="2.8" letter-spacing="1">WAYS OUT</text>
    <text x="8" y="54.5" class="lb">ADAPT</text><text x="20" y="54.5" class="m" font-size="4">3</text>
    <rect x="5.4" y="60.6" width="52.2" height="7.2" class="cat-ppl"/>
    <text x="8" y="59" class="lb">HERO</text><g transform="translate(18.5,57.9)"><use href="#i-item"/><use href="#q4"/></g><text x="23" y="59" class="vl">WRENCH</text>
    <text x="8" y="63.5" class="lb">HABIT</text><text x="20" y="63.5" class="vl trust">PSYCHOLOGICAL SAFETY</text>
    <text x="20" y="67" class="m" font-size="2.6">SO IT COSTS 2 INSTEAD</text>
    <g transform="translate(7,71.9)"><use href="#i-torso"/><use href="#q3"/></g><text x="11" y="73" class="m" font-size="2.7" fill="#B03A2E">COMMUNITY: LOSE 1 MOTIVATION</text>
    <text x="5" y="84" class="s" font-size="3.2" font-style="italic">Nobody wanted to be the one to ask.</text>
  </g>

  <g id="burnout">
    <rect x=".6" y=".6" width="61.8" height="28.4" rx="1.4" class="cat-ppl"/>
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="9" class="m q" font-size="3.4" letter-spacing="1">PEOPLE</text>
    <text x="5" y="18" class="m" font-size="5.6" letter-spacing=".8">BURNOUT</text>
    <text x="5" y="25" class="m" font-size="5.6" letter-spacing=".8">WARNING</text>
    <line x1="5" y1="29" x2="58" y2="29" class="h" stroke-width=".7"/>
    <text x="5" y="33" class="s" font-size="4.4">Anyone on <tspan font-weight="bold">1 Motivation</tspan></text>
    <text x="5" y="38" class="s" font-size="4.4">leaves next week, unless</text>
    <text x="5" y="43" class="s" font-size="4.4">a <tspan font-weight="bold">Celebrate</tspan> is played.</text>
    <rect x="5" y="46" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="50" class="m q" font-size="2.8" letter-spacing="1">WAYS OUT</text>
    <text x="8" y="54.5" class="lb">ADAPT</text><text x="20" y="54.5" class="m" font-size="4">2</text>
    <rect x="5.4" y="60.6" width="52.2" height="7.2" class="cat-ppl"/>
    <text x="8" y="59" class="lb">HERO</text><g transform="translate(18.5,57.9)"><use href="#i-head"/><use href="#q3"/></g><text x="23" y="59" class="vl">SUPPORT</text>
    <text x="8" y="63.5" class="lb">HABIT</text><text x="20" y="63.5" class="vl trust">PSYCHOLOGICAL SAFETY</text>
    <text x="20" y="67" class="m" font-size="2.6">SO IT COSTS 1 INSTEAD</text>
    <g transform="translate(7,71.9)"><use href="#i-torso"/><use href="#q3"/></g><text x="11" y="73" class="m" font-size="2.7" fill="#B03A2E">COMMUNITY: LOSE 1 MOTIVATION</text>
    <text x="5" y="84" class="s" font-size="3.2" font-style="italic">Everyone saw it coming.</text>
  </g>

  <g id="outage">
    <rect x=".6" y=".6" width="61.8" height="28.4" rx="1.4" class="cat-env"/>
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="9" class="m q" font-size="3.4" letter-spacing="1">ENVIRONMENT</text>
    <text x="5" y="18" class="m" font-size="5.6" letter-spacing=".8">EQUIPMENT</text>
    <text x="5" y="25" class="m" font-size="5.6" letter-spacing=".8">OUTAGE</text>
    <line x1="5" y1="29" x2="58" y2="29" class="h" stroke-width=".7"/>
    <text x="5" y="34" class="s" font-size="4.8">Every Work card this</text>
    <text x="5" y="40" class="s" font-size="4.8">week produces <tspan font-weight="bold">1 less</tspan>.</text>
    <rect x="5" y="46" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="50" class="m q" font-size="2.8" letter-spacing="1">WAYS OUT</text>
    <text x="8" y="54.5" class="lb">ADAPT</text><text x="20" y="54.5" class="m" font-size="4">2</text>
    <rect x="5.4" y="60.6" width="52.2" height="7.2" class="cat-env"/>
    <text x="8" y="59" class="lb">HERO</text><g transform="translate(18.5,57.9)"><use href="#i-legs"/><g transform="translate(0,0.4)"><use href="#q1"/></g></g><text x="23" y="59" class="vl">TECHNICAL</text>
    <text x="8" y="63.5" class="lb">HABIT</text><text x="20" y="63.5" class="vl capab">WHO KNOWS WHAT</text>
    <text x="20" y="67" class="m" font-size="2.6">SO IT COSTS 1 INSTEAD</text>
    <g transform="translate(7,71.9)"><use href="#i-torso"/><use href="#q2"/></g><text x="11" y="73" class="m" font-size="2.7" fill="#B03A2E">HIERARCHY: LOSE 1 MOTIVATION</text>
    <text x="5" y="84" class="s" font-size="3.2" font-style="italic">Nobody's fault, and it costs a week.</text>
  </g>
</defs>

<rect width="210" height="297" fill="#FFFFFF"/>
<text x="10" y="8" class="m" font-size="3.6" letter-spacing="1.2">SHEET 6 · EVENT CARDS 1-9 · PRINT AT 100%</text>

<use href="#status" x="10" y="12"/>
<use href="#budget" x="76" y="12"/>
<use href="#unclear" x="142" y="12"/>

