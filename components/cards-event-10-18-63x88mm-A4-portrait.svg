<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<title>Sheet 7 - Event cards 10-18, 63 x 88 mm (A4)</title>
<desc>The second half of the Event deck. Cards 10-16 carry the seven habitus parts sheet 6
does not cover; cards 17 and 18 have no HERO route at all.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .c { fill:none; stroke:#000000; stroke-width:.5; }
  .h { stroke:#000000; stroke-width:.4; fill:none; }
  .w { fill:none; stroke:#000000; stroke-width:.7; }
  .q { fill:#3A3A3A; }
  .lb { font-family:"IBM Plex Mono","Courier New",monospace; font-size:2.9px; fill:#3A3A3A; }
  .vl { font-family:"IBM Plex Mono","Courier New",monospace; font-size:2.9px; fill:#000000; }
  .ic { fill:#E8D4B8; stroke:#000000; stroke-width:.35; }
  .pip { fill:#000000; stroke:none; }
  .trust, .capab, .shpra, .adapt { fill:#000000; }
  /* header tint = the Ledger row that answers this category */
  .cat-ppl  { fill:#F9E3E0; }
  .cat-env  { fill:#DFF0DB; }
  .cat-mgmt { fill:#FAECBE; }
  .cat-cust { fill:#DCE7F2; }
</style>

<defs>
  <g id="i-base"><rect x="-2.1" y="-2.1" width="4.2" height="4.2" rx=".3" class="ic"/></g>
  <g id="i-legs"><polygon points="0,-2.5 2.2,1.4 -2.2,1.4" class="ic"/></g>
  <g id="i-head"><polygon points="2.3,0 1.15,2 -1.15,2 -2.3,0 -1.15,-2 1.15,-2" class="ic"/></g>
  <g id="i-item"><polygon points="0,-2.6 2.6,0 0,2.6 -2.6,0" class="ic"/></g>
  <g id="i-torso"><polygon points="0,-2 1.9,-.62 1.18,1.62 -1.18,1.62 -1.9,-.62" class="ic"/></g>
  <g id="q1"><circle cx="0" cy="0" r=".45" class="pip"/></g>
  <g id="q2"><circle cx="-.95" cy="0" r=".45" class="pip"/><circle cx=".95" cy="0" r=".45" class="pip"/></g>
  <g id="q3"><circle cx="0" cy="-.95" r=".45" class="pip"/><circle cx="-.95" cy=".8" r=".45" class="pip"/><circle cx=".95" cy=".8" r=".45" class="pip"/></g>
  <g id="q4"><circle cx="-.95" cy="-.95" r=".45" class="pip"/><circle cx=".95" cy="-.95" r=".45" class="pip"/><circle cx="-.95" cy=".95" r=".45" class="pip"/><circle cx=".95" cy=".95" r=".45" class="pip"/></g>
  <g id="reinforcements">
    <rect x=".6" y=".6" width="61.8" height="22.4" rx="1.4" class="cat-ppl"/>
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="9" class="m q" font-size="3.4" letter-spacing="1">PEOPLE</text>
    <text x="5" y="19" class="m" font-size="5.6" letter-spacing=".8">MORE HANDS</text>
    <line x1="5" y1="23" x2="58" y2="23" class="h" stroke-width=".7"/>
    <text x="5" y="28" class="s" font-size="4.4">The feature with the most</text>
    <text x="5" y="33" class="s" font-size="4.4">Work played on it this week:</text>
    <text x="5" y="38" class="s" font-size="4.4">halve that Work <tspan font-weight="bold">(round down)</tspan>.</text>
    <rect x="5" y="41" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="45" class="m q" font-size="2.8" letter-spacing="1">WAYS OUT</text>
    <text x="8" y="49.5" class="lb">ADAPT</text><text x="20" y="49.5" class="m" font-size="4">2</text>
    <rect x="5.4" y="55.6" width="52.2" height="7.2" class="cat-ppl"/>
    <text x="8" y="54" class="lb">HERO</text><g transform="translate(18.5,52.9)"><use href="#i-legs"/><g transform="translate(0,0.4)"><use href="#q4"/></g></g><text x="23" y="54" class="vl">ANALYTICAL</text>
    <text x="8" y="58.5" class="lb">HABIT</text><text x="20" y="58.5" class="vl shpra">SHARED REPERTOIRE</text>
    <text x="20" y="62" class="m" font-size="2.6">SO IT COSTS 1 INSTEAD</text>
    <text x="5" y="79" class="s" font-size="3.2" font-style="italic">More hands didn't mean more progress -</text>
    <text x="5" y="83.5" class="s" font-size="3.2" font-style="italic">just more explaining. BROOKS 1975</text>
  </g>

  <g id="legacy">
    <rect x=".6" y=".6" width="61.8" height="28.4" rx="1.4" class="cat-env"/>
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="9" class="m q" font-size="3.4" letter-spacing="1">ENVIRONMENT</text>
    <text x="5" y="18" class="m" font-size="5.6" letter-spacing=".8">OLD</text>
    <text x="5" y="25" class="m" font-size="5.6" letter-spacing=".8">FOUNDATIONS</text>
    <line x1="5" y1="29" x2="58" y2="29" class="h" stroke-width=".7"/>
    <text x="5" y="33" class="s" font-size="4.4">The feature with the most</text>
    <text x="5" y="38" class="s" font-size="4.4">Work already banked into</text>
    <text x="5" y="43" class="s" font-size="4.4">it gains <tspan font-weight="bold">+2 Work Cost</tspan>.</text>
    <rect x="5" y="46" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="50" class="m q" font-size="2.8" letter-spacing="1">WAYS OUT</text>
    <text x="8" y="54.5" class="lb">ADAPT</text><text x="20" y="54.5" class="m" font-size="4">3</text>
    <rect x="5.4" y="60.6" width="52.2" height="7.2" class="cat-env"/>
    <text x="8" y="59" class="lb">HERO</text><g transform="translate(18.5,57.9)"><use href="#i-base"/><use href="#q1"/></g><text x="23" y="59" class="vl">ACADEMIC</text>
    <text x="8" y="63.5" class="lb">HABIT</text><text x="20" y="63.5" class="vl capab">WHO KNOWS WHAT</text>
    <text x="20" y="67" class="m" font-size="2.6">SO IT COSTS 2 INSTEAD</text>
    <g transform="translate(7,71.9)"><use href="#i-torso"/><use href="#q2"/></g><text x="11" y="73" class="m" font-size="2.7" fill="#B03A2E">HIERARCHY: LOSE 1 MOTIVATION</text>
    <text x="5" y="84" class="s" font-size="3.2" font-style="italic">Somebody built this years ago, and never wrote down why.</text>
  </g>

  <g id="build">
    <rect x=".6" y=".6" width="61.8" height="28.4" rx="1.4" class="cat-env"/>
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="9" class="m q" font-size="3.4" letter-spacing="1">ENVIRONMENT</text>
    <text x="5" y="18" class="m" font-size="5.6" letter-spacing=".8">FALSE</text>
    <text x="5" y="25" class="m" font-size="5.6" letter-spacing=".8">START</text>
    <line x1="5" y1="29" x2="58" y2="29" class="h" stroke-width=".7"/>
    <text x="5" y="33" class="s" font-size="4.4">The first Work card this</text>
    <text x="5" y="38" class="s" font-size="4.4">week produces <tspan font-weight="bold">nothing</tspan>.</text>
    <text x="5" y="43" class="s" font-size="4.4">The day starts over instead.</text>
    <rect x="5" y="46" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="50" class="m q" font-size="2.8" letter-spacing="1">WAYS OUT</text>
    <text x="8" y="54.5" class="lb">ADAPT</text><text x="20" y="54.5" class="m" font-size="4">1</text>
    <rect x="5.4" y="60.6" width="52.2" height="7.2" class="cat-env"/>
    <text x="8" y="59" class="lb">HERO</text><g transform="translate(18.5,57.9)"><use href="#i-base"/><use href="#q2"/></g><text x="23" y="59" class="vl">TRADE</text>
    <text x="8" y="63.5" class="lb">HABIT</text><text x="20" y="63.5" class="vl capab">WHO KNOWS WHAT</text>
    <text x="20" y="67" class="m" font-size="2.6">SO IT NEVER HAPPENS</text>
    <g transform="translate(7,71.9)"><use href="#i-torso"/><use href="#q2"/></g><text x="11" y="73" class="m" font-size="2.7" fill="#B03A2E">HIERARCHY: LOSE 1 MOTIVATION</text>
    <text x="5" y="84" class="s" font-size="3.2" font-style="italic">It worked yesterday.</text>
  </g>

  <g id="split">
    <rect x=".6" y=".6" width="61.8" height="28.4" rx="1.4" class="cat-ppl"/>
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="9" class="m q" font-size="3.4" letter-spacing="1">PEOPLE</text>
    <text x="5" y="18" class="m" font-size="5.6" letter-spacing=".8">THE TEAM</text>
    <text x="5" y="25" class="m" font-size="5.6" letter-spacing=".8">SPLITS</text>
    <line x1="5" y1="29" x2="58" y2="29" class="h" stroke-width=".7"/>
    <text x="5" y="33" class="s" font-size="4.4">Two characters may not</text>
    <text x="5" y="38" class="s" font-size="4.4">take the same feature this</text>
    <text x="5" y="43" class="s" font-size="4.4">week. <tspan font-weight="bold" class="trust">Lose 1 Trust</tspan>.</text>
    <rect x="5" y="46" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="50" class="m q" font-size="2.8" letter-spacing="1">WAYS OUT</text>
    <text x="8" y="54.5" class="lb">ADAPT</text><text x="20" y="54.5" class="m" font-size="4">2</text>
    <rect x="5.4" y="60.6" width="52.2" height="7.2" class="cat-ppl"/>
    <text x="8" y="59" class="lb">HERO</text><g transform="translate(18.5,57.9)"><use href="#i-legs"/><g transform="translate(0,0.4)"><use href="#q2"/></g></g><text x="23" y="59" class="vl">SOCIAL</text>
    <text x="8" y="63.5" class="lb">HABIT</text><text x="20" y="63.5" class="vl trust">PSYCHOLOGICAL SAFETY</text>
    <text x="20" y="67" class="m" font-size="2.6">SO IT COSTS 1 INSTEAD</text>
    <g transform="translate(7,71.9)"><use href="#i-torso"/><use href="#q3"/></g><text x="11" y="73" class="m" font-size="2.7" fill="#B03A2E">COMMUNITY: LOSE 1 MOTIVATION</text>
    <text x="5" y="84" class="s" font-size="3.2" font-style="italic">Nobody said anything out loud.</text>
  </g>

  <g id="reorg">
    <rect x=".6" y=".6" width="61.8" height="22.4" rx="1.4" class="cat-mgmt"/>
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="9" class="m q" font-size="3.4" letter-spacing="1">MANAGEMENT</text>
    <text x="5" y="19" class="m" font-size="5.6" letter-spacing=".8">REORGANISED</text>
    <line x1="5" y1="23" x2="58" y2="23" class="h" stroke-width=".7"/>
    <text x="5" y="28" class="s" font-size="4.2">Everyone <tspan font-weight="bold">loses 1 Motivation</tspan>.</text>
    <text x="5" y="33" class="s" font-size="4.4">Standing is re-read now,</text>
    <text x="5" y="38" class="s" font-size="4.4">and <tspan font-weight="bold" class="shpra">lose 1 Shared Practice</tspan>.</text>
    <rect x="5" y="41" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="45" class="m q" font-size="2.8" letter-spacing="1">WAYS OUT</text>
    <text x="8" y="49.5" class="lb">ADAPT</text><text x="20" y="49.5" class="m" font-size="4">3</text>
    <rect x="5.4" y="55.6" width="52.2" height="7.2" class="cat-mgmt"/>
    <text x="8" y="54" class="lb">HERO</text><g transform="translate(18.5,52.9)"><use href="#i-head"/><use href="#q4"/></g><text x="23" y="54" class="vl">WITHDRAW</text>
    <text x="8" y="58.5" class="lb">HABIT</text><text x="20" y="58.5" class="vl shpra">SHARED REPERTOIRE</text>
    <text x="20" y="62" class="m" font-size="2.6">SO IT COSTS 2 INSTEAD</text>
    <g transform="translate(7,66.9)"><use href="#i-torso"/><use href="#q1"/></g><text x="11" y="68" class="m" font-size="2.7" fill="#B03A2E">AUTONOMY: LOSE 1 MOTIVATION</text>
    <g transform="translate(7,71.4)"><use href="#i-torso"/><use href="#q2"/></g><text x="11" y="72.5" class="m q" font-size="2.7">HIERARCHY: NO LOSS</text>
    <text x="5" y="79" class="s" font-size="3.2" font-style="italic">The work did not change.</text>
    <text x="5" y="83.5" class="s" font-size="3.2" font-style="italic">Only the chart did.</text>
  </g>

  <g id="crunch">
    <rect x=".6" y=".6" width="61.8" height="28.4" rx="1.4" class="cat-env"/>
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="9" class="m q" font-size="3.4" letter-spacing="1">ENVIRONMENT</text>
    <text x="5" y="18" class="m" font-size="5.6" letter-spacing=".8">EVERYTHING</text>
    <text x="5" y="25" class="m" font-size="5.6" letter-spacing=".8">AT ONCE</text>
    <line x1="5" y1="29" x2="58" y2="29" class="h" stroke-width=".7"/>
    <text x="5" y="33" class="s" font-size="4.4">No feature may take more</text>
    <text x="5" y="38" class="s" font-size="4.4">than <tspan font-weight="bold">1 Work</tspan> this week.</text>
    <text x="5" y="43" class="s" font-size="4.4">Spread thin, on purpose.</text>
    <rect x="5" y="46" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="50" class="m q" font-size="2.8" letter-spacing="1">WAYS OUT</text>
    <text x="8" y="54.5" class="lb">ADAPT</text><text x="20" y="54.5" class="m" font-size="4">2</text>
    <rect x="5.4" y="60.6" width="52.2" height="7.2" class="cat-env"/>
    <text x="8" y="59" class="lb">HERO</text><g transform="translate(18.5,57.9)"><use href="#i-item"/><use href="#q1"/></g><text x="23" y="59" class="vl">LAPTOP</text>
    <text x="8" y="63.5" class="lb">HABIT</text><text x="20" y="63.5" class="vl capab">WHO KNOWS WHAT</text>
    <text x="20" y="67" class="m" font-size="2.6">SO IT COSTS 1 INSTEAD</text>
    <g transform="translate(7,71.9)"><use href="#i-torso"/><use href="#q2"/></g><text x="11" y="73" class="m" font-size="2.7" fill="#B03A2E">HIERARCHY: LOSE 1 MOTIVATION</text>
    <text x="5" y="84" class="s" font-size="3.2" font-style="italic">All of it is the top priority.</text>
  </g>

  <g id="morale">
    <rect x=".6" y=".6" width="61.8" height="28.4" rx="1.4" class="cat-ppl"/>
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="9" class="m q" font-size="3.4" letter-spacing="1">PEOPLE</text>
    <text x="5" y="18" class="m" font-size="5.6" letter-spacing=".8">A FLAT</text>
    <text x="5" y="25" class="m" font-size="5.6" letter-spacing=".8">WEEK</text>
    <line x1="5" y1="29" x2="58" y2="29" class="h" stroke-width=".7"/>
    <text x="5" y="33" class="s" font-size="4.2">Everyone <tspan font-weight="bold">loses 1 Motivation</tspan>.</text>
    <text x="5" y="38" class="s" font-size="4.4">A <tspan font-weight="bold">Celebrate</tspan> this week</text>
    <text x="5" y="43" class="s" font-size="4.4">gives no bonus, only +2.</text>
    <rect x="5" y="46" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="50" class="m q" font-size="2.8" letter-spacing="1">WAYS OUT</text>
    <text x="8" y="54.5" class="lb">ADAPT</text><text x="20" y="54.5" class="m" font-size="4">1</text>
    <rect x="5.4" y="60.6" width="52.2" height="7.2" class="cat-ppl"/>
    <text x="8" y="59" class="lb">HERO</text><g transform="translate(18.5,57.9)"><use href="#i-item"/><use href="#q3"/></g><text x="23" y="59" class="vl">COFFEE CUP</text>
    <text x="8" y="63.5" class="lb">HABIT</text><text x="20" y="63.5" class="vl trust">PSYCHOLOGICAL SAFETY</text>
    <text x="20" y="67" class="m" font-size="2.6">SO IT NEVER HAPPENS</text>
    <g transform="translate(7,71.9)"><use href="#i-torso"/><use href="#q3"/></g><text x="11" y="73" class="m" font-size="2.7" fill="#B03A2E">COMMUNITY: LOSE 1 MOTIVATION</text>
    <g transform="translate(7,76.4)"><use href="#i-torso"/><use href="#q4"/></g><text x="11" y="77.5" class="m q" font-size="2.7">QUALITY: NO LOSS</text>
    <text x="5" y="84" class="s" font-size="3.2" font-style="italic">Nothing happened. That is it.</text>
  </g>

  <g id="audit">
    <rect x=".6" y=".6" width="61.8" height="22.4" rx="1.4" class="cat-mgmt"/>
    <rect width="63" height="88" rx="2" class="c" stroke-width=".9"/>
    <text x="5" y="9" class="m q" font-size="3.4" letter-spacing="1">MANAGEMENT</text>
    <text x="5" y="19" class="m" font-size="5.6" letter-spacing=".8">THE AUDIT</text>
    <line x1="5" y1="23" x2="58" y2="23" class="h" stroke-width=".7"/>
    <text x="5" y="28" class="s" font-size="4.4">One card this week must</text>
    <text x="5" y="33" class="s" font-size="4.4">be a <tspan font-weight="bold">Record Meeting</tspan>. If</text>
    <text x="5" y="38" class="s" font-size="4.4">none is, lose a card and</text>
    <text x="5" y="43" class="s" font-size="4.4">lose <tspan font-weight="bold" class="trust">1 Trust</tspan>.</text>
    <rect x="5" y="46" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="50" class="m q" font-size="2.8" letter-spacing="1">WAYS OUT</text>
    <text x="8" y="54.5" class="lb">ADAPT</text><text x="20" y="54.5" class="m" font-size="4">2</text>
    <text x="8" y="59" class="lb">HERO</text><text x="23" y="59" class="vl" fill="#B03A2E">NOBODY</text>
    <rect x="5.4" y="60.6" width="52.2" height="7.2" class="cat-mgmt"/>
    <text x="8" y="63.5" class="lb">HABIT</text><text x="20" y="63.5" class="vl shpra">SHARED REPERTOIRE</text>
    <text x="20" y="67" class="m" font-size="2.6">SO IT COSTS 1 INSTEAD</text>
    <g transform="translate(7,71.9)"><use href="#i-torso"/><use href="#q1"/></g><text x="11" y="73" class="m" font-size="2.7" fill="#B03A2E">AUTONOMY: LOSE 1 MOTIVATION</text>
    <text x="5" y="84" class="s" font-size="3.2" font-style="italic">No one person can be the answer.</text>
  </g>

  <g id="deadline">
    <rect x=".6" y=".6" width="61.8" height="28.4" rx="1.4" class="cat-cust"/>
    <rect width="63" height="88" rx="2" class="c" stroke-width=".9"/>
    <text x="5" y="9" class="m q" font-size="3.4" letter-spacing="1">CUSTOMER</text>
    <text x="5" y="18" class="m" font-size="5.6" letter-spacing=".8">THE DATE</text>
    <text x="5" y="25" class="m" font-size="5.6" letter-spacing=".8">MOVES UP</text>
    <line x1="5" y1="29" x2="58" y2="29" class="h" stroke-width=".7"/>
    <text x="5" y="33" class="s" font-size="4.4">Every unbanked feature</text>
    <text x="5" y="38" class="s" font-size="4.4">becomes <tspan font-weight="bold">Unclear</tspan>. Work on it</text>
    <text x="5" y="43" class="s" font-size="4.4">gives 1 less until cleared.</text>
    <rect x="5" y="46" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="50" class="m q" font-size="2.8" letter-spacing="1">WAYS OUT</text>
    <text x="8" y="54.5" class="lb">ADAPT</text><text x="20" y="54.5" class="m" font-size="4">3</text>
    <text x="8" y="59" class="lb">HERO</text><text x="23" y="59" class="vl" fill="#B03A2E">NOBODY</text>
    <rect x="5.4" y="60.6" width="52.2" height="7.2" class="cat-cust"/>
    <text x="8" y="63.5" class="lb">HABIT</text><text x="20" y="63.5" class="vl adapt">TEAM REFLEXIVITY</text>
    <text x="20" y="67" class="m" font-size="2.6">SO IT COSTS 2 INSTEAD</text>
    <g transform="translate(7,71.9)"><use href="#i-torso"/><use href="#q4"/></g><text x="11" y="73" class="m" font-size="2.7" fill="#B03A2E">QUALITY: LOSE 1 MOTIVATION</text>
    <text x="5" y="84" class="s" font-size="3.2" font-style="italic">This one is not about any of you.</text>
  </g>
</defs>

<rect width="210" height="297" fill="#FFFFFF"/>
<text x="10" y="8" class="m" font-size="3.6" letter-spacing="1.2">SHEET 7 · EVENT CARDS 10-18 · PRINT AT 100%</text>

<use href="#reinforcements" x="10" y="12"/>
<use href="#legacy" x="76" y="12"/>
<use href="#build" x="142" y="12"/>

<use href="#split" x="10" y="104"/>
<use href="#reorg" x="76" y="104"/>
<use href="#crunch" x="142" y="104"/>

<use href="#morale" x="10" y="196"/>
