    <text x="5" y="7.5" class="m q" font-size="3.2" letter-spacing="1">CUSTOMER</text>
    <text x="5" y="19" class="m" font-size="4.6" letter-spacing=".6">ALWAYS REACTING</text>
    <line x1="5" y1="23" x2="58" y2="23" class="h" stroke-width=".7"/>
    <text x="5" y="28" class="s" font-size="4.2">There was a plan.</text>
    <text x="5" y="32.8" class="s" font-size="4.2">Nobody remembers it now.</text>
    <g transform="translate(0,9.5)">
    <text x="5" y="28" class="s" font-size="4.4">The team stops planning</text>
    <text x="5" y="33" class="s" font-size="4.4">ahead and only reacts.</text>
    <text x="5" y="38" class="s" font-size="4.4">Deadlines slip sideways.</text>
    <text x="5" y="43" class="s" font-size="4.4"><tspan font-weight="bold">Adaptability pool loses 1</tspan>.</text>
    <g transform="translate(7,46.9)"><use href="#i-torso"/><use href="#q4"/></g><rect x="34.44" y="45.57" width="20.09" height="3.11" rx=".5" fill="#D3B1B1"/><text x="11" y="48" class="m" font-size="2.7">QUALITY: LOSE 1 MOTIVATION</text>
    <rect x="5" y="54" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="58" class="m q" font-size="2.8" letter-spacing="1">HOW TO ADAPT</text>
    <text x="8" y="62.5" class="m" font-size="4">1</text><text x="14" y="62.5" class="m q" font-size="2" letter-spacing=".2">ADAPTABILITY</text>
    <text x="8" y="64.75" class="s q" font-size="2.6" font-style="italic">or</text>
    <rect x="5.4" y="68.6" width="52.2" height="7.2" class="cat-cust"/>
    <text x="8" y="67" class="lb">HERO</text><g transform="translate(18.5,65.9)"><use href="#i-head"/><use href="#q5"/></g><text x="23" y="67" class="vl">CHALLENGE</text>
    <text x="8" y="71.5" class="lb">HABIT</text><text x="20" y="71.5" class="vl adapt">TEAM REFLEXIVITY</text>
    <text x="20" y="75" class="m" font-size="2.6">SO IT IS FREE</text>
    <use href="#cost1"/>
    </g>
  </g>
  <g id="equal" transform="scale(.95238095,1)">
    <rect x=".6" y=".6" width="61.8" height="22.4" rx="1.4" class="cat-mgmt"/>
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="7.5" class="m q" font-size="3.2" letter-spacing="1">MANAGEMENT</text>
    <text x="5" y="13.5" class="m" font-size="4.6" letter-spacing=".6">EVERYONE IS</text>
    <text x="5" y="19" class="m" font-size="4.6" letter-spacing=".6">EQUAL</text>
    <line x1="5" y1="23" x2="58" y2="23" class="h" stroke-width=".7"/>
    <text x="5" y="28" class="s" font-size="4.2">No titles. No one to ask,</text>
    <text x="5" y="32.8" class="s" font-size="4.2">so nobody does.</text>
    <g transform="translate(0,9.5)">
    <text x="5" y="28" class="s" font-size="4.4">No Hero and no Authorized</text>
    <text x="5" y="33" class="s" font-size="4.4">Voice this week, and nobody</text>
    <text x="5" y="38" class="s" font-size="4.4">gains <tspan font-weight="bold">Capital</tspan>.</text>
    <rect x="4" y="38" width="50" height="6" rx="1" fill="#D3B1B1"/>
    <text x="5" y="43" class="s" font-size="4.2">Everyone <tspan font-weight="bold">loses 1 Motivation</tspan>.</text>
    <g transform="translate(7,46.9)"><use href="#i-torso"/><use href="#q1"/></g><rect x="36.11" y="45.57" width="11.72" height="3.11" rx=".5" fill="#D3B1B1"/><text x="11" y="48" class="m" font-size="2.7">AUTONOMY: LOSE 1 EXTRA</text>
    <g transform="translate(7,51.4)"><use href="#i-torso"/><use href="#q2"/></g><text x="11" y="52.5" class="m q" font-size="2.7">HIERARCHY: IMMUNE</text>
    <rect x="5" y="54" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="58" class="m q" font-size="2.8" letter-spacing="1">HOW TO ADAPT</text>
    <text x="8" y="62.5" class="m" font-size="4">2</text><text x="14" y="62.5" class="m q" font-size="2" letter-spacing=".2">ADAPTABILITY</text>
    <text x="8" y="66" class="s q" font-size="2.6" font-style="italic">No hero can save this.</text>
    <rect x="5.4" y="68.6" width="52.2" height="7.2" class="cat-mgmt"/>
    <text x="8" y="71.5" class="lb">HABIT</text><text x="20" y="71.5" class="vl shpra">SHARED REPERTOIRE</text>
    <text x="20" y="75" class="m" font-size="2.6">SO IT COSTS 1 INSTEAD</text>
    <use href="#cost2"/>
    </g>
  </g>

  <g id="wolf" transform="scale(.95238095,1)">
    <rect x=".6" y=".6" width="61.8" height="22.4" rx="1.4" class="cat-mgmt"/>
    <rect width="63" height="88" rx="2" class="c" stroke-width=".9"/>
    <text x="5" y="7.5" class="m q" font-size="3.2" letter-spacing="1">MANAGEMENT</text>
    <text x="5" y="19" class="m" font-size="4.6" letter-spacing=".6">THE WOLF</text>
    <line x1="5" y1="23" x2="58" y2="23" class="h" stroke-width=".7"/>
    <g transform="translate(0,9.5)">
    <rect x="4" y="18.5" width="50" height="6" rx="1" fill="#D9D3C4"/>
    <text x="6" y="22.7" class="m" font-size="3.4" font-weight="bold">TARGET: THE SHEPHERD</text>
    <g transform="translate(50.2,21.5)" fill="none" stroke="#2A2620" stroke-width=".4"><circle r="2.4"/><circle r="1.4"/><circle r=".35" fill="#2A2620"/></g>
    <text x="5" y="28.6" class="s" font-size="4">The Wolf is <tspan font-weight="bold">the boss</tspan>, the</text>
    <text x="5" y="33" class="s" font-size="4"><tspan font-weight="bold">manager</tspan>. It targets the one</text>
    <text x="5" y="37.4" class="s" font-size="4">with the most <tspan font-weight="bold">Capital</tspan>. They</text>
    <text x="5" y="41.8" class="s" font-size="4"><tspan font-weight="bold">stay on the team</tspan>; their</text>
    <text x="5" y="46.2" class="s" font-size="4">Capital is <tspan font-weight="bold">erased</tspan>. Tokens</text>
    <text x="5" y="50.6" class="s" font-size="4">and Hero can't stop it.</text>
    <rect x="5" y="54" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="58" class="m q" font-size="2.8" letter-spacing="1">HOW TO RESIST</text>
    <text x="8" y="62.5" class="m" font-size="4">STEP UP</text><text x="27" y="62.5" class="m q" font-size="2" letter-spacing=".2">+1 CAPITAL</text>
    <text x="8" y="64.75" class="s q" font-size="2.6" font-style="italic">the team shields the shepherd</text>
    <rect x="5.4" y="68.6" width="52.2" height="7.2" class="cat-mgmt"/>
    <text x="8" y="67" class="lb">COST</text><text x="18" y="67" class="vl">ALL LOSE 1 MOTIVATION</text>
    <text x="8" y="71.5" class="lb">IF NOT</text><text x="20" y="71.5" class="vl">THEIR CAPITAL → 0</text>
    <text x="20" y="75" class="m" font-size="2.6">NO ADAPT. NO HERO.</text>
    </g>
  </g>
  <!-- Adaptability cost: one rounded square per adapt token, same shape as the pool wells on board 2 -->
  <g id="cost1" fill="none" stroke="#2A2620" stroke-width=".6"><rect x="34" y="59" width="4.8" height="4.8" rx=".8"/></g>
  <g id="cost2" fill="none" stroke="#2A2620" stroke-width=".6"><rect x="34" y="59" width="4.8" height="4.8" rx=".8"/><rect x="40" y="59" width="4.8" height="4.8" rx=".8"/></g>
  <g id="cost3" fill="none" stroke="#2A2620" stroke-width=".6"><rect x="34" y="59" width="4.8" height="4.8" rx=".8"/><rect x="40" y="59" width="4.8" height="4.8" rx=".8"/><rect x="46" y="59" width="4.8" height="4.8" rx=".8"/></g>
</defs>

