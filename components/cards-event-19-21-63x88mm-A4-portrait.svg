  </g>

  <g id="confidence" transform="scale(.95238095,1)">
    <rect x=".6" y=".6" width="61.8" height="22.4" rx="1.4" class="cat-env"/>
    <rect width="63" height="88" rx="2" class="c"/>
    <text x="5" y="7.5" class="m q" font-size="3.2" letter-spacing="1">ENVIRONMENT</text>
    <text x="5" y="19" class="m" font-size="4.6" letter-spacing=".6">SHAKY GROUND</text>
