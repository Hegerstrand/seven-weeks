    <text x="5" y="33" class="s" font-size="4.4">of the customer. The team</text>
    <text x="5" y="38" class="s" font-size="4.4"><tspan font-weight="bold">loses 1 Capability</tspan>.</text>
    <g transform="translate(7,41.9)"><use href="#i-torso"/><use href="#q2"/></g><rect x="43.64" y="40.57" width="20.09" height="3.11" rx=".5" fill="#D3B1B1"/><text x="11" y="43" class="m" font-size="2.7">HIERARCHY: LOSE 1 MOTIVATION</text>
    <rect x="5" y="54" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="58" class="m q" font-size="2.8" letter-spacing="1">HOW TO ADAPT</text>
    <text x="8" y="62.5" class="m" font-size="4">3</text><text x="14" y="62.5" class="m q" font-size="2" letter-spacing=".2">ADAPTABILITY</text>
    <text x="8" y="64.75" class="s q" font-size="2.6" font-style="italic">or</text>
    <rect x="5.4" y="68.6" width="52.2" height="7.2" class="cat-env"/>
    <text x="8" y="67" class="lb">HERO</text><g transform="translate(18.5,65.9)"><use href="#i-head"/><use href="#q4"/></g><text x="23" y="67" class="vl">ENGAGE</text>
    <text x="8" y="71.5" class="lb">HABIT</text><text x="20" y="71.5" class="vl capab">WHO KNOWS WHAT</text>
    <text x="20" y="75" class="m" font-size="2.6">SO IT COSTS 2 INSTEAD</text>
    <use href="#cost3"/>
    </g>
  </g>

  <g id="reacting" transform="scale(.95238095,1)">
    <rect x=".6" y=".6" width="61.8" height="22.4" rx="1.4" class="cat-cust"/>
