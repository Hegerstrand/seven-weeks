    <text x="5" y="43" class="s" font-size="4.4">They wrote it. Exempt.</text>
    <rect x="5" y="54" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="58" class="m q" font-size="2.8" letter-spacing="1">HOW TO ADAPT</text>
    <text x="8" y="62.5" class="m" font-size="4">1</text><text x="14" y="62.5" class="m q" font-size="2" letter-spacing=".2">ADAPTABILITY</text>
    <text x="8" y="64.75" class="s q" font-size="2.6" font-style="italic">or</text>
    <rect x="5.4" y="68.6" width="52.2" height="7.2" class="cat-mgmt"/>
    <text x="8" y="67" class="lb">HERO</text><g transform="translate(18.5,65.9)"><use href="#i-head"/><use href="#q5"/></g><text x="23" y="67" class="vl">CHALLENGE</text>
    <text x="8" y="71.5" class="lb">HABIT</text><text x="20" y="71.5" class="vl shpra">SHARED REPERTOIRE</text>
    <text x="20" y="75" class="m" font-size="2.6">SO IT IS FREE</text>
    <use href="#cost1"/>
    </g>
  </g>

  <g id="dashboard" transform="scale(.95238095,1)">
    <rect x=".6" y=".6" width="61.8" height="22.4" rx="1.4" class="cat-cust"/>
    <rect width="63" height="88" rx="2" class="c"/>
