    <text x="5" y="19" class="m" font-size="4.6" letter-spacing=".6">THE DASHBOARD</text>
    <line x1="5" y1="23" x2="58" y2="23" class="h" stroke-width=".7"/>
    <text x="5" y="28" class="s" font-size="4.2">The number went up.</text>
    <text x="5" y="32.8" class="s" font-size="4.2">Nothing else did.</text>
    <g transform="translate(0,9.5)">
    <text x="5" y="28" class="s" font-size="4.4">Work only counts this week</text>
    <text x="5" y="33" class="s" font-size="4.4">if it's on a Low feature.</text>
    <text x="5" y="38" class="s" font-size="4.4">Medium/High Work happens</text>
    <text x="5" y="43" class="s" font-size="4.4">but changes nothing.</text>
    <g transform="translate(7,46.9)"><use href="#i-torso"/><use href="#q4"/></g><rect x="34.44" y="45.57" width="20.09" height="3.11" rx=".5" fill="#D3B1B1"/><text x="11" y="48" class="m" font-size="2.7">QUALITY: LOSE 1 MOTIVATION</text>
    <rect x="5" y="54" width="53" height="22" rx="1" class="w"/>
    <text x="8" y="58" class="m q" font-size="2.8" letter-spacing="1">HOW TO ADAPT</text>
    <text x="8" y="62.5" class="m" font-size="4">3</text><text x="14" y="62.5" class="m q" font-size="2" letter-spacing=".2">ADAPTABILITY</text>
    <text x="8" y="64.75" class="s q" font-size="2.6" font-style="italic">or</text>
    <rect x="5.4" y="68.6" width="52.2" height="7.2" class="cat-cust"/>
    <text x="8" y="67" class="lb">HERO</text><g transform="translate(18.5,65.9)"><use href="#i-head"/><use href="#q2"/></g><text x="23" y="67" class="vl">ANALYZE</text>
    <text x="8" y="71.5" class="lb">HABIT</text><text x="20" y="71.5" class="vl adapt">TEAM REFLEXIVITY</text>
    <text x="20" y="75" class="m" font-size="2.6">SO IT COSTS 2 INSTEAD</text>
    <use href="#cost3"/>
