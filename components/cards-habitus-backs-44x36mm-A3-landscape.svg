<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>Habitus card backs - 35 backs, 5 across x 7 down, true 44 x 36 mm (A3 landscape)</title>
<desc>The backs of every habitus card, 5 across and 7 down: 25 part-cards (five rows of five) and
the 10 NEED and HERO tiles (two more rows). Seven rows of 36 mm do not fit an A4 page, so this
sheet is A3 landscape, like board 1; it prints at 100%. Each row is one deck and carries that
deck's shape from the person board, without the pips: upbringing (square), instinct (triangle),
values (pentagon), education (hexagon), skill (diamond), then NEED (red pentagon, the values
shape) and HERO (red triangle, the instinct shape). Cards sit on a 50 x 40 mm pitch, the same 50 mm
column pitch as the part-card sheets, so a back can be glued behind its front. Parts are named by
what they are, never by body part.</desc>

<style>
  .m   { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .cut { fill:#F0E3D1; stroke:#2A2620; stroke-width:.4; }
  .sh  { fill:#F2EDE0; stroke:#2A2620; stroke-width:.6; stroke-linejoin:round; }
  .shr { fill:#905151; stroke:#2A2620; stroke-width:.6; stroke-linejoin:round; }
  .rule { stroke:#2A2620; stroke-width:.3; fill:none; }
</style>

<defs>
  <!-- one back = 44 x 36 card, symbol centred at (22,15.5), small caption at y=32.5 -->
  <g id="back-upbringing"><rect width="44" height="36" rx="1.5" class="cut"/>
    <rect x="13.6" y="7.1" width="16.8" height="16.8" rx="1.4" class="sh"/>
    <text x="22" y="32.5" class="m" font-size="3" letter-spacing=".8" text-anchor="middle">UPBRINGING</text></g>
  <g id="back-instinct"><rect width="44" height="36" rx="1.5" class="cut"/>
    <polygon points="22,5.3 31.1,21.45 12.9,21.45" class="sh"/>
    <text x="22" y="32.5" class="m" font-size="3" letter-spacing=".8" text-anchor="middle">INSTINCT</text></g>
  <g id="back-values"><rect width="44" height="36" rx="1.5" class="cut"/>
    <polygon points="22,6.4 30.65,12.7 27.35,22.85 16.65,22.85 13.35,12.7" class="sh"/>
    <text x="22" y="32.5" class="m" font-size="3" letter-spacing=".8" text-anchor="middle">VALUES</text></g>
  <g id="back-education"><rect width="44" height="36" rx="1.5" class="cut"/>
    <polygon points="31.1,15.5 26.55,23.4 17.45,23.4 12.9,15.5 17.45,7.6 26.55,7.6" class="sh"/>
    <text x="22" y="32.5" class="m" font-size="3" letter-spacing=".8" text-anchor="middle">EDUCATION</text></g>
  <g id="back-skill"><rect width="44" height="36" rx="1.5" class="cut"/>
    <polygon points="22,3.5 34,15.5 22,27.5 10,15.5" class="sh"/>
    <text x="22" y="33.2" class="m" font-size="3" letter-spacing=".8" text-anchor="middle">SKILL</text></g>
  <g id="back-need"><rect width="44" height="36" rx="1.5" class="cut"/>
    <polygon points="22,6.4 30.65,12.7 27.35,22.85 16.65,22.85 13.35,12.7" class="shr"/>
    <text x="22" y="32.5" class="m" font-size="3" letter-spacing=".8" text-anchor="middle">NEED</text></g>
  <g id="back-hero"><rect width="44" height="36" rx="1.5" class="cut"/>
    <polygon points="22,5.3 31.1,21.45 12.9,21.45" class="shr"/>
    <text x="22" y="32.5" class="m" font-size="3" letter-spacing=".8" text-anchor="middle">HERO</text></g>
</defs>

<rect width="420" height="297" fill="#FFFFFF"/>
<text x="88" y="8" class="m" font-size="3.2" letter-spacing=".8">HABITUS CARD BACKS · 35 BACKS, 5 ACROSS x 7 DOWN · PRINT AT 100% ON A3 · CUT ALONG THE GAPS</text>
<line x1="88" y1="11" x2="332" y2="11" class="rule"/>

<!-- grid origin (88,14), pitch 50 x 40 -->
<g id="row-upbringing">
  <use href="#back-upbringing" x="88" y="14"/><use href="#back-upbringing" x="138" y="14"/><use href="#back-upbringing" x="188" y="14"/><use href="#back-upbringing" x="238" y="14"/><use href="#back-upbringing" x="288" y="14"/>
</g>
<g id="row-instinct">
  <use href="#back-instinct" x="88" y="54"/><use href="#back-instinct" x="138" y="54"/><use href="#back-instinct" x="188" y="54"/><use href="#back-instinct" x="238" y="54"/><use href="#back-instinct" x="288" y="54"/>
</g>
<g id="row-values">
  <use href="#back-values" x="88" y="94"/><use href="#back-values" x="138" y="94"/><use href="#back-values" x="188" y="94"/><use href="#back-values" x="238" y="94"/><use href="#back-values" x="288" y="94"/>
</g>
<g id="row-education">
  <use href="#back-education" x="88" y="134"/><use href="#back-education" x="138" y="134"/><use href="#back-education" x="188" y="134"/><use href="#back-education" x="238" y="134"/><use href="#back-education" x="288" y="134"/>
</g>
<g id="row-skill">
  <use href="#back-skill" x="88" y="174"/><use href="#back-skill" x="138" y="174"/><use href="#back-skill" x="188" y="174"/><use href="#back-skill" x="238" y="174"/><use href="#back-skill" x="288" y="174"/>
</g>
<g id="row-need">
  <use href="#back-need" x="88" y="214"/><use href="#back-need" x="138" y="214"/><use href="#back-need" x="188" y="214"/><use href="#back-need" x="238" y="214"/><use href="#back-need" x="288" y="214"/>
</g>
<g id="row-hero">
  <use href="#back-hero" x="88" y="254"/><use href="#back-hero" x="138" y="254"/><use href="#back-hero" x="188" y="254"/><use href="#back-hero" x="238" y="254"/><use href="#back-hero" x="288" y="254"/>
</g>
</svg>
