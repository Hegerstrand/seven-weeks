  <g transform="translate(253,46)"><use href="#sh-base"/><use href="#p5"/></g>

  <g transform="translate(53,96)"><use href="#sh-legs"/><g transform="translate(0,0.5)"><use href="#p1"/></g></g>
  <g transform="translate(103,96)"><use href="#sh-legs"/><g transform="translate(0,0.5)"><use href="#p2"/></g></g>
  <g transform="translate(153,96)"><use href="#sh-legs"/><g transform="translate(0,0.5)"><use href="#p3"/></g></g>
  <g transform="translate(203,96)"><use href="#sh-legs"/><g transform="translate(0,0.5)"><use href="#p4"/></g></g>
