<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
<title>Habitus part-cards 2 of 2 (Legs, Item) - true 44 x 36 mm - print &amp; cut</title>
<desc>True A4 landscape page (297x210mm), matching the person board's real paper size exactly
- see cards-habitus-parts-01-15-44x36mm-A4-landscape.svg (sheet 1 of 2, Base/Head/Torso) for
why this sheet was split off the old single 272x297mm custom-page file. Ten part-cards (Legs,
Item rows), five per row. Cut along the gaps and slot them into the person board's seats.
Every card carries the habitus tint #F0E3D1 (lightened from #E8D4B8), which marks habitus everywhere it appears.</desc>

<style>
  .serif { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .mono  { font-family:"IBM Plex Mono","Courier Prime",Courier,monospace; fill:#000000; }
  .cut   { fill:#F0E3D1; stroke:#2A2620; stroke-width:.4; }
  .hair  { stroke:#4A5259; stroke-width:.25; fill:none; opacity:.7; }
  .nm    { font-size:4.2px; }
  .ef    { font-size:2.5px; }
  .rl    { font-size: 3.3px; letter-spacing:1.2px; }
  .ic    { fill:#F2EDE0; stroke:#2A2620; stroke-width:.45; }
  .pip   { fill:#2A2620; stroke:none; }
</style>

<defs>
  <!-- Row = outer shape. Element = pip count. Shape + pips is unique across all 20. -->
  <g id="sh-legs"><polygon points="0,-4.32 3.84,2.52 -3.84,2.52" class="ic"/></g>
  <g id="sh-item"><polygon points="0,-3.9 3.9,0 0,3.9 -3.9,0" class="ic"/></g>

  <g id="p1"><circle cx="0" cy="0" r=".5" class="pip"/></g>
  <g id="p2"><circle cx="-1.1" cy="0" r=".5" class="pip"/><circle cx="1.1" cy="0" r=".5" class="pip"/></g>
  <g id="p3"><circle cx="0" cy="-1.1" r=".5" class="pip"/><circle cx="-1.1" cy="0.9" r=".5" class="pip"/><circle cx="1.1" cy="0.9" r=".5" class="pip"/></g>
  <g id="p4"><circle cx="-1.1" cy="-1.1" r=".5" class="pip"/><circle cx="1.1" cy="-1.1" r=".5" class="pip"/><circle cx="-1.1" cy="1.1" r=".5" class="pip"/><circle cx="1.1" cy="1.1" r=".5" class="pip"/></g>
  <g id="p5"><circle cx="-1.1" cy="-1.1" r=".5" class="pip"/><circle cx="1.1" cy="-1.1" r=".5" class="pip"/><circle cx="0" cy="0" r=".5" class="pip"/><circle cx="-1.1" cy="1.1" r=".5" class="pip"/><circle cx="1.1" cy="1.1" r=".5" class="pip"/></g>
</defs>

<rect width="297" height="210" fill="#FFFFFF"/>

<text x="12" y="16" class="mono" font-size="6" letter-spacing="2">1 · HABITUS (2 of 2)</text>
<text x="12" y="23" class="serif" font-size="3.6" font-style="italic">Deal one card from each row, at random, and build the figure bottom to top. Nobody picks their upbringing.</text>
<text x="258" y="16" class="mono" font-size="3" text-anchor="end">CUT ALONG THE GAPS · DEAL, DON'T CHOOSE</text>
<line x1="12" y1="27" x2="258" y2="27" stroke="#2A2620" stroke-width=".4"/>

<!-- ═══ LEGS ═══ -->
<text x="12" y="36" class="mono rl">LEGS · INSTINCT · PRESSURE RESPONSE → STRENGTH, COST</text>
<text x="258" y="36" class="serif" font-size="2.8" text-anchor="end" font-style="italic">every part is a Hero trigger somewhere</text>
<g>
  <rect x="14" y="40" width="44" height="36" rx="1.5" class="cut"/>
  <text x="17" y="47" class="serif" font-size="4.8">Take Charge</text>
  <line x1="17" y1="50" x2="55" y2="50" class="hair"/>
  <rect x="16.6" y="51" width="9.8" height="3" rx=".3" fill="#D3CEDF"/>
  <text x="17" y="53.4" class="mono" font-size="2.8">TRUST</text>
  <text x="17" y="56.5" class="mono" font-size="2.8">3 OR MORE:</text>
  <rect x="16.6" y="57.2" width="24.2" height="3" rx=".35" fill="#D3B1B1"/>
  <text x="17" y="59.6" class="mono" font-size="2.8">+1 MOTIVATION</text>
  <line x1="17" y1="63.2" x2="55" y2="63.2" class="hair"/>
  <rect x="16.6" y="64.6" width="9.8" height="3" rx=".3" fill="#D3CEDF"/>
  <text x="17" y="67" class="mono" font-size="2.8">TRUST</text>
  <text x="17" y="70.1" class="mono" font-size="2.8">1 OR LESS:</text>
  <rect x="16.6" y="70.8" width="24.2" height="3" rx=".35" fill="#D3B1B1"/>
  <text x="17" y="73.2" class="mono" font-size="2.8">-1 MOTIVATION</text>

  <g transform="translate(13.5,0)">
  <rect x="50.5" y="40" width="44" height="36" rx="1.5" class="cut"/>
  <text x="53.5" y="47" class="serif" font-size="4.8">Analyze</text>
  <line x1="53.5" y1="50" x2="91.5" y2="50" class="hair"/>
  <rect x="53.1" y="51" width="18.8" height="3" rx=".3" fill="#C7CFB5"/>
  <text x="53.5" y="53.4" class="mono" font-size="2.8">CAPABILITY</text>
  <text x="53.5" y="56.5" class="mono" font-size="2.8">3 OR MORE:</text>
  <rect x="53.1" y="57.2" width="24.2" height="3" rx=".35" fill="#D3B1B1"/>
  <text x="53.5" y="59.6" class="mono" font-size="2.8">+1 MOTIVATION</text>
  <line x1="53.5" y1="63.2" x2="91.5" y2="63.2" class="hair"/>
  <rect x="53.1" y="64.6" width="18.8" height="3" rx=".3" fill="#C7CFB5"/>
  <text x="53.5" y="67" class="mono" font-size="2.8">CAPABILITY</text>
  <text x="53.5" y="70.1" class="mono" font-size="2.8">1 OR LESS:</text>
  <rect x="53.1" y="70.8" width="24.2" height="3" rx=".35" fill="#D3B1B1"/>
  <text x="53.5" y="73.2" class="mono" font-size="2.8">-1 MOTIVATION</text>
  </g>

  <g transform="translate(27,0)">
  <rect x="87" y="40" width="44" height="36" rx="1.5" class="cut"/>
  <text x="90" y="47" class="serif" font-size="4.8">Support</text>
  <line x1="90" y1="50" x2="128" y2="50" class="hair"/>
  <rect x="89.6" y="51" width="27.8" height="3" rx=".3" fill="#F7D7A1"/>
  <text x="90" y="53.4" class="mono" font-size="2.8">SHARED PRACTICE</text>
  <text x="90" y="56.5" class="mono" font-size="2.8">3 OR MORE:</text>
  <rect x="89.6" y="57.2" width="24.2" height="3" rx=".35" fill="#D3B1B1"/>
  <text x="90" y="59.6" class="mono" font-size="2.8">+1 MOTIVATION</text>
  <line x1="90" y1="63.2" x2="128" y2="63.2" class="hair"/>
  <rect x="89.6" y="64.6" width="27.8" height="3" rx=".3" fill="#F7D7A1"/>
  <text x="90" y="67" class="mono" font-size="2.8">SHARED PRACTICE</text>
  <text x="90" y="70.1" class="mono" font-size="2.8">1 OR LESS:</text>
  <rect x="89.6" y="70.8" width="24.2" height="3" rx=".35" fill="#D3B1B1"/>
  <text x="90" y="73.2" class="mono" font-size="2.8">-1 MOTIVATION</text>
  </g>

  <g transform="translate(40.5,0)">
  <rect x="123.5" y="40" width="44" height="36" rx="1.5" class="cut"/>
  <text x="126.5" y="47" class="serif" font-size="4.8">Challenge</text>
  <line x1="126.5" y1="50" x2="164.5" y2="50" class="hair"/>
  <rect x="126.1" y="51" width="22.4" height="3" rx=".3" fill="#B5C7CF"/>
  <text x="126.5" y="53.4" class="mono" font-size="2.8">ADAPTABILITY</text>
  <text x="126.5" y="56.5" class="mono" font-size="2.8">3 OR MORE:</text>
  <rect x="126.1" y="57.2" width="24.2" height="3" rx=".35" fill="#D3B1B1"/>
  <text x="126.5" y="59.6" class="mono" font-size="2.8">+1 MOTIVATION</text>
  <line x1="126.5" y1="63.2" x2="164.5" y2="63.2" class="hair"/>
  <rect x="126.1" y="64.6" width="22.4" height="3" rx=".3" fill="#B5C7CF"/>
  <text x="126.5" y="67" class="mono" font-size="2.8">ADAPTABILITY</text>
  <text x="126.5" y="70.1" class="mono" font-size="2.8">1 OR LESS:</text>
  <rect x="126.1" y="70.8" width="24.2" height="3" rx=".35" fill="#D3B1B1"/>
  <text x="126.5" y="73.2" class="mono" font-size="2.8">-1 MOTIVATION</text>
  </g>

  <g transform="translate(54,0)">
  <rect x="160" y="40" width="44" height="36" rx="1.5" class="cut"/>
  <text x="163" y="47" class="serif" font-size="4.8">Engage</text>
  <line x1="163" y1="50" x2="201" y2="50" class="hair"/>
  <text x="163" y="55" class="mono" font-size="3">FIRST 3 WEEKS:</text>
  <rect x="162.6" y="57" width="24.2" height="3.4" rx=".35" fill="#D3B1B1"/>
  <text x="163" y="59.6" class="mono" font-size="3">+1 MOTIVATION</text>
  <text x="163" y="67" class="mono" font-size="3">AFTER THAT:</text>
  <rect x="162.6" y="69" width="24.2" height="3.4" rx=".35" fill="#D3B1B1"/>
  <text x="163" y="71.6" class="mono" font-size="3">-1 MOTIVATION</text>
  </g>
</g>

<!-- ═══ ITEM ═══ -->
<text x="12" y="86" class="mono rl">ITEM · THE SKILL YOU HOLD → TEAM'S OVERTIME SLOT</text>
<text x="258" y="86" class="serif" font-size="2.8" text-anchor="end" font-style="italic">also the column you begin in on the Zone</text>
<g>
  <rect x="14" y="90" width="44" height="36" rx="1.5" class="cut"/>
  <text x="17" y="98.6" class="serif" font-size="4.8">Laptop</text>
  <line x1="17" y1="101.6" x2="55" y2="101.6" class="hair"/>
  <text x="17" y="110" class="serif" font-size="4.6">Builds</text>
  <text x="17" y="116" class="serif" font-size="4.6">the column.</text>

  <g transform="translate(13.5,0)">
  <rect x="50.5" y="90" width="44" height="36" rx="1.5" class="cut"/>
  <text x="53.5" y="98.6" class="serif" font-size="4.8">Coffee cup</text>
  <line x1="53.5" y1="101.6" x2="91.5" y2="101.6" class="hair"/>
  <text x="53.5" y="110" class="serif" font-size="4.6">Runs</text>
  <text x="53.5" y="116" class="serif" font-size="4.6">the column.</text>
  </g>

  <g transform="translate(27,0)">
  <rect x="87" y="90" width="44" height="36" rx="1.5" class="cut"/>
  <text x="90" y="98.6" class="serif" font-size="4.8">Clipboard</text>
  <line x1="90" y1="101.6" x2="128" y2="101.6" class="hair"/>
  <text x="90" y="110" class="serif" font-size="4.6">Checks</text>
  <text x="90" y="116" class="serif" font-size="4.6">the column.</text>
  </g>

  <g transform="translate(40.5,0)">
  <rect x="123.5" y="90" width="44" height="36" rx="1.5" class="cut"/>
  <text x="126.5" y="98.6" class="serif" font-size="4.8">Wrench</text>
  <line x1="126.5" y1="101.6" x2="164.5" y2="101.6" class="hair"/>
  <text x="126.5" y="110" class="serif" font-size="4.6">Fixes</text>
  <text x="126.5" y="116" class="serif" font-size="4.6">the column.</text>
  </g>

  <g transform="translate(54,0)">
  <rect x="160" y="90" width="44" height="36" rx="1.5" class="cut"/>
  <text x="163" y="98.6" class="serif" font-size="4.8">Calendar</text>
  <line x1="163" y1="101.6" x2="201" y2="101.6" class="hair"/>
  <text x="163" y="110" class="serif" font-size="4.6">Schedules</text>
  <text x="163" y="116" class="serif" font-size="4.6">the column.</text>
  </g>
</g>

<line x1="12" y1="132" x2="258" y2="132" class="hair"/>
<text x="12" y="138" class="serif" font-size="3.2" font-style="italic">Same skill, different person: two characters can both hold the clipboard. One defers to the boss without thinking; one doesn't.</text>
<text x="12" y="141" class="serif" font-size="3.2" font-style="italic">That difference is the whole point - it is what the Torso and Legs are for.</text>

<!-- ═══ ICONS: one per part-card, top-right. Shape names the row, pips name the element. ═══ -->
<g id="icons">
  <g transform="translate(53,46)"><use href="#sh-legs"/><g transform="translate(0,0.5)"><use href="#p1"/></g></g>
  <g transform="translate(103,46)"><use href="#sh-legs"/><g transform="translate(0,0.5)"><use href="#p2"/></g></g>
  <g transform="translate(153,46)"><use href="#sh-legs"/><g transform="translate(0,0.5)"><use href="#p3"/></g></g>
  <g transform="translate(203,46)"><use href="#sh-legs"/><g transform="translate(0,0.5)"><use href="#p4"/></g></g>
  <g transform="translate(253,46)"><use href="#sh-legs"/><g transform="translate(0,0.5)"><use href="#p5"/></g></g>

  <g transform="translate(53,96)"><use href="#sh-item"/><use href="#p1"/></g>
  <g transform="translate(103,96)"><use href="#sh-item"/><use href="#p2"/></g>
  <g transform="translate(153,96)"><use href="#sh-item"/><use href="#p3"/></g>
  <g transform="translate(203,96)"><use href="#sh-item"/><use href="#p4"/></g>
  <g transform="translate(253,96)"><use href="#sh-item"/><use href="#p5"/></g>
</g>
</svg>
