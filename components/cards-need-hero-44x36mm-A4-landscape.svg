<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
<title>NEED and HERO tiles, true 44 x 36 mm - print &amp; cut</title>
<desc>True A4 landscape page (297x210mm), so it prints at 100% on real paper with no forced
"fit to page" scaling - same fix as cards-habitus-parts, and same reason: the old 272x140mm
custom page fit neither A4 orientation, so print drivers auto-scaled it and the tiles no
longer matched the person board's true 44x36mm seats. Same card size and column spacing as
cards-habitus-parts, so all physical tiles pack the same. NEED (5 tiles, one per Torso value)
slots into the person board's NEED seat; HERO (5 tiles, one per Legs/Pressure-Response option)
slots into the HERO seat. The HERO tiles use the same shape (hexagon) and pip-count-per-option
as the HOW TO ADAPT box on Event cards (cards-event-01-09/10-18), so a tile and a matching
Event card show the same code: 1 pip = Own It, 2 = Analyze, 3 = Support, 4 = Engage,
5 = Speak Up.</desc>

<style>
  .serif { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .mono  { font-family:"IBM Plex Mono","Courier Prime",Courier,monospace; fill:#000000; }
  .cut   { fill:#F0E3D1; stroke:#2A2620; stroke-width:.4; }
  .hair  { stroke:#4A5259; stroke-width:.25; fill:none; opacity:.7; }
  .rl    { font-size:3.3px; letter-spacing:1.2px; }
  .ic    { fill:#F2EDE0; stroke:#2A2620; stroke-width:.45; }
  .pip   { fill:#FFFFFF; stroke:none; }
</style>

<defs>
  <g id="sh-torso"><polygon points="0,-3.3 3.14,-1.02 1.94,2.67 -1.94,2.67 -3.14,-1.02" class="ic"/></g>
  <g id="sh-torso-red"><polygon points="0,-3.3 3.14,-1.02 1.94,2.67 -1.94,2.67 -3.14,-1.02" fill="#905151" stroke="#2A2620" stroke-width=".45"/></g>
  <g id="sh-legs-red"><polygon points="0,-4.32 3.84,2.52 -3.84,2.52" fill="#905151" stroke="#2A2620" stroke-width=".45"/></g>

  <g id="p1"><circle cx="0" cy="0" r=".5" class="pip"/></g>
  <g id="p2"><circle cx="-1.1" cy="0" r=".5" class="pip"/><circle cx="1.1" cy="0" r=".5" class="pip"/></g>
  <g id="p3"><circle cx="0" cy="-1.1" r=".5" class="pip"/><circle cx="-1.1" cy="0.9" r=".5" class="pip"/><circle cx="1.1" cy="0.9" r=".5" class="pip"/></g>
  <g id="p4"><circle cx="-1.1" cy="-1.1" r=".5" class="pip"/><circle cx="1.1" cy="-1.1" r=".5" class="pip"/><circle cx="-1.1" cy="1.1" r=".5" class="pip"/><circle cx="1.1" cy="1.1" r=".5" class="pip"/></g>
  <g id="p5"><circle cx="-1.1" cy="-1.1" r=".5" class="pip"/><circle cx="1.1" cy="-1.1" r=".5" class="pip"/><circle cx="0" cy="0" r=".5" class="pip"/><circle cx="-1.1" cy="1.1" r=".5" class="pip"/><circle cx="1.1" cy="1.1" r=".5" class="pip"/></g>
</defs>

<rect width="297" height="210" fill="#FFFFFF"/>

<text x="12" y="16" class="mono" font-size="6" letter-spacing="2">2 · NEED &amp; HERO</text>
<text x="12" y="23" class="serif" font-size="3.6" font-style="italic">NEED is your Torso, read again from week 2. HERO is your Legs - once per game (a Competitive Base: every time), cancel the Event it names.</text>
<text x="258" y="16" class="mono" font-size="3" text-anchor="end">CUT ALONG THE GAPS</text>
<line x1="12" y1="27" x2="258" y2="27" stroke="#2A2620" stroke-width=".4"/>

<!-- ═══ NEED (= Torso, one tile per value) ═══ -->
<text x="12" y="36" class="mono rl">NEED · SAME 5 VALUES AS TORSO</text>
<text x="258" y="36" class="serif" font-size="2.8" text-anchor="end" font-style="italic">checked once, when the week closes</text>
