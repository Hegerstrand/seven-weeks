  <rect x="174.5" y="67.1" width="23" height="4" rx=".4" fill="#D3B1B1"/>
  <text x="186" y="70.2" class="serif" font-size="3.2" text-anchor="middle">-3 Motivation.</text>

  <rect x="214" y="40" width="44" height="36" rx="1.5" class="cut"/>
  <use href="#sh-torso-red" x="253" y="46"/><use href="#p5" x="253" y="46"/>
  <text x="217" y="47" class="mono" font-size="3.4" letter-spacing="1">NEED</text><text x="247" y="47" class="serif" font-size="3" font-style="italic" text-anchor="end">Recognition</text>
  <line x1="217" y1="50" x2="255" y2="50" class="hair"/>
