<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<title>Sheet 9 - Project cards, 88 x 88 mm (A4)</title>
<desc>Six sectors - Healthcare, Finance, Software, Retail, Construction, Events - each dropping
into the 90 x 90 mm Project card seat on Sheet 1, so it sits beside the six features it names.
Wider than the standard 65 x 90 Activity/Event slot on purpose: this card is read once at setup
and left in its seat all game, never shuffled with the other two decks, so it doesn't need to
match their size - only its own seat. Same slot structure in all six, identical
Work/Complexity/gates: only the names change. Healthcare, Finance, Retail, Construction and
Events play it straight; Software is the tongue-in-cheek one - a team building tools for a
team just like it. Choose one at setup and put the other five back in the box.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .c { fill:none; stroke:#2A2620; stroke-width:.5; }
  .h { stroke:#2A2620; stroke-width:.4; fill:none; }
  .q { fill:#000000; }
</style>

<defs>
  <!-- 88 x 88, for the 90 x 90 seat on sheet 1 - wider than a playing card on purpose (see
       desc). Each feature is one line now: letter, name, complexity/gate tag, Work Cost.
       Gated rows print red: D needs B, F needs C. -->
  <g id="frame">
    <rect width="88" height="88" rx="2" class="c"/>
    <text x="5" y="9" class="m q" font-size="3.2" letter-spacing="1.4">PROJECT</text>
    <circle cx="78" cy="7.5" r="5" class="c" stroke-width=".6"/>
    <line x1="5" y1="29" x2="83" y2="29" class="h" stroke-width=".7"/>
    <line x1="5" y1="81" x2="83" y2="81" class="h"/>
  </g>
</defs>

<rect width="210" height="297" fill="#FFFFFF"/>
<text x="10" y="8" class="m" font-size="3.2" letter-spacing=".5">SHEET 9 · PROJECT CARDS · PRINT AT 100% · CHOOSE ONE</text>

