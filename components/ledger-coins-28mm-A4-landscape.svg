<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
<title>LEDGER COINS, CAPITAL AND FLEX - 28 mm (A4 landscape)</title>
<desc>Every 28 mm disc in the game on one sheet. Rows 1-2: the five Ledger coins, track face above (white, with the text and ring in a deep shade of the track hue) and Habit face below (the light tint of the track, black text): Trust, Capability, Shared Practice, Standing and Team Reflexivity. Row 3: five Capital markers, one per SPECIMEN. Rows 4-5: five two-sided Flex markers, the owed face above and the repaid face below. Every disc is 28 mm, and every Ledger, Capital and Flex well is 30 mm (the four Ledger rows on THE TEAM, the Team Reflexivity well on SHIT HAPPENS, the six Capital wells and the Flex well on the SPECIMEN). Cut each disc out; a Ledger coin or a Flex marker is its two faces glued back to back around a 28 mm disc of 2 mm greyboard, a Capital marker is one face on a 28 mm disc. Print at 100% on one side of one sheet.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .h { fill:none; stroke:#2A2620; stroke-width:.8; }
  .q { fill:#000000; }
  .cut { stroke:#2A2620; stroke-width:.3; }
  .ring { fill:none; stroke:#2A2620; stroke-width:.3; }
  .ring2 { fill:none; stroke:#2A2620; stroke-width:.7; }
  .c { text-anchor:middle; }
  .k1 { fill:#5B4F7A; }
  .k2 { fill:#55663F; }
  .k3 { fill:#8A5A12; }
  .k4 { fill:#6E6249; }
  .k5 { fill:#3F6677; }
</style>

<defs>
  <!-- Coin text runs on these two arcs (220 degrees each): the name over the top, the rest under the bottom. Drawn at 15 mm, placed at scale 1.8667 = 28 mm. -->
  <path id="arcT" d="M-4.51,1.64 A4.8,4.8 0 1 1 4.51,1.64" fill="none"/>
  <path id="arcB" d="M-5.73,-2.09 A6.1,6.1 0 1 0 5.73,-2.09" fill="none"/>
  <!-- Capital and Flex: drawn at 19 mm, placed at scale 1.4737 = 28 mm -->
  <path id="arcFT" d="M-5.826,2.12 A6.2,6.2 0 1 1 5.826,2.12" fill="none"/>
  <path id="arcFB" d="M-7.33,-2.668 A7.8,7.8 0 1 0 7.33,-2.668" fill="none"/>
  <g id="cap-disc">
    <circle r="9.5" fill="#D9D3C4" class="cut"/><circle r="8.9" fill="none" stroke="#6E6249" stroke-width=".3"/>
    <text class="m" font-size="2.2" letter-spacing=".1" text-anchor="middle"><textPath href="#arcFT" startOffset="50%">CAPITAL</textPath></text>
    <text y="1.5" class="m" font-size="5" font-weight="bold" text-anchor="middle">→</text>
    <text class="m" font-size="2.2" letter-spacing=".1" text-anchor="middle"><textPath href="#arcFB" startOffset="50%">SLIDE IT</textPath></text>
  </g>
  <g id="flex-front">
    <circle r="9.5" fill="#C7CFB5" class="cut"/><circle r="8.9" class="ring"/>
    <text class="m" font-size="2.2" letter-spacing=".1" text-anchor="middle"><textPath href="#arcFT" startOffset="50%">A DAY OWED</textPath></text>
    <text y="1.3" class="m" font-size="3.8" font-weight="bold" text-anchor="middle">FLEX</text>
    <text class="m" font-size="2.2" letter-spacing=".1" text-anchor="middle"><textPath href="#arcFB" startOffset="50%">FLIP TO REPAY</textPath></text>
  </g>
  <g id="flex-back">
    <circle r="9.5" fill="#E1E6D5" class="cut"/><circle r="8.9" class="ring2"/>
    <text class="m" font-size="2.2" letter-spacing=".1" text-anchor="middle"><textPath href="#arcFT" startOffset="50%">REPAID</textPath></text>
    <text y="1.3" class="m" font-size="3.8" font-weight="bold" text-anchor="middle">FLEX</text>
    <text class="m" font-size="2.2" letter-spacing=".1" text-anchor="middle"><textPath href="#arcFB" startOffset="50%">NO OUTPUT</textPath></text>
  </g>
</defs>

<rect width="297" height="210" fill="#FFFFFF"/>

<text x="12" y="13" class="m" font-size="5" letter-spacing="1.6">COINS AND MARKERS</text>
<text x="285" y="13" class="m q" font-size="3.2" text-anchor="end">28 MM · TWENTY-FIVE DISCS</text>
<line x1="12" y1="16" x2="285" y2="16" class="h"/>
<text x="12" y="23" class="s" font-size="3.6" font-style="italic">Cut each disc out. A Ledger coin and a Flex marker are two faces glued back to back around a 28 mm disc of 2 mm greyboard; a Capital marker is one face. All the wells are 30 mm.</text>

<text x="12" y="33" class="m q" font-size="3" letter-spacing=".8">LEDGER COINS - FRONT, THE TRACK FACE</text>

<g transform="translate(48,50) scale(1.8667)"><circle r="7.5" fill="#FFFFFF" class="cut"/><circle r="6.8" style="fill:none;stroke:#5B4F7A;stroke-width:.7"/>
  <text class="m k1 c" font-size="2.4"><textPath href="#arcT" startOffset="50%">TRUST</textPath></text>
  <text y="1.8" class="m k1 c" font-size="5">4</text>
  <text class="m k1 c" font-size="1.8"><textPath href="#arcB" startOffset="50%">TO FLIP</textPath></text></g>
<g transform="translate(94,50) scale(1.8667)"><circle r="7.5" fill="#FFFFFF" class="cut"/><circle r="6.8" style="fill:none;stroke:#55663F;stroke-width:.7"/>
  <text class="m k2 c" font-size="2"><textPath href="#arcT" startOffset="50%">CAPABILITY</textPath></text>
  <text y="1.8" class="m k2 c" font-size="5">4</text>
  <text class="m k2 c" font-size="1.8"><textPath href="#arcB" startOffset="50%">TO FLIP</textPath></text></g>
<g transform="translate(140,50) scale(1.8667)"><circle r="7.5" fill="#FFFFFF" class="cut"/><circle r="6.8" style="fill:none;stroke:#8A5A12;stroke-width:.7"/>
  <text class="m k3 c" font-size="1.8"><textPath href="#arcT" startOffset="50%">SHARED PRACTICE</textPath></text>
  <text y="1.8" class="m k3 c" font-size="5">4</text>
  <text class="m k3 c" font-size="1.8"><textPath href="#arcB" startOffset="50%">TO FLIP</textPath></text></g>
<g transform="translate(186,50) scale(1.8667)"><circle r="7.5" fill="#FFFFFF" class="cut"/><circle r="6.8" style="fill:none;stroke:#6E6249;stroke-width:.7"/>
  <text class="m k4 c" font-size="2.2"><textPath href="#arcT" startOffset="50%">STANDING</textPath></text>
  <text y="1.8" class="m k4 c" font-size="5">5</text>
  <text class="m k4 c" font-size="1.8"><textPath href="#arcB" startOffset="50%">TO FLIP</textPath></text></g>
<g transform="translate(232,50) scale(1.8667)"><circle r="7.5" fill="#FFFFFF" class="cut"/><circle r="6.8" style="fill:none;stroke:#3F6677;stroke-width:.7"/>
  <text class="m k5 c" font-size="2"><textPath href="#arcT" startOffset="50%">REFLEXIVITY</textPath></text>
  <text y="1.8" class="m k5 c" font-size="5">3</text>
  <text class="m k5 c" font-size="1.8"><textPath href="#arcB" startOffset="50%">TO FLIP</textPath></text></g>

<text x="12" y="67" class="m q" font-size="3" letter-spacing=".8">LEDGER COINS - BACK, THE HABIT FACE</text>

<g transform="translate(48,84) scale(1.8667)"><circle r="7.5" fill="#D3CEDF" class="cut"/><circle r="6.8" class="ring2"/>
  <text class="m c" font-size="1.7"><textPath href="#arcT" startOffset="50%">PSYCHOLOGICAL</textPath></text>
  <text y="0.7" class="m q c" font-size="2">HABIT</text>
  <text class="m c" font-size="2"><textPath href="#arcB" startOffset="50%">SAFETY</textPath></text></g>
<g transform="translate(94,84) scale(1.8667)"><circle r="7.5" fill="#D3B1B1" class="cut"/><circle r="6.8" class="ring2"/>
  <text class="m c" font-size="2"><textPath href="#arcT" startOffset="50%">WHO KNOWS</textPath></text>
  <text y="0.7" class="m q c" font-size="2">HABIT</text>
  <text class="m c" font-size="2"><textPath href="#arcB" startOffset="50%">WHAT</textPath></text></g>
<g transform="translate(140,84) scale(1.8667)"><circle r="7.5" fill="#F7D7A1" class="cut"/><circle r="6.8" class="ring2"/>
  <text class="m c" font-size="2.2"><textPath href="#arcT" startOffset="50%">SHARED</textPath></text>
  <text y="0.7" class="m q c" font-size="2">HABIT</text>
  <text class="m c" font-size="2"><textPath href="#arcB" startOffset="50%">REPERTOIRE</textPath></text></g>
<g transform="translate(186,84) scale(1.8667)"><circle r="7.5" fill="#D9D3C4" class="cut"/><circle r="6.8" class="ring2"/>
  <text class="m c" font-size="2"><textPath href="#arcT" startOffset="50%">AUTHORIZED</textPath></text>
  <text y="0.7" class="m q c" font-size="2">HABIT</text>
  <text class="m c" font-size="2"><textPath href="#arcB" startOffset="50%">VOICE</textPath></text></g>
<g transform="translate(232,84) scale(1.8667)"><circle r="7.5" fill="#B5C7CF" class="cut"/><circle r="6.8" class="ring2"/>
  <text class="m c" font-size="2.2"><textPath href="#arcT" startOffset="50%">TEAM</textPath></text>
  <text y="0.7" class="m q c" font-size="2">HABIT</text>
  <text class="m c" font-size="1.9"><textPath href="#arcB" startOffset="50%">REFLEXIVITY</textPath></text></g>

<text x="12" y="101" class="m q" font-size="3" letter-spacing=".8">CAPITAL MARKERS - 5, ONE PER SPECIMEN</text>
<use href="#cap-disc" transform="translate(48,118) scale(1.4737)"/><use href="#cap-disc" transform="translate(94,118) scale(1.4737)"/><use href="#cap-disc" transform="translate(140,118) scale(1.4737)"/>
<use href="#cap-disc" transform="translate(186,118) scale(1.4737)"/><use href="#cap-disc" transform="translate(232,118) scale(1.4737)"/>

<text x="12" y="135" class="m q" font-size="3" letter-spacing=".8">FLEX MARKERS - 5, TWO-SIDED, FRONT: A DAY OWED</text>
<use href="#flex-front" transform="translate(48,152) scale(1.4737)"/><use href="#flex-front" transform="translate(94,152) scale(1.4737)"/><use href="#flex-front" transform="translate(140,152) scale(1.4737)"/>
<use href="#flex-front" transform="translate(186,152) scale(1.4737)"/><use href="#flex-front" transform="translate(232,152) scale(1.4737)"/>

<text x="12" y="169" class="m q" font-size="3" letter-spacing=".8">FLEX MARKERS - BACK: REPAID</text>
<use href="#flex-back" transform="translate(48,186) scale(1.4737)"/><use href="#flex-back" transform="translate(94,186) scale(1.4737)"/><use href="#flex-back" transform="translate(140,186) scale(1.4737)"/>
<use href="#flex-back" transform="translate(186,186) scale(1.4737)"/><use href="#flex-back" transform="translate(232,186) scale(1.4737)"/>
</svg>
