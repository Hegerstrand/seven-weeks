<svg xmlns="http://www.w3.org/2000/svg" width="174mm" height="297mm" viewBox="0 0 174 297">
<title>SHIT HAPPENS FRONT - Reality (narrowed to 174mm)</title>
<desc>Narrowed from true A4 (210mm) so the table's two rows keep matching widths now that THE
TEAM reverted to true A4 landscape (see _check-table-layout.svg): 420 (THE PROJECT) + 174 (SHIT
HAPPENS) = 594mm = 297 + 297 (THE TEAM and THE ZONE). The DECK slot was dropped to make room - only the two Event
slots are real card-sized (58mm, for a 63x88mm card); everything else on this sheet is
informational and was resized to fit. Glue to cardboard; shit-happens-BACK is the same size and goes
on the reverse.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .r { stroke:#2A2620; stroke-width:.5; fill:none; }
  .w { fill:none; stroke:#2A2620; stroke-width:.5; }
  .h { fill:none; stroke:#2A2620; stroke-width:.4; }
  .slot { fill:none; stroke:#2A2620; stroke-width:.6; stroke-dasharray:4 2.5; }
  .q { fill:#000000; }
  .sy { fill:none; stroke:#2A2620; stroke-width:.45; stroke-linecap:round; stroke-linejoin:round; }
</style>

<defs>
  <!-- the three objects of reflection: target = objectives, route = strategy, cycle = process -->
  <g id="sym-obj" class="sy"><circle r="3.3"/><circle r="1.9"/><circle r=".6" fill="#2A2620"/></g>
  <g id="sym-strat" class="sy"><path d="M-2.9,2.9 C-2.9,-1.2 2.6,1.2 2.6,-2.1"/><path d="M0.9,-2.6 L2.7,-3.2 L3.5,-1.1"/></g>
  <g id="sym-proc" class="sy"><path d="M2.9,-1.1 A3.1,3.1 0 1 0 2.4,1.9"/><path d="M0.9,-1.5 L3.0,-1.0 L3.4,-3.2"/></g>
</defs>

<rect width="174" height="297" fill="#FFFFFF"/>

<text x="10" y="16" class="m" font-size="7" letter-spacing="2.5">SHIT HAPPENS</text>
<text x="164" y="16" class="m q" font-size="3.6" text-anchor="end">SHIT HAPPENS · FROM WEEK 2</text>
<line x1="10" y1="20" x2="164" y2="20" class="r"/>

<!-- ═══ SHIT HAPPENS ═══ -->
<rect x="8" y="26" width="158" height="102" rx="2" class="r" style="stroke:#905151;stroke-width:.9"/>
<text x="14" y="33" class="s" font-size="5">Draw <tspan font-weight="bold">two</tspan> Event cards, face up.</text>

<rect x="24" y="39" width="58" height="80" rx="2" class="slot" style="stroke:#905151;fill:#905151"/>
<text x="53" y="81" class="m" font-size="5" text-anchor="middle" fill="#FFFFFF">EVENT 1</text>
<rect x="92" y="39" width="58" height="80" rx="2" class="slot" style="stroke:#905151;fill:#905151"/>
<text x="121" y="81" class="m" font-size="5" text-anchor="middle" fill="#FFFFFF">EVENT 2</text>
<text x="14" y="123" class="s" font-size="4">Cancel an Event in Adapt and it is discarded.</text>
<text x="14" y="127" class="s" font-size="4">Any Event you don't cancel happens before the week runs.</text>

<!-- ═══ ADAPT ═══ -->
<rect x="8" y="129" width="158" height="119" rx="2" class="r"/>
<text x="14" y="138" class="m" font-size="7" letter-spacing="1.6">ADAPT</text>
<text x="14" y="144.5" class="s" font-size="4.2">Cancel Events now. <tspan font-weight="bold">Nothing resolves until you are done.</tspan></text>

<g id="pool">
  <text x="14" y="151.5" class="m q" font-size="3.4" letter-spacing=".4">ADAPTABILITY</text>
  <rect x="11" y="153" width="54" height="52" rx="1.5" fill="#B5C7CF"/>
  <rect x="11" y="153" width="54" height="52" rx="1.5" class="w"/>
  <rect x="16" y="161" width="11" height="11" rx="1.2" class="w"/><rect x="32.5" y="161" width="11" height="11" rx="1.2" class="w"/><rect x="49" y="161" width="11" height="11" rx="1.2" class="w"/>
  <rect x="16" y="179" width="11" height="11" rx="1.2" class="w"/><rect x="32.5" y="179" width="11" height="11" rx="1.2" class="w"/><rect x="49" y="179" width="11" height="11" rx="1.2" class="w"/>
  <text x="12" y="212.6" class="s" font-size="3.2">Start with 3. Up to 6.</text>
  <text x="12" y="217" class="s" font-size="3.2">Earned: Align, Workshop, Reflect.</text>
  <text x="12" y="221.4" class="s" font-size="3.2">Spent: pay an Event's number.</text>
  <text x="12" y="225.8" class="s" font-size="3.2">Tokens stay until spent.</text>
  <text x="12" y="230.2" class="s" font-size="3.2">New tokens count from next week.</text>
</g>

<g id="lane-1">
  <text x="71" y="151.5" class="m q" font-size="3.4" letter-spacing=".4">HERO · CANCELS IT</text>
  <rect x="68" y="153" width="50" height="52" rx="1.5" fill="#F0E3D1"/>
  <rect x="68" y="153" width="50" height="52" rx="1.5" class="w"/>
  <rect x="73" y="170.4" width="40" height="5.2" rx=".5" fill="#D3B1B1"/>
  <text x="93" y="168" class="s" font-size="3.6" text-anchor="middle">Free, but require</text>
  <text x="93" y="174.2" class="s" font-size="3.6" text-anchor="middle" font-weight="bold">motivation on 3 or higher</text>
  <rect x="71" y="161" width="44" height="41" rx="1.5" class="w" stroke-dasharray="2 1.5"/>
  <polygon points="0,-4.32 3.84,2.52 -3.84,2.52" fill="#905151" stroke="#2A2620" stroke-width=".45" transform="translate(93,189)"/>
</g>

<g id="habit-lane">
  <text x="124" y="151.5" class="m q" font-size="3.4" letter-spacing=".4">HABIT</text>
  <rect x="121" y="153" width="42" height="52" rx="1.5" fill="#B5C7CF"/>
  <rect x="121" y="153" width="42" height="52" rx="1.5" class="w"/>
  <text x="142" y="157.8" class="m" font-size="2.8" text-anchor="middle">TEAM REFLEXIVITY</text>
  <text x="142" y="161.4" class="m q" font-size="2.4" text-anchor="middle">WEST 1996</text>
  <circle cx="142" cy="173" r="8" class="w"/>
  <circle cx="142" cy="173" r="10.5" class="w" style="stroke:#905151;stroke-width:.8"/>
  <rect x="124" y="191.1" width="11" height="11" rx="1.2" class="w"/><rect x="136.5" y="191.1" width="11" height="11" rx="1.2" class="w"/><rect x="149" y="191.1" width="11" height="11" rx="1.2" class="w"/>
  <use href="#sym-obj" transform="translate(129.5,196.6)"/><use href="#sym-strat" transform="translate(142,196.6)"/><use href="#sym-proc" transform="translate(154.5,196.6)"/>
</g>
<!-- Team Reflexivity: how it works (right of the pool captions) -->
<rect x="68" y="208" width="95" height="39" rx="1.5" fill="#DCE5E8"/>
<rect x="68" y="208" width="95" height="39" rx="1.5" class="w"/>
<text x="71" y="213.2" class="m" font-size="3.2" letter-spacing=".3">TEAM REFLEXIVITY: HOW IT WORKS</text>
<text x="71" y="218" class="s" font-size="3.3">Reflect on last week: a well fills, <tspan font-weight="bold">and</tspan> the pool gets its token.</text>
<use href="#sym-obj" transform="translate(74,222.4) scale(.8)"/><text x="79" y="223.6" class="s" font-size="3.4"><tspan font-weight="bold">Objectives</tspan>: a feature was banked last week.</text>
<use href="#sym-strat" transform="translate(74,227.8) scale(.8)"/><text x="79" y="229" class="s" font-size="3.4"><tspan font-weight="bold">Strategy</tspan>: you adapted to 2 Events last week.</text>
<use href="#sym-proc" transform="translate(74,233.2) scale(.8)"/><text x="79" y="234.4" class="s" font-size="3.4"><tspan font-weight="bold">Process</tspan>: a Hero or a token played, or an Event</text>
<text x="79" y="238" class="s" font-size="3.4">cost Trust, Capability or Shared Practice.</text>
<text x="71" y="243" class="s" font-size="2.9" font-style="italic">Three filled: the coin turns over. Name one change.</text>

<!-- ═══ CLOSE THE WEEK ═══ -->
<rect x="8" y="249.5" width="158" height="41.5" rx="2" class="r"/>
<text x="13" y="255.6" class="m" font-size="5.2" letter-spacing="1.4">CLOSE THE WEEK</text>
<text x="164.3" y="255.6" class="m q" font-size="3" text-anchor="end">TOP TO BOTTOM</text>
<line x1="13" y1="258" x2="161" y2="258" class="h"/>

<text x="13" y="263.6" class="m" font-size="3.6">1</text>
<text x="19" y="263.6" class="s" font-size="4.2"><tspan font-weight="bold">Anything finished?</tspan> Put its block on the tower.</text>
<text x="13" y="269.2" class="m" font-size="3.6">2</text>
<text x="19" y="269.2" class="s" font-size="4.2"><tspan font-weight="bold">Move the coins</tspan>, one step each. Add Adaptability tokens.</text>
<rect x="18" y="270.9" width="101" height="4.8" rx=".8" fill="#D3B1B1"/>
<text x="13" y="274.8" class="m" font-size="3.6">3</text>
<text x="19" y="274.8" class="s" font-size="4.2"><tspan font-weight="bold">The grind: everyone loses 1 Motivation.</tspan> Empty means they leave.</text>
<text x="19" y="278.8" class="m q" font-size="2.8">FROM WEEK 2: +1 BACK IF THEIR NEED WAS MET</text>
<text x="13" y="284" class="m" font-size="3.6">4</text>
<text x="19" y="284" class="s" font-size="4.2"><tspan font-weight="bold">Move the week marker.</tspan> The deadline does not move.</text>
<text x="164.3" y="289" class="m q" font-size="2.6" text-anchor="end">FULL DETAIL ON THE SPECIMEN BOARD</text>

<!-- table-placement guide - matches the same-coloured line on the neighbouring board's edge -->
<line x1="6" y1="6" x2="168" y2="6" stroke="#905151" stroke-width="1"/>
<line x1="6" y1="6" x2="6" y2="291" stroke="#6E6249" stroke-width="1"/>
</svg>
