<svg xmlns="http://www.w3.org/2000/svg" width="174mm" height="297mm" viewBox="0 0 174 297">
<title>SHIT HAPPENS FRONT - Reality (narrowed to 174mm)</title>
<desc>Narrowed from true A4 (210mm) so the table's two rows keep matching widths now that THE
TEAM reverted to true A4 landscape (see _check-table-layout.svg): 420 (THE PROJECT) + 174 (SHIT
HAPPENS) = 594mm = 297 + 297 (THE TEAM and THE ZONE). The DECK slot was dropped to make room - only the two Event
slots are real card-sized (58mm, for a 63x88mm card); everything else on this sheet is
informational and was resized to fit. Glue to cardboard; shit-happens-BACK is the same size and goes
on the reverse.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .r { stroke:#2A2620; stroke-width:.5; fill:none; }
  .w { fill:none; stroke:#2A2620; stroke-width:.5; }
  .h { fill:none; stroke:#2A2620; stroke-width:.4; }
  .slot { fill:none; stroke:#2A2620; stroke-width:.6; stroke-dasharray:4 2.5; }
  .q { fill:#000000; }
</style>

<rect width="174" height="297" fill="#FFFFFF"/>

<text x="10" y="16" class="m" font-size="7" letter-spacing="2.5">SHIT HAPPENS</text>
<text x="164" y="16" class="m q" font-size="3.6" text-anchor="end">SHIT HAPPENS · FROM WEEK 2</text>
<line x1="10" y1="20" x2="164" y2="20" class="r"/>

<!-- ═══ SHIT HAPPENS ═══ -->
<rect x="8" y="26" width="158" height="102" rx="2" class="r" style="stroke:#905151;stroke-width:.9"/>
<text x="14" y="33" class="s" font-size="5">Draw <tspan font-weight="bold">two</tspan> Event cards, face up.</text>

<rect x="24" y="39" width="58" height="80" rx="2" class="slot" style="stroke:#905151;fill:#905151"/>
<text x="53" y="81" class="m" font-size="5" text-anchor="middle" fill="#FFFFFF">EVENT 1</text>
<rect x="92" y="39" width="58" height="80" rx="2" class="slot" style="stroke:#905151;fill:#905151"/>
<text x="121" y="81" class="m" font-size="5" text-anchor="middle" fill="#FFFFFF">EVENT 2</text>
<text x="14" y="123" class="s" font-size="4">If you adapt, the card is resolved and discarded.</text>
<text x="14" y="127" class="s" font-size="4">If not, the card stays and the SHIT stacks.</text>

<!-- ═══ ADAPT ═══ -->
<rect x="8" y="129" width="158" height="77" rx="2" class="r"/>
<text x="14" y="138" class="m" font-size="7" letter-spacing="1.6">ADAPT</text>
<text x="14" y="144.5" class="s" font-size="4.2">Deal with both Events now. <tspan font-weight="bold">Nothing resolves until this step is finished.</tspan></text>

<g id="pool">
  <text x="27" y="151.5" class="m q" font-size="3.4" letter-spacing=".4">ADAPTABILITY</text>
  <rect x="24" y="153" width="58" height="49" rx="1.5" fill="#B5C7CF"/>
  <rect x="24" y="153" width="58" height="49" rx="1.5" class="w"/>
  <circle cx="39" cy="168" r="5" class="w"/><circle cx="53" cy="168" r="5" class="w"/><circle cx="67" cy="168" r="5" class="w"/>
  <circle cx="39" cy="184" r="5" class="w"/><circle cx="53" cy="184" r="5" class="w"/><circle cx="67" cy="184" r="5" class="w"/>
  <text x="27" y="192" class="s" font-size="2.8">Spend maximum the number of Adapt points</text>
  <text x="27" y="196" class="s" font-size="2.8">according to the placement of</text>
  <text x="27" y="200" class="s" font-size="2.8">the Adaptability Coin on THE TEAM.</text>
</g>

<g id="lane-1">
  <text x="95" y="151.5" class="m q" font-size="3.4" letter-spacing=".4">HERO · CANCELS IT</text>
  <rect x="92" y="153" width="58" height="49" rx="1.5" fill="#E8D4B8"/>
  <rect x="92" y="153" width="58" height="49" rx="1.5" class="w"/>
  <rect x="121.46" y="156.48" width="16.38" height="3.22" rx=".45" fill="#D3B1B1"/>
  <text x="95" y="159" class="s" font-size="2.8">Needs your Head, and <tspan font-weight="bold">3+ Motivation</tspan>.</text>
  <rect x="99" y="163" width="44" height="36" rx="1.5" class="w" stroke-dasharray="2 1.5"/>
  <polygon points="3.3,0 1.65,2.86 -1.65,2.86 -3.3,0 -1.65,-2.86 1.65,-2.86" fill="#905151" stroke="#2A2620" stroke-width=".45" transform="translate(121,181)"/>
</g>

<!-- ═══ CLOSE THE WEEK ═══ -->
<rect x="8" y="209" width="158" height="82" rx="2" class="r"/>
<text x="13" y="221" class="m" font-size="7" letter-spacing="1.6">CLOSE THE WEEK</text>
<text x="164.3" y="221" class="m q" font-size="3.6" text-anchor="end">TOP TO BOTTOM</text>
<line x1="13" y1="225" x2="161" y2="225" class="h"/>

<circle cx="18" cy="235" r="5" class="w"/><text x="18" y="237" class="m" font-size="5.5" text-anchor="middle">1</text>
<text x="26.3" y="234" class="s" font-size="5.4"><tspan font-weight="bold">Anything finished?</tspan> Put its block on the tower.</text>
<text x="26.3" y="240" class="s" font-size="4.4">Remove the blocking on a feature if it was unblocked.</text>

<circle cx="18" cy="251" r="5" class="w"/><text x="18" y="253" class="m" font-size="5.5" text-anchor="middle">2</text>
<text x="26.3" y="250" class="s" font-size="5.4"><tspan font-weight="bold">Move the coins.</tspan> One step each, no more.</text>
<text x="26.3" y="256" class="s" font-size="4.4">Any coin that reached its ring turns over - and stays turned.</text>

<circle cx="18" cy="267" r="5" class="w"/><text x="18" y="269" class="m" font-size="5.5" text-anchor="middle">3</text>
<rect x="26.3" y="261.14" width="67.7" height="6.21" rx=".9" fill="#D3B1B1"/>
<text x="26.3" y="266" class="s" font-size="5.4"><tspan font-weight="bold">Everyone loses 1 Motivation.</tspan></text>
<text x="26.3" y="272" class="s" font-size="4.4">Check Torso vs Events, <tspan font-style="italic">then</tspan> add up - empty means they leave.</text>
<polygon points="0,-1.32 1.256,-.408 0.776,1.068 -0.776,1.068 -1.256,-.408" fill="#905151" stroke="#2A2620" stroke-width=".2" transform="translate(28,275.3)"/>
<text x="30.45" y="277" class="m q" font-size="3.4">FROM WEEK 3: +1 BACK IF THEIR NEED WAS MET</text>

<circle cx="18" cy="283" r="5" class="w"/><text x="18" y="285" class="m" font-size="5.5" text-anchor="middle">4</text>
<text x="26.3" y="282" class="s" font-size="5.4"><tspan font-weight="bold">Move the week marker.</tspan> One week closer to the deadline.</text>
<text x="26.3" y="288" class="s" font-size="4.4">The deadline does not move. Nothing else happens here.</text>

<!-- table-placement guide - matches the same-coloured line on the neighbouring board's edge -->
<line x1="6" y1="6" x2="168" y2="6" stroke="#905151" stroke-width="1"/>
<line x1="6" y1="6" x2="6" y2="291" stroke="#6E6249" stroke-width="1"/>
</svg>
