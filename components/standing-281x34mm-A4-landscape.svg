<svg xmlns="http://www.w3.org/2000/svg" width="333mm" height="210mm" viewBox="0 0 333 210">
<title>STANDING - front and back on one page (317 x 34 mm strip)</title>
<desc>The Standing row is a separate strip, not part of THE TEAM. Widened 281 to 317mm to match
THE TEAM's widened Standing slot. Cut both panels out, glue them to opposite faces of one piece
of 2 mm greyboard, and drop the strip into the dashed slot at the foot of THE TEAM with the
week-4 face showing. Turn it over in place at the start of week 4. Print at 100% on one side of
one sheet.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .r { stroke:#2A2620; stroke-width:.5; fill:none; }
  .w { fill:none; stroke:#2A2620; stroke-width:.55; }
  .q { fill:#000000; }
  .cut { fill:none; stroke:#4A5259; stroke-width:.35; stroke-dasharray:3 2; }
</style>

<rect width="333" height="210" fill="#FFFFFF"/>
<text x="10" y="8" class="m" font-size="3.2" letter-spacing=".5">STANDING · BOTH FACES ON THIS PAGE · PRINT AT 100%</text>
<line x1="10" y1="12" x2="323" y2="12" class="r"/>

<!-- ───────────── FRONT: the row itself, revealed in week 4 ───────────── -->
<text x="10" y="40" class="m" font-size="4.2" letter-spacing="1.2">FACE A · THE ROW</text>
<text x="70" y="40" class="s" font-size="3.6" font-style="italic">this is the side you turn up at the start of week 4</text>

<g id="face-a" transform="translate(0,-42)">
  <rect x="8" y="88" width="317" height="34" rx="2" style="fill:#D9D3C4;stroke:#2A2620;stroke-width:.5"/>
  <text x="12" y="99" class="s" font-size="6">Standing</text>
  <text x="12" y="106" class="s" font-size="3.4" font-style="italic">grown by nobody</text>
  <g class="m" font-size="3.8" text-anchor="middle">
    <text x="96" y="86">0</text><text x="116" y="86">1</text><text x="136" y="86">2</text>
    <text x="156" y="86">3</text><text x="176" y="86">4</text><text x="196" y="86">5</text>
  </g>
  <g class="w">
    <circle cx="96" cy="100" r="8"/><circle cx="116" cy="100" r="8"/><circle cx="136" cy="100" r="8"/>
    <circle cx="156" cy="100" r="8"/><circle cx="176" cy="100" r="8"/><circle cx="196" cy="100" r="8"/>
  </g>
  <circle cx="196" cy="100" r="10.5" class="w" style="stroke:#905151;stroke-width:.8"/>
  <path d="M88,110 L88,113 L204,113 L204,110" class="w" stroke-width=".5"/>
  <rect x="158.20" y="114.82" width="12.56" height="2.94" rx=".4" fill="#D9D3C4"/>
  <text x="146" y="117" class="m" font-size="2.8" text-anchor="middle">NOT GROWN - IT MIRRORS THE HIGHEST <tspan>CAPITAL</tspan> AT THE TABLE</text>
  <text x="248" y="99" class="s" font-size="5">Authorized Voice</text>
  <text x="248" y="104" class="s" font-size="3.4" font-style="italic">Once a week: cancel an</text>
  <text x="248" y="108" class="s" font-size="3.4" font-style="italic">Event outright.</text>
  <text x="248" y="117" class="m q" font-size="2.6">BOURDIEU 1991</text>
</g>

<!-- ───────────── BACK: what shows while it waits in the slot ───────────── -->
<text x="10" y="116" class="m" font-size="4.2" letter-spacing="1.2">FACE B · UNTIL WEEK 4</text>
<text x="92" y="116" class="s" font-size="3.6" font-style="italic">this is the side showing while the strip sits in its slot</text>

<g id="face-b" transform="translate(0,34)">
  <rect x="8" y="88" width="317" height="34" rx="2" class="r"/>
  <text x="14" y="96" class="m q" font-size="3.6" letter-spacing="1.2">TURN ME OVER · START OF WEEK 4</text>
  <text x="14" y="107" class="s" font-size="9">Standing joins the Ledger.</text>
  <rect x="82.2" y="110.91" width="12" height="4.83" rx=".4" fill="#D9D3C4"/>
  <text x="14" y="114.5" class="s" font-size="4.6">It is not grown. It mirrors the highest <tspan>Capital</tspan> at the table - your place in the room is on loan.</text>
  <text x="14" y="120" class="m" font-size="3.2">ALSO NOW: A FACE-DOWN QUALITY CHIP GOES ON EACH FEATURE</text>
</g>

<line x1="10" y1="172" x2="323" y2="172" class="cut"/>
<text x="10" y="180" class="s" font-size="4">Cut both panels out. Glue them to opposite faces of one piece of 2 mm greyboard - <tspan font-weight="bold">Face A and Face B on the same strip.</tspan></text>
<text x="10" y="186" class="s" font-size="4">Drop it into the dashed slot at the foot of sheet 3 with <tspan font-weight="bold">Face B</tspan> showing, and turn it over in place when week 4 begins.</text>
</svg>
