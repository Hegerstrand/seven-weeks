<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>THE PROJECT BACK - Week 1, The Week (true A3 landscape)</title>
<desc>Glues to the reverse of the-project-FRONT. Same paper size, same orientation: flip about the
long edge and both sides read the right way up. This face is what the table sees before the
game starts.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .h { fill:none; stroke:#2A2620; stroke-width:.8; }
  .q { fill:#000000; }
</style>

<rect width="420" height="297" fill="#FFFFFF"/>

<text x="24" y="26" class="m q" font-size="6" letter-spacing="3">TURN ME OVER AFTER SETUP</text>
<line x1="24" y1="32" x2="396" y2="32" class="h"/>

<text x="24" y="66" class="m" font-size="26" letter-spacing="6">WEEK 1</text>
<text x="24" y="112" class="s" font-size="42">THE PROJECT</text>
<line x1="24" y1="126" x2="396" y2="126" class="h" stroke-width="1.2"/>

<text x="24" y="140" class="m q" font-size="6" letter-spacing="2.5">THE ONE IDEA</text>
<text x="24" y="160" class="s" font-size="20">A week is five days, and you choose them.</text>

<line x1="24" y1="172" x2="396" y2="172" class="h" stroke-width=".5"/>

<text x="24" y="190" class="m q" font-size="6" letter-spacing="2.5">ON THE TABLE</text>
<text x="24" y="204" class="s" font-size="8">The week strip and the six features.</text>
<rect x="132" y="207.8" width="37" height="9.2" rx="1.4" fill="#D3B1B1"/>
<text x="24" y="215" class="s" font-size="8"><tspan textLength="108" lengthAdjust="spacingAndGlyphs">Your figure, your Knowledge, your </tspan><tspan textLength="37" lengthAdjust="spacingAndGlyphs">Motivation</tspan>.</text>
<text x="24" y="226" class="s" font-size="8">Nothing else yet.</text>

<text x="24" y="246" class="m q" font-size="6" letter-spacing="2.5">CARDS IN PLAY</text>
<text x="24" y="260" class="m" font-size="7">PLAN · WORK · COORDINATE · CELEBRATE</text>

<line x1="212" y1="180" x2="212" y2="290" class="h" stroke-width=".4"/>

<text x="228" y="190" class="m q" font-size="6" letter-spacing="2.5">SET OUT THESE STACKS</text>
<rect x="228" y="200" width="90" height="90" rx="2" class="h" stroke-width=".5" stroke-dasharray="3 2"/>
<text x="273" y="214" class="m q" font-size="5" text-anchor="middle">PROJECT CARDS</text>
<text x="273" y="276" class="s q" font-size="3.6" text-anchor="middle" font-style="italic">pick one at setup,</text>
<text x="273" y="281" class="s q" font-size="3.6" text-anchor="middle" font-style="italic">the rest wait here</text>
<rect x="328" y="200" width="65" height="90" rx="2" class="h" stroke-width=".5" stroke-dasharray="3 2"/>
<text x="360.5" y="214" class="m q" font-size="5" text-anchor="middle">ACTION CARDS</text>
<text x="360.5" y="276" class="s q" font-size="3.6" text-anchor="middle" font-style="italic">this week's four cards,</text>
<text x="360.5" y="281" class="s q" font-size="3.6" text-anchor="middle" font-style="italic">the rest wait for later</text>

<!-- table-placement guide - matches the same-coloured line on the neighbouring board's edge -->
<line x1="6" y1="6" x2="291" y2="6" stroke="#3F5B66" stroke-width="1"/>
<line x1="303" y1="6" x2="414" y2="6" stroke="#9C7A32" stroke-width="1"/>
<line x1="414" y1="6" x2="414" y2="291" stroke="#6E6249" stroke-width="1"/>
</svg>
