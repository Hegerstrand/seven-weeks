<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
<title>THE TEAM FRONT - the Ledger (A4 landscape)</title>
<desc>True A4 landscape (297 x 210) - SHIT HAPPENS is narrowed instead to keep the table's two rows
matching widths (see _check-table-layout.svg). One coin per row; walk it, turn it over at
the ring. Four rows: Trust, Capability, Shared Practice and Standing. Adaptability is not a row:
it is a pool of tokens on SHIT HAPPENS. Glue to cardboard;
the-team-BACK matches and goes on the reverse.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .r { stroke:#2A2620; stroke-width:.5; fill:none; }
  .w { fill:none; stroke:#2A2620; stroke-width:.55; }
  .q { fill:#000000; }
  .band { stroke:none; }
</style>

<rect width="297" height="210" fill="#FFFFFF"/>

<text x="12" y="16" class="m" font-size="7" letter-spacing="2.5">THE TEAM</text>
<text x="78" y="16" class="s" font-size="4.4" font-style="italic">It was never only the project.</text>
<text x="285.4" y="16" class="m q" font-size="3.8" text-anchor="end">THE TEAM · FROM END OF WEEK 1</text>
<line x1="11.5" y1="20" x2="285.4" y2="20" class="r"/>

<rect x="8" y="22" width="281" height="10.5" rx="1.5" class="r"/>
<text x="12" y="26" class="s" font-size="3.8" font-style="italic">One coin per row. Walk it as the track moves. At the ring, turn it over - that is a <tspan font-weight="bold">HABIT</tspan>, and it is permanent.</text>
<text x="12" y="30" class="s" font-size="3.8" font-style="italic">The coin can walk back down afterwards. It never turns back over. The left column is what the team <tspan font-style="normal">does</tspan>; the right is what it has <tspan font-style="normal">become</tspan>, and who named it.</text>

<text x="107" y="36" class="m" font-size="4.2" text-anchor="middle" letter-spacing=".6">START</text>
<text x="170" y="36" class="m" font-size="4.2" text-anchor="middle" letter-spacing=".6">FLIP → HABIT</text>
<text x="220.7" y="36" class="m" font-size="3" letter-spacing=".3">HABIT - PRINTED ON THE EVENT CARDS</text>

<!-- TRUST -->
<g id="trust">
  <rect x="8" y="40" width="281" height="34" rx="2" class="band" fill="#D3CEDF"/>
  <text x="12" y="47" class="s" font-size="6">Trust</text>
  <text x="12" y="54" class="s" font-size="3.4" font-style="italic">grown by Engagement</text>
  <g class="w">
    <circle cx="86" cy="54" r="9"/><circle cx="107" cy="54" r="9"/><circle cx="128" cy="54" r="9"/>
    <circle cx="149" cy="54" r="9"/><circle cx="170" cy="54" r="9"/><circle cx="191" cy="54" r="9"/>
  </g>
  <g class="m q" font-size="4.2" text-anchor="middle">
    <text x="86" y="55.4">0</text><text x="107" y="55.4">1</text><text x="128" y="55.4">2</text>
    <text x="149" y="55.4">3</text><text x="170" y="55.4">4</text><text x="191" y="55.4">5</text>
  </g>
  <circle cx="170" cy="54" r="10" class="w" style="stroke:#905151;stroke-width:.8"/>
  <path d="M76.5,65.5 L76.5,68.5 L116.5,68.5 L116.5,65.5" class="w" style="stroke:#905151;stroke-width:.5"/>
  <text x="96.5" y="72" class="m" font-size="2.8" text-anchor="middle">TEACH DOES NOTHING</text>
  <text x="220.7" y="47" class="s" font-size="5">Psychological Safety</text>
  <text x="220.7" y="53.5" class="m q" font-size="2.6">EDMONDSON 1999</text>
</g>

<!-- CAPABILITY -->
<g id="capability">
  <rect x="8" y="78" width="281" height="34" rx="2" class="band" fill="#C7CFB5"/>
  <text x="12" y="85" class="s" font-size="6">Capability</text>
  <text x="12" y="92" class="s" font-size="3.4" font-style="italic">grown by filling a whole</text>
  <text x="12" y="96.5" class="s" font-size="3.4" font-style="italic">row or column on the Zone</text>
  <g class="w">
    <circle cx="86" cy="92" r="9"/><circle cx="107" cy="92" r="9"/><circle cx="128" cy="92" r="9"/>
    <circle cx="149" cy="92" r="9"/><circle cx="170" cy="92" r="9"/><circle cx="191" cy="92" r="9"/>
  </g>
  <g class="m q" font-size="4.2" text-anchor="middle">
    <text x="86" y="93.4">0</text><text x="107" y="93.4">1</text><text x="128" y="93.4">2</text>
    <text x="149" y="93.4">3</text><text x="170" y="93.4">4</text><text x="191" y="93.4">5</text>
  </g>
  <circle cx="170" cy="92" r="10" class="w" style="stroke:#905151;stroke-width:.8"/>
  <path d="M76.5,103.5 L76.5,106.5 L116.5,106.5 L116.5,103.5" class="w" style="stroke:#905151;stroke-width:.5"/>
  <text x="96.5" y="110" class="m" font-size="2.8" text-anchor="middle">FIRST WORK DOES NOTHING</text>
  <text x="220.7" y="85" class="s" font-size="5">Who Knows What</text>
  <text x="220.7" y="91.5" class="m q" font-size="2.6">WEGNER 1986 · TRANSACTIVE MEMORY</text>
</g>

<!-- SHARED PRACTICE -->
<g id="shared-practice">
  <rect x="8" y="116" width="281" height="34" rx="2" class="band" fill="#F7D7A1"/>
  <text x="12" y="123" class="s" font-size="6">Shared Practice</text>
  <text x="12" y="130" class="s" font-size="3.4" font-style="italic">grown by Reflect, and by</text>
  <text x="12" y="134.5" class="s" font-size="3.4" font-style="italic">stacking a square on the Zone</text>
  <g class="w">
    <circle cx="86" cy="130" r="9"/><circle cx="107" cy="130" r="9"/><circle cx="128" cy="130" r="9"/>
    <circle cx="149" cy="130" r="9"/><circle cx="170" cy="130" r="9"/><circle cx="191" cy="130" r="9"/>
  </g>
  <g class="m q" font-size="4.2" text-anchor="middle">
    <text x="86" y="131.4">0</text><text x="107" y="131.4">1</text><text x="128" y="131.4">2</text>
    <text x="149" y="131.4">3</text><text x="170" y="131.4">4</text><text x="191" y="131.4">5</text>
  </g>
  <circle cx="170" cy="130" r="10" class="w" style="stroke:#905151;stroke-width:.8"/>
  <path d="M76.5,141.5 L76.5,144.5 L116.5,144.5 L116.5,141.5" class="w" style="stroke:#905151;stroke-width:.5"/>
  <text x="96.5" y="148" class="m" font-size="2.8" text-anchor="middle">PLAN DOES NOTHING</text>
  <text x="220.7" y="123" class="s" font-size="5">Shared Repertoire</text>
  <text x="220.7" y="129.5" class="m q" font-size="2.6">LAVE &amp; WENGER 1991 · WENGER 1998</text>
</g>

<!-- STANDING - on the board from the start; the coin mirrors the highest Capital, it is never walked -->
<g id="standing">
  <rect x="8" y="154" width="281" height="34" rx="2" class="band" fill="#D9D3C4"/>
  <text x="12" y="161" class="s" font-size="6">Standing</text>
  <text x="12" y="168" class="s" font-size="3.4" font-style="italic">grown by nobody</text>
  <text x="12" y="172.5" class="s" font-size="3.4" font-style="italic">starts on 0</text>
  <g class="w">
    <circle cx="86" cy="168" r="9"/><circle cx="107" cy="168" r="9"/><circle cx="128" cy="168" r="9"/>
    <circle cx="149" cy="168" r="9"/><circle cx="170" cy="168" r="9"/><circle cx="191" cy="168" r="9"/>
  </g>
  <g class="m q" font-size="4.2" text-anchor="middle">
    <text x="86" y="169.4">0</text><text x="107" y="169.4">1</text><text x="128" y="169.4">2</text>
    <text x="149" y="169.4">3</text><text x="170" y="169.4">4</text><text x="191" y="169.4">5</text>
  </g>
  <circle cx="170" cy="168" r="10" class="w" style="stroke:#905151;stroke-width:.8"/>
  <path d="M76.5,179.5 L76.5,182.5 L200.5,182.5 L200.5,179.5" class="w" style="stroke:#905151;stroke-width:.5"/>
  <text x="138.5" y="186" class="m" font-size="2.8" text-anchor="middle">NOT GROWN - IT MIRRORS THE HIGHEST CAPITAL AT THE TABLE</text>
  <text x="220.7" y="161" class="s" font-size="5">Authorized Voice</text>
  <text x="220.7" y="167.5" class="s" font-size="3.4" font-style="italic">Once a week: cancel a Management</text>
  <text x="220.7" y="171.5" class="s" font-size="3.4" font-style="italic">or Customer Event outright.</text>
  <text x="220.7" y="177.5" class="m q" font-size="2.6">BOURDIEU 1991</text>
</g>
<text x="170" y="152.6" class="m" font-size="2.6" text-anchor="middle">FLIP AT 4</text>

<text x="12" y="194" class="s" font-size="3.8" font-style="italic">Adaptability is not a track here: it is a pool of tokens, kept on SHIT HAPPENS, with the Team Reflexivity coin beside it.</text>

<!-- table-placement guide - matches the same-coloured line on the neighbouring board's edge -->
<line x1="6" y1="6" x2="6" y2="200" stroke="#6E7A54" stroke-width="1"/>
<line x1="6.2" y1="200" x2="104.6" y2="200" stroke="#9C7A32" stroke-width="1"/>
<line x1="115.2" y1="200" x2="290.6" y2="200" stroke="#905151" stroke-width="1"/>
</svg>
