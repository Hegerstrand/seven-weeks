<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
<title>THE TEAM FRONT - the Ledger (A4 landscape)</title>
<desc>True A4 landscape (297 x 210) - SHIT HAPPENS is narrowed instead to keep the table's two rows
matching widths (see _check-table-layout.svg). One coin per row; walk it, turn it over at
the ring. The Standing row is dashed because it stays covered until week 4. Glue to cardboard;
the-team-BACK matches and goes on the reverse.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .r { stroke:#2A2620; stroke-width:.5; fill:none; }
  .w { fill:none; stroke:#2A2620; stroke-width:.55; }
  .q { fill:#000000; }
  .band { stroke:none; }
</style>

<rect width="297" height="210" fill="#FFFFFF"/>

<text x="12" y="16" class="m" font-size="7" letter-spacing="2.5">THE TEAM</text>
<text x="78" y="16" class="s" font-size="4.4" font-style="italic">It was never only the project.</text>
<text x="285.4" y="16" class="m q" font-size="3.8" text-anchor="end">THE TEAM · FROM END OF WEEK 1</text>
<line x1="11.5" y1="20" x2="285.4" y2="20" class="r"/>

<rect x="8" y="22" width="281" height="10.5" rx="1.5" class="r"/>
<text x="12" y="26" class="s" font-size="3.8" font-style="italic">One coin per row. Walk it as the track moves. At the ring, turn it over - that is a <tspan font-weight="bold">HABIT</tspan>, and it is permanent.</text>
<text x="12" y="30" class="s" font-size="3.8" font-style="italic">The coin can walk back down afterwards. It never turns back over. The left column is what the team <tspan font-style="normal">does</tspan>; the right is what it has <tspan font-style="normal">become</tspan>, and who named it.</text>

<text x="103.7" y="36" class="m" font-size="4.2" text-anchor="middle" letter-spacing=".6">START</text>
<text x="156.9" y="36" class="m" font-size="4.2" text-anchor="middle" letter-spacing=".6">FLIP → HABIT</text>
<text x="220.7" y="36" class="m" font-size="3" letter-spacing=".3">HABIT - PRINTED ON THE EVENT CARDS</text>

<!-- TRUST -->
<g id="trust" transform="translate(0,-4)">
  <rect x="8" y="45" width="281" height="28" rx="2" class="band" fill="#D3CEDF"/>
  <text x="12" y="52" class="s" font-size="6">Trust</text>
  <text x="12" y="59" class="s" font-size="3.4" font-style="italic">grown by Coordinate</text>
  <g class="w">
    <circle cx="86" cy="54" r="8"/><circle cx="103.7" cy="54" r="8"/><circle cx="121.5" cy="54" r="8"/>
    <circle cx="139.2" cy="54" r="8"/><circle cx="156.9" cy="54" r="8"/><circle cx="174.7" cy="54" r="8"/>
  </g>
  <g class="m q" font-size="4.2" text-anchor="middle">
    <text x="86" y="55.4">0</text><text x="103.7" y="55.4">1</text><text x="121.5" y="55.4">2</text>
    <text x="139.2" y="55.4">3</text><text x="156.9" y="55.4">4</text><text x="174.7" y="55.4">5</text>
  </g>
  <circle cx="156.9" cy="54" r="10.5" class="w" style="stroke:#905151;stroke-width:.8"/>
  <path d="M78.9,64 L78.9,67 L110.8,67 L110.8,64" class="w" style="stroke:#905151;stroke-width:.5"/>
  <text x="94.9" y="71" class="m" font-size="2.8" text-anchor="middle">TEACH DOES NOTHING</text>
  <text x="220.7" y="52" class="s" font-size="5">Psychological Safety</text>
  <text x="220.7" y="58.5" class="m q" font-size="2.6">EDMONDSON 1999</text>
</g>

<!-- CAPABILITY -->
<g id="capability" transform="translate(0,-3)">
  <rect x="8" y="75" width="281" height="28" rx="2" class="band" fill="#C7CFB5"/>
  <text x="12" y="82" class="s" font-size="6">Capability</text>
  <text x="12" y="89" class="s" font-size="3.4" font-style="italic">grown by filling a whole</text>
  <text x="12" y="93.5" class="s" font-size="3.4" font-style="italic">row or column on the Zone</text>
  <g class="w">
    <circle cx="86" cy="84" r="8"/><circle cx="103.7" cy="84" r="8"/><circle cx="121.5" cy="84" r="8"/>
    <circle cx="139.2" cy="84" r="8"/><circle cx="156.9" cy="84" r="8"/><circle cx="174.7" cy="84" r="8"/>
  </g>
  <g class="m q" font-size="4.2" text-anchor="middle">
    <text x="86" y="85.4">0</text><text x="103.7" y="85.4">1</text><text x="121.5" y="85.4">2</text>
    <text x="139.2" y="85.4">3</text><text x="156.9" y="85.4">4</text><text x="174.7" y="85.4">5</text>
  </g>
  <circle cx="156.9" cy="84" r="10.5" class="w" style="stroke:#905151;stroke-width:.8"/>
  <path d="M78.9,94 L78.9,97 L110.8,97 L110.8,94" class="w" style="stroke:#905151;stroke-width:.5"/>
  <text x="94.9" y="101" class="m" font-size="2.8" text-anchor="middle">FIRST WORK DOES NOTHING</text>
  <text x="220.7" y="82" class="s" font-size="5">Who Knows What</text>
  <text x="220.7" y="88.5" class="m q" font-size="2.6">WEGNER 1986 · TRANSACTIVE MEMORY</text>
</g>

<!-- SHARED PRACTICE -->
<g id="shared-practice" transform="translate(0,-2)">
  <rect x="8" y="105" width="281" height="28" rx="2" class="band" fill="#F7D7A1"/>
  <text x="12" y="112" class="s" font-size="6">Shared Practice</text>
  <text x="12" y="119" class="s" font-size="3.4" font-style="italic">grown by Reflect, and by</text>
  <text x="12" y="123.5" class="s" font-size="3.4" font-style="italic">stacking a square on the Zone</text>
  <g class="w">
    <circle cx="86" cy="114" r="8"/><circle cx="103.7" cy="114" r="8"/><circle cx="121.5" cy="114" r="8"/>
    <circle cx="139.2" cy="114" r="8"/><circle cx="156.9" cy="114" r="8"/><circle cx="174.7" cy="114" r="8"/>
  </g>
  <g class="m q" font-size="4.2" text-anchor="middle">
    <text x="86" y="115.4">0</text><text x="103.7" y="115.4">1</text><text x="121.5" y="115.4">2</text>
    <text x="139.2" y="115.4">3</text><text x="156.9" y="115.4">4</text><text x="174.7" y="115.4">5</text>
  </g>
  <circle cx="156.9" cy="114" r="10.5" class="w" style="stroke:#905151;stroke-width:.8"/>
  <path d="M78.9,124 L78.9,127 L110.8,127 L110.8,124" class="w" style="stroke:#905151;stroke-width:.5"/>
  <text x="94.9" y="131" class="m" font-size="2.6" text-anchor="middle">PLAN DOES NOTHING</text>
  <text x="220.7" y="112" class="s" font-size="5">Shared Repertoire</text>
  <text x="220.7" y="118.5" class="m q" font-size="2.6">LAVE &amp; WENGER 1991 · WENGER 1998</text>
</g>

<!-- ADAPTABILITY -->
<g id="adaptability" transform="translate(0,-1)">
  <rect x="8" y="135" width="281" height="28" rx="2" class="band" fill="#B5C7CF"/>
  <text x="12" y="142" class="s" font-size="6">Adaptability</text>
  <text x="12" y="149" class="s" font-size="3.4" font-style="italic">grown by Reflect, Align, and</text>
  <text x="12" y="153.5" class="s" font-size="3.4" font-style="italic">Workshop, all unconditionally</text>
  <g class="w">
    <circle cx="86" cy="144" r="8"/><circle cx="103.7" cy="144" r="8"/><circle cx="121.5" cy="144" r="8"/>
    <circle cx="139.2" cy="144" r="8"/><circle cx="156.9" cy="144" r="8"/><circle cx="174.7" cy="144" r="8"/>
  </g>
  <g class="m q" font-size="4.2" text-anchor="middle">
    <text x="86" y="145.4">0</text><text x="103.7" y="145.4">1</text><text x="121.5" y="145.4">2</text>
    <text x="139.2" y="145.4">3</text><text x="156.9" y="145.4">4</text><text x="174.7" y="145.4">5</text>
  </g>
  <circle cx="156.9" cy="144" r="10.5" class="w" style="stroke:#905151;stroke-width:.8"/>
  <path d="M78.9,154 L78.9,157 L181.7,157 L181.7,154" class="w" stroke-width=".5"/>
  <text x="130.3" y="161" class="m" font-size="2.6" text-anchor="middle">SPEND THIS MUCH ADAPTABILITY EACH WEEK · WHAT IS LEFT IS LOST</text>
  <text x="220.7" y="142" class="s" font-size="5">Team Reflexivity</text>
  <text x="220.7" y="148.5" class="m q" font-size="2.6">WEST 1996</text>
</g>

<!-- STANDING - week 4 -->
<g id="standing-slot">
  <rect x="8" y="166" width="281" height="34" rx="2" fill="#F5CE89" class="r" stroke-dasharray="4 2.5"/>
  <text x="12" y="177" class="s" font-size="6">Standing</text>
  <text x="12" y="184" class="s" font-size="3.4" font-style="italic">the fifth row, on its own strip</text>
  <text x="148.5" y="180" class="m" font-size="4.4" text-anchor="middle" letter-spacing="1.2">STANDING GOES HERE, FACE DOWN</text>
  <text x="148.5" y="187" class="m q" font-size="3.2" text-anchor="middle">TURN IT OVER IN PLACE AT THE START OF WEEK 4</text>
</g>

<!-- table-placement guide - matches the same-coloured line on the neighbouring board's edge -->
<line x1="6" y1="6" x2="6" y2="200" stroke="#6E7A54" stroke-width="1"/>
<line x1="6.2" y1="200" x2="104.6" y2="200" stroke="#9C7A32" stroke-width="1"/>
<line x1="115.2" y1="200" x2="290.6" y2="200" stroke="#905151" stroke-width="1"/>
</svg>
