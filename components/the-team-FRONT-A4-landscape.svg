<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
<title>THE TEAM FRONT - the Ledger (A4 landscape)</title>
<desc>True A4 landscape (297 x 210) - SHIT HAPPENS is narrowed instead to keep the table's two rows
matching widths (see _check-table-layout.svg). One coin per row; walk it, turn it over at
the ring. Four rows: Trust, Capability, Shared Practice and Standing. Adaptability is not a row:
it is a pool of tokens on SHIT HAPPENS. Glue to cardboard;
the-team-BACK matches and goes on the reverse.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .r { stroke:#2A2620; stroke-width:.5; fill:none; }
  .w { fill:none; stroke:#2A2620; stroke-width:.55; }
  .q { fill:#000000; }
  .band { stroke:none; }
</style>

<rect width="297" height="210" fill="#FFFFFF"/>

<text x="12" y="16" class="m" font-size="7" letter-spacing="2.5">THE TEAM</text>
<text x="78" y="16" class="s" font-size="4.4" font-style="italic">It was never only the project.</text>
<text x="285.4" y="16" class="m q" font-size="3.8" text-anchor="end">THE TEAM · FROM END OF WEEK 1</text>
<line x1="11.5" y1="20" x2="285.4" y2="20" class="r"/>

<rect x="8" y="22" width="281" height="10.5" rx="1.5" class="r"/>
<text x="12" y="26" class="s" font-size="3.8" font-style="italic">One coin per row. Walk it as the track moves. At the ring, turn it over - that is a <tspan font-weight="bold">HABIT</tspan>, and it is permanent.</text>
<text x="12" y="30" class="s" font-size="3.8" font-style="italic">The coin can walk back down afterwards. It never turns back over. The left column is what the team <tspan font-style="normal">does</tspan>; the right is what it has <tspan font-style="normal">become</tspan>, and who named it.</text>

<text x="105" y="37.5" class="m" font-size="4.2" text-anchor="middle" letter-spacing=".6">START</text>
<text x="201" y="37.5" class="m" font-size="4.2" text-anchor="middle" letter-spacing=".6">FLIP → HABIT</text>
<text x="285.4" y="37.5" class="m" font-size="2.6" text-anchor="end" letter-spacing=".3">HABIT - PRINTED ON THE EVENT CARDS</text>

<!-- TRUST -->
<g id="trust">
  <rect x="8" y="40" width="281" height="34" rx="2" class="band" fill="#D3CEDF"/>
  <text x="12" y="47" class="s" font-size="6">Trust</text>
  <text x="12" y="54" class="s" font-size="3.4" font-style="italic">grown by Engagement</text>
  <g class="w">
    <circle cx="73" cy="57" r="15"/><circle cx="105" cy="57" r="15"/><circle cx="137" cy="57" r="15"/>
    <circle cx="169" cy="57" r="15"/><circle cx="201" cy="57" r="15"/><circle cx="233" cy="57" r="15"/>
  </g>
  <g class="m q" font-size="6" text-anchor="middle">
    <text x="73" y="59.2">0</text><text x="105" y="59.2">1</text><text x="137" y="59.2">2</text>
    <text x="169" y="59.2">3</text><text x="201" y="59.2">4</text><text x="233" y="59.2">5</text>
  </g>
  <circle cx="201" cy="57" r="16" class="w" style="stroke:#905151;stroke-width:.8"/>
  <text x="12" y="62" class="m" font-size="2.8">AT 0-1:</text>
  <text x="12" y="65.5" class="m" font-size="2.8">TEACH DOES NOTHING</text>
  <text x="252" y="47" class="s" font-size="5">Psychological</text>
  <text x="252" y="52.5" class="s" font-size="5">Safety</text>
  <text x="252" y="58" class="m q" font-size="2.6">EDMONDSON 1999</text>
</g>

<!-- CAPABILITY -->
<g id="capability">
  <rect x="8" y="78" width="281" height="34" rx="2" class="band" fill="#C7CFB5"/>
  <text x="12" y="85" class="s" font-size="6">Capability</text>
  <text x="12" y="92" class="s" font-size="3.4" font-style="italic">grown by filling a whole</text>
  <text x="12" y="96.5" class="s" font-size="3.4" font-style="italic">row or column on the Zone</text>
  <g class="w">
    <circle cx="73" cy="95" r="15"/><circle cx="105" cy="95" r="15"/><circle cx="137" cy="95" r="15"/>
    <circle cx="169" cy="95" r="15"/><circle cx="201" cy="95" r="15"/><circle cx="233" cy="95" r="15"/>
  </g>
  <g class="m q" font-size="6" text-anchor="middle">
    <text x="73" y="97.2">0</text><text x="105" y="97.2">1</text><text x="137" y="97.2">2</text>
    <text x="169" y="97.2">3</text><text x="201" y="97.2">4</text><text x="233" y="97.2">5</text>
  </g>
  <circle cx="201" cy="95" r="16" class="w" style="stroke:#905151;stroke-width:.8"/>
  <text x="12" y="102" class="m" font-size="2.8">AT 0-1:</text>
  <text x="12" y="105.5" class="m" font-size="2.8">FIRST WORK DOES NOTHING</text>
  <text x="252" y="85" class="s" font-size="5">Who Knows What</text>
  <text x="252" y="90.5" class="m q" font-size="2.6">WEGNER 1986 ·</text>
  <text x="252" y="94" class="m q" font-size="2.6">TRANSACTIVE MEMORY</text>
</g>

<!-- SHARED PRACTICE -->
<g id="shared-practice">
  <rect x="8" y="116" width="281" height="34" rx="2" class="band" fill="#F7D7A1"/>
  <text x="12" y="123" class="s" font-size="6">Shared Practice</text>
  <text x="12" y="130" class="s" font-size="3.4" font-style="italic">grown by Reflect, and by</text>
  <text x="12" y="134.5" class="s" font-size="3.4" font-style="italic">stacking a square on the Zone</text>
  <g class="w">
    <circle cx="73" cy="133" r="15"/><circle cx="105" cy="133" r="15"/><circle cx="137" cy="133" r="15"/>
    <circle cx="169" cy="133" r="15"/><circle cx="201" cy="133" r="15"/><circle cx="233" cy="133" r="15"/>
  </g>
  <g class="m q" font-size="6" text-anchor="middle">
    <text x="73" y="135.2">0</text><text x="105" y="135.2">1</text><text x="137" y="135.2">2</text>
    <text x="169" y="135.2">3</text><text x="201" y="135.2">4</text><text x="233" y="135.2">5</text>
  </g>
  <circle cx="201" cy="133" r="16" class="w" style="stroke:#905151;stroke-width:.8"/>
  <text x="12" y="140" class="m" font-size="2.8">AT 0-1:</text>
  <text x="12" y="143.5" class="m" font-size="2.8">PLAN DOES NOTHING</text>
  <text x="252" y="123" class="s" font-size="5">Shared Repertoire</text>
  <text x="252" y="128.5" class="m q" font-size="2.6">LAVE &amp; WENGER 1991 ·</text>
  <text x="252" y="132" class="m q" font-size="2.6">WENGER 1998</text>
</g>

<!-- STANDING - on the board from the start; the coin mirrors the highest Capital, it is never walked -->
<g id="standing">
  <rect x="8" y="154" width="281" height="34" rx="2" class="band" fill="#D9D3C4"/>
  <text x="12" y="161" class="s" font-size="6">Standing</text>
  <text x="12" y="168" class="s" font-size="3.4" font-style="italic">grown by nobody</text>
  <text x="12" y="172.5" class="s" font-size="3.4" font-style="italic">starts on 0</text>
  <g class="w">
    <circle cx="73" cy="171" r="15"/><circle cx="105" cy="171" r="15"/><circle cx="137" cy="171" r="15"/>
    <circle cx="169" cy="171" r="15"/><circle cx="201" cy="171" r="15"/><circle cx="233" cy="171" r="15"/>
  </g>
  <g class="m q" font-size="6" text-anchor="middle">
    <text x="73" y="173.2">0</text><text x="105" y="173.2">1</text><text x="137" y="173.2">2</text>
    <text x="169" y="173.2">3</text><text x="201" y="173.2">4</text><text x="233" y="173.2">5</text>
  </g>
  <circle cx="201" cy="171" r="16" class="w" style="stroke:#905151;stroke-width:.8"/>
  <text x="12" y="178" class="m" font-size="2.8">NOT GROWN - IT MIRRORS</text>
  <text x="12" y="181.5" class="m" font-size="2.8">THE HIGHEST CAPITAL</text>
  <text x="12" y="185" class="m" font-size="2.8">AT THE TABLE</text>
  <text x="252" y="161" class="s" font-size="5">Authorized Voice</text>
  <text x="252" y="167.5" class="s" font-size="3.4" font-style="italic">Once a week: cancel a</text>
  <text x="252" y="171.5" class="s" font-size="3.4" font-style="italic">Management or Customer</text>
  <text x="252" y="175.5" class="s" font-size="3.4" font-style="italic">Event outright.</text>
  <text x="252" y="181.5" class="m q" font-size="2.6">BOURDIEU 1991</text>
</g>
<text x="201" y="152.6" class="m" font-size="2.6" text-anchor="middle">FLIP AT 4</text>

<text x="12" y="194" class="s" font-size="3.8" font-style="italic">Adaptability is not a track here: it is a pool of tokens, kept on SHIT HAPPENS, with the Team Reflexivity coin beside it.</text>

<!-- table-placement guide - matches the same-coloured line on the neighbouring board's edge -->
<line x1="6" y1="6" x2="6" y2="200" stroke="#6E7A54" stroke-width="1"/>
<line x1="6.2" y1="200" x2="104.6" y2="200" stroke="#9C7A32" stroke-width="1"/>
<line x1="115.2" y1="200" x2="290.6" y2="200" stroke="#905151" stroke-width="1"/>
</svg>
