<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
<title>Board 4 FRONT — The Zone: the shared skill grid (A4 landscape)</title>
<desc>One board for the whole table. Rows are education, columns are the tool you work through;
a square is the practice that training makes with that instrument. Both axes are Bourdieu's
transmissible forms of capital - institutionalised and objectified - so everything on this board
can be passed on. Upbringing, values and instinct are not here: they cannot. Squares are 20 mm,
one player tile. Same page frame as sheet 3. Print at 100%. This sheet is week-1 content only -
How Learn/Teach works and what the Ledger reads off this grid live on board 4b instead, added
to the table at week 3 - the same week the Specimen panel on each person board starts being read.</desc>

