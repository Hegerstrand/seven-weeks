<rect x="166" y="36" width="119" height="104" rx="2" class="r" stroke-dasharray="3 2"/>
<text x="225.5" y="44" class="m q" font-size="3.2" letter-spacing="1" text-anchor="middle">BOARD 4b GOES HERE · FROM WEEK 3</text>
<text x="225.5" y="86" class="s q" font-size="3.4" font-style="italic" text-anchor="middle">How you cover a square, and what the Ledger reads off this grid, are on board 4b</text>
<text x="225.5" y="90.5" class="s q" font-size="3.4" font-style="italic" text-anchor="middle">from week 3 - they need Learn/Teach, and that doesn't exist yet.</text>

<line x1="12" y1="158" x2="285" y2="158" class="r"/>
<text x="12" y="166" class="m" font-size="4.4" letter-spacing="1.2">WHAT YOU CAN DO</text>
<text x="12" y="170.5" class="s" font-size="3.8" font-style="italic">Rows are what you were trained in, columns are what you work through - a square is the practice <tspan font-style="normal">that</tspan> training makes with <tspan font-style="normal">that</tspan> instrument,</text>
<text x="12" y="175" class="s" font-size="3.8" font-style="italic">and everyone covers squares on the same board, so the whole table can see who can do what.</text>
<text x="12" y="180.5" class="s" font-size="3.8">Once every row <tspan font-style="italic">in play</tspan> in a column is covered, that column's Activity card produces <tspan font-weight="bold">+1</tspan> more than its printed value - nothing yet if it's only half covered.</text>
<text x="12" y="186" class="s" font-size="3.4" font-style="italic">4 players: exactly one Legs row starts empty and stays out of the count all game - nobody can ever Learn or Teach into a row nobody started on.</text>

<text x="12" y="202" class="s" font-size="3" font-style="italic">Upbringing, values and instinct are not on this board. Bourdieu's embodied capital cannot be handed over - only a training and an instrument can, and those are the two axes here.</text>

