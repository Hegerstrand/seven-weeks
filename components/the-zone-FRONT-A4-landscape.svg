<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
<title>THE ZONE FRONT - the team's 5x5 board, covered with two-sided tiles (A4 landscape)</title>
<desc>One board for the whole table. Rows are education, columns are the skill you work through; a
square is what that training does with that instrument. It is the same 5x5 grid as the SKILLS grid
on every person board (the SPECIMEN): each character marks their own squares there, and the team
covers the same square here with a 20 mm two-sided tile - one-person face when one of you covers
it, stacked face when two or more do. Both axes are Bourdieu's transmissible forms of capital -
institutionalised and objectified - so everything here can be passed on. Upbringing, values and
instinct are not here: they cannot. Same page frame as THE TEAM. Print at 100%. This sheet is
week-1 content only - how Learn/Teach works and what the Ledger reads off the tiles live on THE
DEVELOPMENT instead, added to the table at week 3.</desc>

<style>
  .s { font-family:"EB Garamond",Garamond,Georgia,serif; fill:#000000; }
  .m { font-family:"IBM Plex Mono","Courier New",monospace; fill:#000000; }
  .r { stroke:#2A2620; stroke-width:.5; fill:none; }
  .cell { fill:none; stroke:#2A2620; stroke-width:.4; }
  .q { fill:#4A5259; }
  .ic { fill:#F2EDE0; stroke:#2A2620; stroke-width:.4; }
  .pip { fill:#2A2620; }
</style>

<defs>
  <g id="sh-head"><polygon points="3.3,0 1.65,2.86 -1.65,2.86 -3.3,0 -1.65,-2.86 1.65,-2.86" class="ic"/></g>
  <g id="sh-item"><polygon points="0,-3.9 3.9,0 0,3.9 -3.9,0" class="ic"/></g>
  <g id="p1"><circle cx="0" cy="0" r=".5" class="pip"/></g>
  <g id="p2"><circle cx="-1" cy="0" r=".5" class="pip"/><circle cx="1" cy="0" r=".5" class="pip"/></g>
  <g id="p3"><circle cx="0" cy="-1" r=".5" class="pip"/><circle cx="-1" cy=".85" r=".5" class="pip"/><circle cx="1" cy=".85" r=".5" class="pip"/></g>
  <g id="p4"><circle cx="-.8" cy="-.8" r=".45" class="pip"/><circle cx=".8" cy="-.8" r=".45" class="pip"/><circle cx="-.8" cy=".8" r=".45" class="pip"/><circle cx=".8" cy=".8" r=".45" class="pip"/></g>
  <g id="p5"><circle cx="-.8" cy="-.8" r=".4" class="pip"/><circle cx=".8" cy="-.8" r=".4" class="pip"/><circle cx="0" cy="0" r=".4" class="pip"/><circle cx="-.8" cy=".8" r=".4" class="pip"/><circle cx=".8" cy=".8" r=".4" class="pip"/></g>
  <g id="tile-one"><rect x="-3" y="-3" width="6" height="6" rx=".6" fill="#C7CFB5" stroke="#2A2620" stroke-width=".4"/><circle cx="0" cy="0" r="1.1" class="pip"/></g>
  <g id="tile-stack"><rect x="-3" y="-3" width="6" height="6" rx=".6" fill="#F7D7A1" stroke="#2A2620" stroke-width=".4"/><circle cx="-.7" cy="-.7" r="1.1" fill="#F7D7A1" stroke="#2A2620" stroke-width=".35"/><circle cx=".7" cy=".7" r="1.1" class="pip"/></g>
</defs>

<rect width="297" height="210" fill="#FFFFFF"/>

<text x="12" y="16" class="m" font-size="7" letter-spacing="2.5">THE ZONE</text>
<text x="78" y="16" class="s" font-size="4.4" font-style="italic">what you can reach from what you already have</text>
<text x="285" y="16" class="m q" font-size="3.8" text-anchor="end">THE ZONE · FROM WEEK 1</text>
<line x1="12" y1="20" x2="285" y2="20" class="r"/>

<g transform="translate(-16,0)">
<g class="m q" font-size="2.6" text-anchor="middle">
  <text x="72" y="36.5">LAPTOP</text><text x="92" y="36.5">COFFEE CUP</text><text x="112" y="36.5">CLIPBOARD</text>
  <text x="132" y="36.5">WRENCH</text><text x="152" y="36.5">CALENDAR</text>
</g>
<text x="112" y="27" class="m q" font-size="2.8" letter-spacing="1" text-anchor="middle">SKILL</text>
<g transform="translate(72,31) scale(.6)"><use href="#sh-item"/><use href="#p1"/></g>
<g transform="translate(92,31) scale(.6)"><use href="#sh-item"/><use href="#p2"/></g>
<g transform="translate(112,31) scale(.6)"><use href="#sh-item"/><use href="#p3"/></g>
<g transform="translate(132,31) scale(.6)"><use href="#sh-item"/><use href="#p4"/></g>
<g transform="translate(152,31) scale(.6)"><use href="#sh-item"/><use href="#p5"/></g>

<g transform="translate(30,101) rotate(-90)"><text x="0" y="0" class="m q" font-size="2.8" letter-spacing=".8">EDUCATION</text></g>
<g transform="translate(58.5,49.5) scale(.72)"><use href="#sh-head"/><use href="#p1"/></g>
<g transform="translate(58.5,69.5) scale(.72)"><use href="#sh-head"/><use href="#p2"/></g>
<g transform="translate(58.5,89.5) scale(.72)"><use href="#sh-head"/><use href="#p3"/></g>
<g transform="translate(58.5,109.5) scale(.72)"><use href="#sh-head"/><use href="#p4"/></g>
<g transform="translate(58.5,129.5) scale(.72)"><use href="#sh-head"/><use href="#p5"/></g>
<g class="s" font-size="3.4" text-anchor="end">
  <text x="55" y="49.5">Technical</text>
  <text x="55" y="69.5">Social</text>
  <text x="55" y="89.5">Commercial</text>
  <text x="55" y="109.5">Analytical</text>
  <text x="55" y="129.5">Organisational</text>
</g>

<g class="cell">
  <rect x="62" y="40" width="20" height="20"/><rect x="82" y="40" width="20" height="20"/><rect x="102" y="40" width="20" height="20"/><rect x="122" y="40" width="20" height="20"/><rect x="142" y="40" width="20" height="20"/>
  <rect x="62" y="60" width="20" height="20"/><rect x="82" y="60" width="20" height="20"/><rect x="102" y="60" width="20" height="20"/><rect x="122" y="60" width="20" height="20"/><rect x="142" y="60" width="20" height="20"/>
  <rect x="62" y="80" width="20" height="20"/><rect x="82" y="80" width="20" height="20"/><rect x="102" y="80" width="20" height="20"/><rect x="122" y="80" width="20" height="20"/><rect x="142" y="80" width="20" height="20"/>
  <rect x="62" y="100" width="20" height="20"/><rect x="82" y="100" width="20" height="20"/><rect x="102" y="100" width="20" height="20"/><rect x="122" y="100" width="20" height="20"/><rect x="142" y="100" width="20" height="20"/>
  <rect x="62" y="120" width="20" height="20"/><rect x="82" y="120" width="20" height="20"/><rect x="102" y="120" width="20" height="20"/><rect x="122" y="120" width="20" height="20"/><rect x="142" y="120" width="20" height="20"/>
</g>
<rect x="62" y="40" width="100" height="100" class="r" stroke-width=".8"/>
</g>

<use href="#tile-one" x="15" y="145"/>
<text x="21" y="146.2" class="s q" font-size="3.4" font-style="italic">One of you covers this square.</text>
<use href="#tile-stack" x="15" y="152"/>
<text x="21" y="153.2" class="s q" font-size="3.4" font-style="italic">Flipped: two or more of you do (stacked).</text>

<rect x="166" y="36" width="119" height="104" rx="2" class="r" stroke-dasharray="3 2"/>
<text x="225.5" y="44" class="m q" font-size="3.2" letter-spacing="1" text-anchor="middle">THE DEVELOPMENT GOES HERE · FROM WEEK 3</text>
<text x="225.5" y="86" class="s q" font-size="3.4" font-style="italic" text-anchor="middle">How you cover a square, and what the Ledger reads off the tiles, are on THE DEVELOPMENT</text>
<text x="225.5" y="90.5" class="s q" font-size="3.4" font-style="italic" text-anchor="middle">from week 3. Learn and Teach open in week 2; the tiles are read here.</text>

<line x1="12" y1="158" x2="285" y2="158" class="r"/>
<text x="12" y="166" class="m" font-size="4.4" letter-spacing="1.2">WHAT YOU CAN DO</text>
<text x="12" y="170.5" class="s" font-size="3.8" font-style="italic">Rows are what you were trained in, columns are what you work through - a square is what <tspan font-style="normal">that</tspan> training does with <tspan font-style="normal">that</tspan> instrument.</text>
<text x="12" y="175.5" class="s" font-size="3.8" font-style="italic">Each of you has this same grid on your own person board (the SPECIMEN) and marks your own squares there; the team covers them here.</text>
<text x="12" y="180.5" class="s" font-size="3.8">You start on one square: <tspan font-weight="bold">your Head's row where it meets your Item's column</tspan>. From week 2, whoever Learns or is Taught marks their sheet, <tspan font-weight="bold">then tiles the Zone</tspan>.</text>
<text x="12" y="185.5" class="s" font-size="3.4" font-style="italic">Everyone can read everyone's sheet: it is how you know who to ask, and who to teach. What the tiles pay is on THE DEVELOPMENT.</text>

<text x="12" y="202" class="s" font-size="3" font-style="italic">Upbringing, values and instinct are not on this board. Bourdieu's embodied capital cannot be handed over - only a training and an instrument can, and those are the two axes here.</text>

<!-- table-placement guide - matches the same-coloured line on the neighbouring board's edge -->
<line x1="291" y1="6" x2="291" y2="204" stroke="#6E7A54" stroke-width="1"/>
<line x1="6" y1="204" x2="291" y2="204" stroke="#3F5B66" stroke-width="1"/>
</svg>
