<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Theory: habitus</title>
<style>
.s{font-family:"EB Garamond",Garamond,Georgia,serif;fill:#000}
.m{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace;fill:#000}
.i{font-style:italic}.b{font-weight:700}.k{stroke:#2A2620;stroke-width:3}
</style>
<rect width="1920" height="1080" fill="#FBF8F0"/>
<rect width="1920" height="92" fill="#F0E3D1"/><path d="M0 92H1920" class="k" fill="none"/>
<text class="m" x="64" y="60" font-size="28" letter-spacing="3">THE THEORY · CARD 09 · THE FIGURE: HABITUS</text>
<text class="m" x="1856" y="60" font-size="28" letter-spacing="3" text-anchor="end">OPTIONAL READING · NOT RULES</text>

<text class="m b" x="64" y="200" font-size="52">HABITUS: WHO YOU ARRIVE AS</text>
<text class="s i" x="64" y="262" font-size="40">History made into instinct. Theory, not experiment.</text>

<text class="m b" x="64" y="338" font-size="26" letter-spacing="2">WHAT THE THEORY SAYS</text>
<path d="M64 354H930" class="k" fill="none" stroke-width="2"/>
<g fill="#2A2620"><rect x="64" y="388" width="14" height="14"/><rect x="64" y="540" width="14" height="14"/><rect x="64" y="692" width="14" height="14"/></g>
<g class="s" font-size="34">
<text x="100" y="410"><tspan x="100">Bourdieu (1977, 1990): habitus is the</tspan><tspan x="100" dy="44">durable dispositions people carry from</tspan><tspan x="100" dy="44">upbringing, education and experience.</tspan></text>
<text x="100" y="562"><tspan x="100">It feels natural. Ways of seeing and</tspan><tspan x="100" dy="44">acting arrive without calculation, and fit</tspan><tspan x="100" dy="44">some settings better than others.</tspan></text>
<text x="100" y="714"><tspan x="100">It changes slowly. When a setting changes</tspan><tspan x="100" dy="44">fast, old instincts keep firing. Bourdieu</tspan><tspan x="100" dy="44">called this hysteresis.</tspan></text>
</g>

<rect x="990" y="290" width="866" height="640" rx="14" fill="#F0E3D1" class="k"/>
<text class="m b" x="1030" y="348" font-size="26" letter-spacing="2">IN THE GAME</text>
<g fill="#2A2620"><rect x="1030" y="390" width="14" height="14"/><rect x="1030" y="498" width="14" height="14"/><rect x="1030" y="606" width="14" height="14"/><rect x="1030" y="714" width="14" height="14"/></g>
<g class="s" font-size="34">
<text x="1066" y="412"><tspan x="1066">You are dealt your parts. Nobody picks</tspan><tspan x="1066" dy="44">their upbringing or their schooling.</tspan></text>
<text x="1066" y="520"><tspan x="1066">Every part pairs a strength with a</tspan><tspan x="1066" dy="44">tendency. No build is simply better.</tspan></text>
<text x="1066" y="628"><tspan x="1066">Your values decide which Events wear</tspan><tspan x="1066" dy="44">you down and which you shrug off.</tspan></text>
<text x="1066" y="736"><tspan x="1066">The Engage instinct helps in weeks 1 to</tspan><tspan x="1066" dy="44">3 and costs you in weeks 5 and 6: the</tspan><tspan x="1066" dy="44">setting moved on, the instinct did not.</tspan></text>
</g>

<path d="M64 962H1856" class="k" fill="none" stroke-width="2"/>
<text class="s" x="64" y="1004" font-size="26"><tspan class="b">READ. </tspan>Bourdieu, Outline of a Theory of Practice (1977) · Bourdieu, The Logic of Practice (1990)</text>
<text class="s i" x="64" y="1044" font-size="24">A designer's summary, not a quotation. Check the original before you cite it.</text>
</svg>
