<text class="m b" x="960" y="810" font-size="48" text-anchor="middle">22 WORK. 35 DAYS.</text>
<text class="s i" x="960" y="872" font-size="42" text-anchor="middle">Not every day can be Work. That gap is the game.</text>

<rect y="940" width="1920" height="140" fill="#EFE4D3"/><path d="M0 940H1920" class="k" fill="none"/>
<text class="m b" x="64" y="1002" font-size="30" letter-spacing="3">NOW</text>
<text class="s" x="190" y="1002" font-size="38"><tspan x="190">Pick a Project card and seat it. Read the six features aloud.</tspan><tspan x="190" dy="48">Which would you start with, and why?</tspan></text>
