<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Week 1: five days, and you choose them</title>
<style>
.s{font-family:"EB Garamond",Garamond,Georgia,serif;fill:#000}
.m{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace;fill:#000}
.i{font-style:italic}.b{font-weight:700}.k{stroke:#2A2620;stroke-width:3}
</style>
<rect width="1920" height="1080" fill="#F2EDE0"/>
<rect width="1920" height="92" fill="#EFE4D3"/><path d="M0 92H1920" class="k" fill="none"/>
<text class="m" x="64" y="60" font-size="28" letter-spacing="3">WEEK 1 · THE GAME</text>
<text class="m" x="1856" y="60" font-size="28" letter-spacing="3" text-anchor="end">HIGH-PERFORMANCE TEAM</text>

<text class="m b" x="64" y="190" font-size="56">WEEK 1 · FIVE DAYS, AND YOU CHOOSE THEM</text>
<text class="s i" x="64" y="262" font-size="40">That is the entire idea of week 1. Everything else is still covered.</text>

<g class="k" fill="#FBF8F0" stroke-dasharray="14 8">
  <rect x="64" y="300" width="340" height="170" rx="12"/><rect x="428" y="300" width="340" height="170" rx="12"/><rect x="792" y="300" width="340" height="170" rx="12"/>
  <rect x="1156" y="300" width="340" height="170" rx="12"/><rect x="1520" y="300" width="336" height="170" rx="12"/>
</g>
<g class="m b" font-size="30" letter-spacing="3" text-anchor="middle">
  <text x="234" y="352">MONDAY</text><text x="598" y="352">TUESDAY</text><text x="962" y="352">WEDNESDAY</text><text x="1326" y="352">THURSDAY</text><text x="1688" y="352">FRIDAY</text>
</g>
<g class="s i" font-size="34" text-anchor="middle">
  <text x="234" y="420">one card</text><text x="598" y="420">one card</text><text x="962" y="420">one card</text><text x="1326" y="420">one card</text><text x="1688" y="420">one card</text>
</g>
<text class="s i" x="960" y="530" font-size="36" text-anchor="middle">The cards belong to the team. Nobody plays one. The week is a set, not a sequence.</text>

<text class="m b" x="64" y="590" font-size="26" letter-spacing="2">WEEK 1 USES STEPS 1, 5 AND 6 ONLY</text>
<g class="k">
  <rect x="64" y="610" width="580" height="270" rx="14" fill="#EFE4D3"/>
  <rect x="670" y="610" width="580" height="270" rx="14" fill="#EFE4D3"/>
  <rect x="1276" y="610" width="580" height="270" rx="14" fill="#EFE4D3"/>
</g>
<g class="m b" font-size="56"><text x="92" y="680">1</text><text x="698" y="680">5</text><text x="1304" y="680">6</text></g>
<g class="m b" font-size="32" letter-spacing="2"><text x="160" y="676">PLAN</text><text x="766" y="676">THE WEEK RUNS</text><text x="1372" y="676">CLOSE</text></g>
<g class="s" font-size="34">
  <text x="92" y="744"><tspan x="92">Lay five Activity cards,</tspan><tspan x="92" dy="46">Monday to Friday.</tspan><tspan x="92" dy="46">Nothing resolves yet.</tspan></text>
  <text x="698" y="744"><tspan x="698">Resolve the five cards, in</tspan><tspan x="698" dy="46">any order. The week happens</tspan><tspan x="698" dy="46">all at once.</tspan></text>
  <text x="1304" y="744"><tspan x="1304">Bank every feature that has</tspan><tspan x="1304" dy="46">reached its Work Cost, and</tspan><tspan x="1304" dy="46">lift the locks it held.</tspan></text>
</g>

<rect y="940" width="1920" height="140" fill="#EFE4D3"/><path d="M0 940H1920" class="k" fill="none"/>
<text class="m b" x="64" y="1002" font-size="30" letter-spacing="3">NOW</text>
<text class="s" x="190" y="1002" font-size="38"><tspan x="190">Lay five cards from Work, Engagement, Learn and Celebrate.</tspan><tspan x="190" dy="48">Argue it out. Then run the week and close it.</tspan></text>
</svg>
