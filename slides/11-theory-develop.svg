<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Theory: teams develop over time</title>
<style>
.s{font-family:"EB Garamond",Garamond,Georgia,serif;fill:#000}
.m{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace;fill:#000}
.i{font-style:italic}.b{font-weight:700}.k{stroke:#2A2620;stroke-width:3}
</style>
<rect width="1920" height="1080" fill="#FBF8F0"/>
<rect width="1920" height="92" fill="#EFE4D3"/><path d="M0 92H1920" class="k" fill="none"/>
<text class="m" x="64" y="60" font-size="28" letter-spacing="3">THE THEORY · CARD 02 · THE BIG PICTURE</text>
<text class="m" x="1856" y="60" font-size="28" letter-spacing="3" text-anchor="end">OPTIONAL READING · NOT RULES</text>

<text class="m b" x="64" y="200" font-size="52">TEAMS DEVELOP OVER TIME</text>
<text class="s i" x="64" y="262" font-size="40">A team is not the same on day 1 and on day 35.</text>

<text class="m b" x="64" y="338" font-size="26" letter-spacing="2">WHAT THE RESEARCH SAYS</text>
<path d="M64 354H930" class="k" fill="none" stroke-width="2"/>
<g fill="#2A2620"><rect x="64" y="388" width="14" height="14"/><rect x="64" y="540" width="14" height="14"/><rect x="64" y="736" width="14" height="14"/></g>
<g class="s" font-size="34">
<text x="100" y="410"><tspan x="100">Tuckman (1965): groups tend to pass through</tspan><tspan x="100" dy="44">forming, storming, norming, performing.</tspan><tspan x="100" dy="44">A map, not a law.</tspan></text>
<text x="100" y="562"><tspan x="100">Gersick (1988): project teams do not</tspan><tspan x="100" dy="44">progress smoothly. The pattern from the</tspan><tspan x="100" dy="44">first meeting held until about halfway,</tspan><tspan x="100" dy="44">then came a sudden change.</tspan></text>
<text x="100" y="758"><tspan x="100">Marks, Mathieu &amp; Zaccaro (2001): teamwork</tspan><tspan x="100" dy="44">alternates between planning and action.</tspan></text>
</g>

<rect x="990" y="290" width="866" height="640" rx="14" fill="#EFE4D3" class="k"/>
<text class="m b" x="1030" y="348" font-size="26" letter-spacing="2">IN THE GAME</text>
<g fill="#2A2620"><rect x="1030" y="390" width="14" height="14"/><rect x="1030" y="498" width="14" height="14"/><rect x="1030" y="650" width="14" height="14"/></g>
<g class="s" font-size="34">
<text x="1066" y="412"><tspan x="1066">The game opens one idea a week, the way</tspan><tspan x="1066" dy="44">a team grows into its work.</tspan></text>
<text x="1066" y="520"><tspan x="1066">Every week alternates planning (lay five</tspan><tspan x="1066" dy="44">cards, face the Events) with action (the</tspan><tspan x="1066" dy="44">week runs, then you close it).</tspan></text>
<text x="1066" y="672"><tspan x="1066">Weeks 5 to 7 open nothing new: by then</tspan><tspan x="1066" dy="44">you are playing, not learning.</tspan></text>
</g>

<path d="M64 962H1856" class="k" fill="none" stroke-width="2"/>
<text class="s" x="64" y="1004" font-size="26"><tspan class="b">READ. </tspan>Tuckman, Psychological Bulletin 63 (1965) · Gersick, Academy of Management Journal 31 (1988) · Marks, Mathieu &amp; Zaccaro, AMR 26 (2001)</text>
<text class="s i" x="64" y="1044" font-size="24">A designer's summary, not a quotation. Check the original before you cite it.</text>
</svg>
