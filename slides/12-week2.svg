<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Week 2: the team turns over</title>
<style>
.s{font-family:"EB Garamond",Garamond,Georgia,serif;fill:#000}
.m{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace;fill:#000}
.i{font-style:italic}.b{font-weight:700}.k{stroke:#2A2620;stroke-width:3}
</style>
<rect width="1920" height="1080" fill="#F2EDE0"/>
<rect width="1920" height="92" fill="#EFE4D3"/><path d="M0 92H1920" class="k" fill="none"/>
<text class="m" x="64" y="60" font-size="28" letter-spacing="3">WEEK 2 · THE GAME</text>
<text class="m" x="1856" y="60" font-size="28" letter-spacing="3" text-anchor="end">HIGH-PERFORMANCE TEAM</text>

<text class="m b" x="64" y="190" font-size="56">WEEK 2 · THE TEAM TURNS OVER</text>
<text class="s i" x="64" y="262" font-size="40">It was never only the project. It is also the team.</text>

<g class="k">
  <rect x="64" y="300" width="430" height="200" rx="14" fill="#D3CEDF"/>
  <rect x="514" y="300" width="430" height="200" rx="14" fill="#D3B1B1"/>
  <rect x="64" y="520" width="430" height="200" rx="14" fill="#F7D7A1"/>
  <rect x="514" y="520" width="430" height="200" rx="14" fill="#D9D3C4"/>
</g>
<g class="m b" font-size="30" letter-spacing="2">
  <text x="88" y="350">TRUST</text><text x="538" y="350">CAPABILITY</text><text x="88" y="570">SHARED PRACTICE</text><text x="538" y="570">CAPITAL</text>
</g>
<g class="s" font-size="32">
  <text x="88" y="398"><tspan x="88">How safe it is to say</tspan><tspan x="88" dy="38">"I don't know."</tspan></text>
  <text x="538" y="398"><tspan x="538">How much the team can</tspan><tspan x="538" dy="38">get done together.</tspan></text>
  <text x="88" y="618"><tspan x="88">Common routines and</tspan><tspan x="88" dy="38">language. Familiar work</tspan><tspan x="88" dy="38">goes faster.</tspan></text>
  <text x="538" y="618"><tspan x="538">Earned in public.</tspan><tspan x="538" dy="38">Standing names whoever</tspan><tspan x="538" dy="38">holds the most.</tspan></text>
</g>

<text class="m b" x="990" y="330" font-size="26" letter-spacing="2">WHAT CHANGES TODAY</text>
<path d="M990 346H1856" class="k" fill="none" stroke-width="2"/>
<g fill="#2A2620"><rect x="990" y="378" width="14" height="14"/><rect x="990" y="486" width="14" height="14"/><rect x="990" y="594" width="14" height="14"/><rect x="990" y="658" width="14" height="14"/></g>
<g class="s" font-size="36">
  <text x="1026" y="400"><tspan x="1026">Trust moves up 1 if you played an</tspan><tspan x="1026" dy="46">Engagement in week 1.</tspan></text>
  <text x="1026" y="508"><tspan x="1026">Motivation starts. Everyone is on 3.</tspan><tspan x="1026" dy="46">The grind takes 1 as the week closes.</tspan></text>
  <text x="1026" y="616">New cards: Teach and Plan.</text>
  <text x="1026" y="680">Your upbringing and instinct now count.</text>
</g>
<rect x="990" y="736" width="866" height="110" rx="12" fill="#EFE4D3" class="k"/>
<text class="s i" x="1026" y="786" font-size="36"><tspan x="1026">Every track starts at 1, the low band.</tspan><tspan x="1026" dy="46">You climb out of it, one step a week.</tspan></text>

<rect y="940" width="1920" height="140" fill="#EFE4D3"/><path d="M0 940H1920" class="k" fill="none"/>
<text class="m b" x="64" y="1002" font-size="30" letter-spacing="3">NOW</text>
<text class="s" x="190" y="1002" font-size="38"><tspan x="190">Turn THE TEAM over. Say the three new kinds of points out loud,</tspan><tspan x="190" dy="48">and find where each one is written on the board.</tspan></text>
</svg>
