<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Learn, Teach and the Zone</title>
<style>
.s{font-family:"EB Garamond",Garamond,Georgia,serif;fill:#000}
.m{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace;fill:#000}
.i{font-style:italic}.b{font-weight:700}.k{stroke:#2A2620;stroke-width:3}
</style>
<rect width="1920" height="1080" fill="#F2EDE0"/>
<rect width="1920" height="92" fill="#EFE4D3"/><path d="M0 92H1920" class="k" fill="none"/>
<text class="m" x="64" y="60" font-size="28" letter-spacing="3">WEEK 2 · THE GAME</text>
<text class="m" x="1856" y="60" font-size="28" letter-spacing="3" text-anchor="end">HIGH-PERFORMANCE TEAM</text>

<text class="m b" x="64" y="190" font-size="56">LEARN, TEACH AND THE ZONE</text>

<rect x="64" y="236" width="900" height="200" rx="14" fill="#D3B1B1" class="k"/>
<text class="m b" x="96" y="286" font-size="28" letter-spacing="2">LEARN · ALONE</text>
<text class="s" x="96" y="342" font-size="34"><tspan x="96">Everyone marks one new square, left or</tspan><tspan x="96" dy="44">right of one they cover, in their own</tspan><tspan x="96" dy="44">row. No teacher needed.</tspan></text>

<rect x="64" y="456" width="900" height="340" rx="14" fill="#EFE4D3" class="k"/>
<text class="m b" x="96" y="506" font-size="28" letter-spacing="2">TEACH · FROM WEEK 2</text>
<text class="s" x="96" y="562" font-size="34"><tspan x="96">Up to two teachers. Each lets one person</tspan><tspan x="96" dy="44">mark a square someone already covers:</tspan><tspan x="96" dy="44">one step from the teacher's own, up, down,</tspan><tspan x="96" dy="44">left, right or diagonal. Both teachers</tspan><tspan x="96" dy="44">gain 1 Capital. Does nothing while Trust</tspan><tspan x="96" dy="44">is 1 or less.</tspan></text>

<text class="m b" x="1428" y="268" font-size="26" letter-spacing="2" text-anchor="middle">THE ZONE · EVERY TIME, TWO STEPS</text>
<text class="s" x="1428" y="312" font-size="32" text-anchor="middle">1 Mark your own SKILLS grid.  2 Cover it on THE ZONE.</text>
<path d="M1218 340H1638M1218 424H1638M1218 508H1638M1218 592H1638M1218 676H1638M1218 760H1638M1218 340V760M1302 340V760M1386 340V760M1470 340V760M1554 340V760M1638 340V760" class="k" fill="none" stroke-width="2"/>
<g class="k" stroke-width="2">
  <rect x="1392" y="346" width="72" height="72" fill="#D3B1B1"/><rect x="1392" y="430" width="72" height="72" fill="#D3B1B1"/><rect x="1476" y="430" width="72" height="72" fill="#F7D7A1"/>
  <rect x="1308" y="514" width="72" height="72" fill="#D3B1B1"/><rect x="1476" y="514" width="72" height="72" fill="#D3B1B1"/><rect x="1392" y="598" width="72" height="72" fill="#F7D7A1"/>
  <rect x="1560" y="682" width="72" height="72" fill="#D3B1B1"/>
</g>
<g fill="#2A2620"><circle cx="1428" cy="382" r="14"/><circle cx="1428" cy="466" r="14"/><circle cx="1344" cy="550" r="14"/><circle cx="1512" cy="550" r="14"/><circle cx="1596" cy="718" r="14"/><circle cx="1522" cy="476" r="12"/><circle cx="1438" cy="644" r="12"/></g>
<g fill="#F7D7A1" stroke="#2A2620" stroke-width="2"><circle cx="1502" cy="456" r="12"/><circle cx="1418" cy="624" r="12"/></g>
<g class="k" stroke-width="2"><rect x="1000" y="782" width="44" height="44" fill="#D3B1B1"/><rect x="1380" y="782" width="44" height="44" fill="#F7D7A1"/></g>
<circle cx="1022" cy="804" r="11" fill="#2A2620"/><circle cx="1393" cy="795" r="9" fill="#F7D7A1" stroke="#2A2620" stroke-width="2"/><circle cx="1411" cy="813" r="9" fill="#2A2620"/>
<g class="s" font-size="32"><text x="1058" y="816">one of you covers it</text><text x="1438" y="816">two or more cover it</text></g>

<rect x="64" y="846" width="880" height="78" rx="12" fill="#D3B1B1" class="k"/>
<text class="s" x="96" y="896" font-size="34">A full row or column covered: Capability +1.</text>
<rect x="976" y="846" width="880" height="78" rx="12" fill="#F7D7A1" class="k"/>
<text class="s" x="1008" y="896" font-size="34">A tile flips to stacked: Shared Practice +1.</text>

<rect y="940" width="1920" height="140" fill="#EFE4D3"/><path d="M0 940H1920" class="k" fill="none"/>
<text class="m b" x="64" y="1002" font-size="30" letter-spacing="3">NOW</text>
<text class="s" x="190" y="1002" font-size="38"><tspan x="190">Whoever learns: mark your own sheet first, then cover the Zone.</tspan><tspan x="190" dy="48">Put a tile down, or flip the one that is there.</tspan></text>
</svg>
