<text class="m" x="1856" y="60" font-size="28" letter-spacing="3" text-anchor="end">HIGH-PERFORMANCE TEAM</text>

<text class="m b" x="64" y="190" font-size="56">WEEK 4 · STEP BY STEP</text>
<text class="s i" x="64" y="250" font-size="40">The same seven steps every week. Tick each one aloud before you move on.</text>

