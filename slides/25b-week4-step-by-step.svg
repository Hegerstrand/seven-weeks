<rect y="940" width="1920" height="140" fill="#EFE4D3"/><path d="M0 940H1920" class="k" fill="none"/>
<text class="m b" x="64" y="1002" font-size="30" letter-spacing="3">KEEP</text>
<text class="s" x="210" y="1002" font-size="38"><tspan x="210">Leave this up all week. Week 4 adds THE DEVELOPMENT (step 6).</tspan><tspan x="210" dy="48">For the next week, go back to the round-up slide, then start here again.</tspan></text>
