  <text x="152" y="695">5 THE WEEK RUNS</text><text x="152" y="787">6 CLOSE</text><text x="152" y="879">7 MOTIVATION</text>
</g>
<g class="s" font-size="32">
  <text x="560" y="326">Lay five cards. Which feature gets the Work this week?</text>
  <text x="560" y="418">Draw 2 Events. Read them out. Nothing resolves yet.</text>
  <text x="560" y="510">Count the pool. Pay tokens, play a Hero, or take it?</text>
  <text x="560" y="602">Resolve every Event nobody cancelled.</text>
  <text x="560" y="694">Resolve the five cards, in any order.</text>
  <text x="560" y="786">Bank features, walk the Ledger, add tokens.</text>
  <text x="560" y="878">One net number each. Anyone on 0 quits. Move the week marker.</text>
</g>
