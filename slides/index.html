<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>High-Performance Team - slides</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; overflow: hidden;
    font-family: "IBM Plex Mono", Consolas, "Courier New", monospace; }
  body.idle { cursor: none; }
  #slide { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; }
  #bar { position: fixed; left: 0; bottom: 0; height: 4px; background: #C08A3E; width: 0; transition: width .2s; }
  #count, #help { position: fixed; background: rgba(0,0,0,.78); padding: 6px 12px; font-size: 14px; border-radius: 4px; transition: opacity .3s; }
  #count { right: 12px; bottom: 14px; }
  body.idle #count { opacity: 0; }
  #help { left: 50%; top: 50%; transform: translate(-50%,-50%); padding: 18px 26px; line-height: 1.7; font-size: 18px; display: none; z-index: 5; }
  #help b { display: inline-block; min-width: 9ch; color: #E8C547; }
  #blank { position: fixed; inset: 0; background: #000; display: none; z-index: 8; }
  #grid { position: fixed; inset: 0; background: #1b1b1b; overflow-y: auto; display: none; z-index: 6;
    padding: 20px 28px 40px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  #grid h2 { grid-column: 1 / -1; margin: 18px 0 0; font-size: 16px; letter-spacing: 3px; color: #E8C547; }
  #grid figure { margin: 0; cursor: pointer; }
  #grid img { width: 100%; display: block; border: 3px solid #333; background: #F2EDE0; box-sizing: border-box; }
  #grid figure.cur img { border-color: #E8C547; }
  #grid figure:hover img { border-color: #fff; }
  #grid figcaption { font-size: 13px; padding-top: 4px; }
  #grid .tag { background: #B5C7CF; color: #000; padding: 0 5px; margin-left: 6px; font-size: 11px; }
</style>
</head>
<body>
<img id="slide" alt="">
<div id="bar"></div>
<div id="count"></div>
<div id="help">
  <b>Right / Space</b>next slide<br>
  <b>Left</b>previous slide<br>
  <b>G</b>overview, click to jump<br>
  <b>F</b>full screen<br>
  <b>B</b>black screen (toggle)<br>
  <b>Home / End</b>first / last<br>
  <b>?</b>this help
</div>
<div id="blank"></div>
<div id="grid"></div>

<script src="slides.js"></script>
<script>
(function () {
  var img = document.getElementById('slide'), bar = document.getElementById('bar'),
      count = document.getElementById('count'), help = document.getElementById('help'),
      blank = document.getElementById('blank'), grid = document.getElementById('grid');
  var cur = 0, idleTimer;

  function show(n) {
    cur = Math.max(0, Math.min(SLIDES.length - 1, n));
    var s = SLIDES[cur];
    img.src = s[0];
    img.alt = s[1];
    document.title = (cur + 1) + '. ' + s[1] + ' - High-Performance Team';
    bar.style.width = ((cur + 1) / SLIDES.length * 100) + '%';
    count.textContent = (cur + 1) + ' / ' + SLIDES.length + '  ' + s[2] + ' · ' + s[1];
    try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {}
    if (SLIDES[cur + 1]) { new Image().src = SLIDES[cur + 1][0]; }
  }

  function buildGrid() {
    grid.innerHTML = '';
    var chapter = null;
    SLIDES.forEach(function (s, i) {
      if (s[2] !== chapter) {
        chapter = s[2];
        var h = document.createElement('h2');
        h.textContent = chapter.toUpperCase();
        grid.appendChild(h);
      }
      var f = document.createElement('figure');
      if (i === cur) { f.className = 'cur'; }
      var im = document.createElement('img');
      im.src = s[0]; im.loading = 'lazy'; im.alt = s[1];
      var c = document.createElement('figcaption');
      c.textContent = (i + 1) + '. ' + s[1];
      if (s[0].indexOf('-theory-') !== -1) {
        var t = document.createElement('span');
        t.className = 'tag'; t.textContent = 'THEORY';
        c.appendChild(t);
      }
      f.appendChild(im); f.appendChild(c);
      f.addEventListener('click', function () { toggleGrid(false); show(i); });
      grid.appendChild(f);
    });
  }

  function gridOpen() { return grid.style.display === 'grid'; }
  function toggleGrid(on) {
    if (on === undefined) { on = !gridOpen(); }
    if (on) { buildGrid(); }
    grid.style.display = on ? 'grid' : 'none';
    if (on) {
      var c = grid.querySelector('.cur');
      if (c) { c.scrollIntoView({ block: 'center' }); }
    }
  }

  function toggleFullscreen() {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else { document.documentElement.requestFullscreen(); }
  }

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) { return; }
    var k = e.key;
    if (gridOpen()) {
      if (k === 'Escape' || k === 'g' || k === 'G') { toggleGrid(false); e.preventDefault(); }
      return;
    }
    if (k === 'b' || k === 'B' || k === '.') { blank.style.display = blank.style.display === 'block' ? 'none' : 'block'; return; }
    if (blank.style.display === 'block') { blank.style.display = 'none'; return; }
    if (k === '?' || k === 'h' || k === 'H') { help.style.display = help.style.display === 'block' ? 'none' : 'block'; return; }
    help.style.display = 'none';
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Enter' || k === 'n') { show(cur + 1); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace' || k === 'p') { show(cur - 1); e.preventDefault(); }
    else if (k === 'Home') { show(0); }
    else if (k === 'End') { show(SLIDES.length - 1); }
    else if (k === 'g' || k === 'G' || k === 'o' || k === 'O') { toggleGrid(true); }
    else if (k === 'f' || k === 'F') { toggleFullscreen(); }
  });

  img.addEventListener('click', function (e) {
    help.style.display = 'none';
    show(e.clientX < window.innerWidth / 3 ? cur - 1 : cur + 1);
  });

  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 2500);
  }
  document.addEventListener('mousemove', wake);
  wake();

  window.addEventListener('hashchange', function () {
    var n = parseInt(location.hash.slice(1), 10);
    if (n && n - 1 !== cur) { show(n - 1); }
  });

  var start = parseInt(location.hash.slice(1), 10);
  show(start ? start - 1 : 0);
})();
</script>
</body>
</html>
